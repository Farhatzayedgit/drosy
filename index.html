<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دروسي — إدارة الدروس الخصوصية</title>
<!-- ============================================================
     تثبيت البرنامج كتطبيق على الموبايل وسطح المكتب
     ============================================================ -->
<meta name="theme-color" content="#014A59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دروسي">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="إدارة الدروس الخصوصية — المجموعات والحضور والتحصيل">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23014A59'/%3E%3Cg stroke='%23ffffff' stroke-opacity='.18' stroke-width='2'%3E%3Cpath d='M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512'/%3E%3C/g%3E%3Ctext x='256' y='350' font-family='Georgia,serif' font-size='260' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23014A59'/%3E%3Cg stroke='%23ffffff' stroke-opacity='.18' stroke-width='2'%3E%3Cpath d='M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512'/%3E%3C/g%3E%3Ctext x='256' y='350' font-family='Georgia,serif' font-size='260' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">
<link rel="manifest" id="mf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   هوية بصرية لمدرّس رياضيات: ورق المربعات والمخططات الهندسية.
   خلفية بشبكة خفيفة زي كراسة الرسم البياني، وحبر أزرق عميق،
   ولون واحد للفلوس. الشبكة هي التوقيع البصري — بتظهر في كل
   خلفية وبتدي إحساس الدقة والحساب.
   ============================================================ */
:root{
  /* الباليتة مستخرجة من صور التطبيق نفسه:
     #014A59 غامق · #0E877E فاتح · برتقالي للأزرار المهمة */
  --paper:#F6F7F5; --card:#FFFFFF; --ink:#014A59; --line:#DCE6E4; --line2:#EDF2F1;
  --mut:#6A7F80; --grid:#E2ECEA;
  --seal:#0E877E; --seal-l:#E3F3F1;        /* الأخضر المزرق */
  --ok:#0E877E; --ok-l:#E3F3F1;
  --warn:#E8930C; --warn-l:#FDF3E3;        /* البرتقالي */
  --bad:#D2504A; --bad-l:#FBECEB;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/26px 26px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/26px 26px,
    var(--paper);
  color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%}
h1,h2,h3,.dsp{font-family:Cairo,system-ui,sans-serif;font-weight:800;margin:0;line-height:1.3}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

/* ---------- الهيكل ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
     padding:11px 14px;display:flex;align-items:center;gap:9px;
     background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
     background-size:22px 22px}
.top .logo{width:34px;height:34px;border-radius:10px;background:var(--seal);
     display:grid;place-items:center;font-family:Cairo;font-weight:900;font-size:17px;flex:0 0 34px}
.top h1{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{display:block;font-size:11px;font-weight:400;color:#9FB0C7;font-family:Tajawal}
.wrap{max-width:980px;margin:0 auto;padding:14px 12px 34px}

/* ============================================================
   القايمة الجانبية — كل الأقسام تحت بعضها على اليمين
   بتتفتح بزرار ☰ في الشريط العلوي. على الشاشات الكبيرة بتفضل
   مفتوحة جنب المحتوى، وعلى الموبايل بتنزلق فوق الصفحة.
   ============================================================ */
.side{position:fixed;top:0;bottom:0;right:0;z-index:50;width:268px;max-width:84vw;
      background:var(--card);border-inline-start:1px solid var(--line);
      transform:translateX(100%);transition:transform .22s ease;
      display:flex;flex-direction:column;overflow:hidden}
.side.on{transform:translateX(0)}
.side .sh{padding:14px 16px;border-bottom:1px solid var(--line2);
          display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff}
.side .sh .lg{width:34px;height:34px;border-radius:10px;background:var(--seal);
              display:grid;place-items:center;font-family:Cairo;font-weight:900;font-size:17px}
.side .sh b{flex:1;font-family:Cairo,sans-serif;font-size:15px}
.side .sh small{display:block;font-size:11px;font-weight:400;color:#A9C0BE}
.side .sb{flex:1;overflow-y:auto;padding:8px 8px calc(14px + env(safe-area-inset-bottom))}
.side .grp{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.1em;
           padding:12px 10px 5px;font-family:Cairo,sans-serif}
/* الأزرار جوه القايمة — لازم تكون تحت بعضها بعرض كامل.
   استخدمت a.nv في الستايل والعناصر <button> فالقاعدة مكانتش بتتطبّق. */
.side .nv{display:flex!important;align-items:center;gap:11px;padding:12px 12px;border-radius:11px;
        cursor:pointer;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;
        border:0;background:0;width:100%;text-align:right;font-family:inherit;margin-bottom:2px}
.side .nv:hover{background:var(--paper)}
.side .nv.on{background:var(--seal-l);color:var(--seal);font-weight:800}
.side .nv .i{width:26px;text-align:center;font-size:17px;flex:0 0 26px;line-height:1}
.side .nv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.side .nv .b{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--bad);
              color:#fff;font-weight:800;flex:0 0 auto}
/* عدّاد المحتوى — رمادي، وبيبهت لما يكون صفر */
.side .nv .c{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line2);
             color:var(--mut);font-weight:800;flex:0 0 auto;min-width:26px;text-align:center}
.side .nv.on .c{background:rgba(14,135,126,.16);color:var(--seal)}
.scrim{position:fixed;inset:0;background:rgba(1,74,89,.45);z-index:45;opacity:0;
       pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.burger{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.14);
        color:#fff;font-size:17px;cursor:pointer;flex:0 0 36px}

/* على الشاشات الكبيرة القايمة ثابتة — بس بعد الدخول بس.
   قبل الدخول (شاشة البوابة) البرنامج بياخد العرض كله. */
@media(min-width:1000px){
  body.in .side{transform:translateX(0);box-shadow:none}
  body.in .scrim{display:none}
  body.in .burger{display:none}
  body.in .wrap{margin-inline-end:268px;max-width:820px}
}

/* ---------- البطاقات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      margin-bottom:12px;overflow:hidden}
.card>.hd{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;
          align-items:center;gap:9px;flex-wrap:wrap}
.card>.hd h3{font-size:15.5px;flex:1;min-width:0}
.card>.bd{padding:14px}
.card>.bd.flush{padding:0}
.eyebrow{font-size:10.5px;letter-spacing:.13em;color:var(--seal);font-weight:800;
         font-family:Cairo,sans-serif}

/* ---------- الأزرار ---------- */
button,select,input,textarea{font:inherit}
.btn{background:var(--seal);color:#fff;border:0;border-radius:11px;padding:12px 16px;
     font-family:Cairo,sans-serif;font-weight:800;font-size:14.5px;cursor:pointer;transition:.14s filter}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper);filter:none}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- الحقول ---------- */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],
input[type=email],input[type=password],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--seal);outline-offset:-1px;border-color:var(--seal)}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}

/* ---------- الإحصائيات ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
      position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--line)}
.stat.money::after{background:var(--ok)} .stat.late::after{background:var(--bad)}
.stat.acc::after{background:var(--seal)} .stat.warn::after{background:var(--warn)}
.stat .k{font-size:11.5px;color:var(--mut);font-weight:600}
.stat .v{font-family:Cairo,sans-serif;font-weight:900;font-size:25px;margin-top:2px;line-height:1.1}
.stat .s{font-size:11.5px;color:var(--mut)}
.stat.money .v{color:var(--ok)} .stat.late .v{color:var(--bad)}

/* ---------- القوائم ---------- */
.item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line2);
      background:0;border-left:0;border-right:0;border-top:0;width:100%;text-align:right;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--paper)}
.av{width:38px;height:38px;border-radius:11px;background:var(--seal-l);color:var(--seal);
    display:grid;place-items:center;font-family:Cairo;font-weight:900;font-size:14px;flex:0 0 38px}
.av.w{background:var(--warn-l);color:var(--warn)}
.av.b{background:var(--bad-l);color:var(--bad)}
.av.g{background:var(--ok-l);color:var(--ok)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:#B9C4D4;font-size:19px;flex:0 0 auto}

/* ---------- الوسوم ---------- */
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--paper);
     color:var(--mut);font-weight:700;flex:0 0 auto;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.bad{background:var(--bad-l);color:var(--bad)}
.tag.code{background:var(--ink);color:#fff;letter-spacing:.06em;direction:ltr;font-family:Cairo,sans-serif}

/* شريط الشهور */
.months{display:flex;gap:3px;flex-wrap:wrap}
.mo{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line);
    background:var(--card);display:grid;place-items:center;font-size:9px;
    font-weight:800;color:#B9C4D4;font-family:Cairo,sans-serif;cursor:pointer;padding:0}
.mo.paid{background:var(--ok);border-color:var(--ok);color:#fff}
.mo.due{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.mo.next{border-style:dashed}
.mo:focus-visible{outline:2px solid var(--warn);outline-offset:1px}

/* أزرار الحضور السريعة */
.att{display:flex;gap:5px;flex:0 0 auto}
.att button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--card);cursor:pointer;font-size:14px;font-weight:800;color:var(--mut);padding:0}
.att button.on.p{background:var(--ok);border-color:var(--ok);color:#fff}
.att button.on.a{background:var(--bad);border-color:var(--bad);color:#fff}
.att button.on.l{background:var(--warn);border-color:var(--warn);color:#fff}

/* ---------- الشرائح ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
      background:var(--card);font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button small{margin-inline-start:5px;padding:1px 6px;border-radius:999px;
      background:var(--line2);color:var(--mut);font-size:10.5px;font-weight:800}
.chips button.on small{background:rgba(255,255,255,.2);color:#fff}

/* ---------- متفرقات ---------- */
.note{background:var(--paper);border:1px solid var(--line);border-radius:11px;
      padding:11px 13px;font-size:13px;color:var(--mut);line-height:1.65}
.note b{color:var(--ink)}
.note.ok{background:var(--ok-l);border-color:#BFE6D3;color:#0A6B3D}
.note.warn{background:var(--warn-l);border-color:#EBDCB0;color:#8A6200}
.note.bad{background:var(--bad-l);border-color:#EFC9C9;color:#932B2B}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .big{font-size:36px;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-family:Cairo,sans-serif;font-size:15.5px;margin-bottom:4px}
.sep{height:1px;background:var(--line2);margin:11px 0}
.hide{display:none!important}
.center{text-align:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right}
th{background:var(--paper);font-weight:800;font-size:12px;color:var(--mut);font-family:Cairo,sans-serif}
.tw{overflow-x:auto}

/* ---------- النوافذ ---------- */
.mask{position:fixed;inset:0;background:rgba(14,26,43,.5);z-index:60;display:none;
      align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.modal{background:var(--card);width:100%;max-width:580px;border-radius:18px 18px 0 0;
       max-height:92dvh;display:flex;flex-direction:column}
@media(min-width:600px){ .mask{align-items:center;padding:16px} .modal{border-radius:18px;max-height:88dvh} }
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.modal .mh h3{flex:1;font-size:16px}
.modal .mb{padding:16px;overflow:auto;flex:1}
.modal .mf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));
           border-top:1px solid var(--line2);display:flex;gap:8px}
.modal .mf .btn{flex:1}
.x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);
   cursor:pointer;font-size:16px;color:var(--mut);flex:0 0 32px}

.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);z-index:70;
       background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;font-size:13.5px;
       font-weight:600;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center}
.toast.on{opacity:1;bottom:34px}

/* زرار الإضافة العائم — برتقالي زي المرجع */
.fab{position:fixed;inset-inline-start:16px;bottom:calc(20px + env(safe-area-inset-bottom));
     z-index:35;width:56px;height:56px;border-radius:18px;border:0;background:var(--warn);
     color:#fff;font-size:26px;font-weight:300;cursor:pointer;line-height:1;
     box-shadow:0 6px 18px rgba(232,147,12,.35)}
.fab:hover{filter:brightness(1.06)}
.fab:active{transform:translateY(1px)}

/* ---------- البوابة ---------- */
.gate{min-height:calc(100dvh - 120px);display:flex;align-items:flex-start;justify-content:center}
.gwrap{width:100%;max-width:400px}
.glogo{width:64px;height:64px;border-radius:19px;background:var(--seal);color:#fff;
       display:grid;place-items:center;margin:0 auto;font-family:Cairo,sans-serif;
       font-weight:900;font-size:27px}

@media print{
  .top,.nav,.noprint,.chips{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .card{border-color:#999;break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="logo">π</div>
  <h1 id="hTitle">دروسي<small id="hSub">إدارة الدروس الخصوصية</small></h1>
  <button class="x hide" id="instBtn" data-act="install" title="ثبّت التطبيق" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">⤓</button>
  <button class="burger" data-act="toggleSide" title="القايمة">☰</button>
  <button class="x" data-act="cloud" title="السحابة" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">☁</button><button class="x" id="outBtn" data-act="gOut" title="تسجيل الخروج" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">⎋</button><button class="x" data-act="settings" title="الإعدادات" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">⚙</button>
</header>

<div class="wrap"><div id="view"></div></div>

<!-- شبكة أمان: لو البرنامج مااشتغلش (نسخة مخلوطة أو خطأ)، الرسالة دي
     بتظهر بزرار إصلاح. بتختفي تلقائيًا أول ما البرنامج يشتغل. -->
<div id="sos" style="display:none;position:fixed;inset:0;z-index:999;background:#F6F7F5;
     padding:26px 18px;font-family:system-ui,sans-serif;text-align:center;overflow:auto">
  <div style="max-width:380px;margin:40px auto;background:#fff;border:1px solid #DCE6E4;
       border-radius:16px;padding:22px">
    <div style="font-size:40px">⚠️</div>
    <h2 style="font-family:system-ui;margin:10px 0 6px;font-size:19px;color:#014A59">
      البرنامج مااشتغلش</h2>
    <p style="color:#6A7F80;font-size:14px;line-height:1.7;margin:0 0 16px">
      غالبًا فيه نسخة قديمة متخزّنة على جهازك متعارضة مع الجديدة.<br>
      اضغط الزرار ده — <b>بياناتك مش هتتلمس</b>.</p>
    <button onclick="sosFix()" style="width:100%;padding:14px;border:0;border-radius:12px;
      background:#0E877E;color:#fff;font-size:15px;font-weight:700;cursor:pointer">
      ↻ صلّح وحدّث البرنامج</button>
    <div id="sosErr" style="margin-top:14px;font-size:11px;color:#CC3B3B;
         direction:ltr;text-align:left;word-break:break-all"></div>
  </div>
</div>
<script>
/* بيمسح كل نسخة مخزّنة ويعيد التحميل — من غير ما يلمس البيانات */
function sosFix(){
  var jobs = [];
  try{
    if(window.caches && caches.keys)
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
  }catch(e){}
  Promise.all(jobs).catch(function(){}).then(function(){
    location.replace(location.pathname + "?v=" + Date.now());
  });
}

function withTimeout(pr, ms, label){
  return new Promise(function(res, rej){
    var done = false;
    var t = setTimeout(function(){
      if(done) return; done = true;
      rej(new Error("انتهت المهلة: "+(label||"الاتصال")));
    }, ms||8000);
    pr.then(function(v){ if(done) return; done=true; clearTimeout(t); res(v); })
      .catch(function(e){ if(done) return; done=true; clearTimeout(t); rej(e); });
  });
}
function fbGet(path){
  if(!fbOn()) return Promise.reject(new Error("مفيش اتصال"));

    8000, "قراءة "+path);
}
function fbSet(path, val){
  if(!fbOn()) return Promise.reject(new Error("مفيش اتصال"));

function fbPush(path, val){

/* ============================================================

var APP_VER = "5.4";
var KEY = "dorosy_v1";
var DB = null;

/* ============================================================
   ضبط بنية القاعدة
   الفايربيز بيحذف القوايم الفاضية، فالبيانات بترجع من السحابة
   وناقصة قوايم — وأول شاشة بتحاول تقراها بتقع بخطأ
   «Cannot read properties of undefined».
   الدالة دي بتتنادى بعد أي تحميل (محلي أو سحابي أو استرجاع نسخة)
   وبتضمن إن كل قايمة وكل حقل موجودين.
   ============================================================ */
var DB_LISTS = ["groups","students","pays","bookings","notices","sesDue",
                "years","res","attempts","families","exams","tasks",
                "books","sales","reminders"];
function normalizeDB(){
  if(!DB || typeof DB!=="object") DB = blank();
  var d = blank();
  if(!DB.meta || typeof DB.meta!=="object") DB.meta = d.meta;
  Object.keys(d.meta).forEach(function(k){
    if(DB.meta[k]===undefined) DB.meta[k] = d.meta[k];
  });
  DB_LISTS.forEach(function(k){ if(!Array.isArray(DB[k])) DB[k] = []; });
  if(!DB.sessions || typeof DB.sessions!=="object" || Array.isArray(DB.sessions)) DB.sessions = {};
  if(!DB.lock || typeof DB.lock!=="object") DB.lock = { on:false, pin:"", bio:false };
  if(!DB.seq) DB.seq = 1;
  if(typeof DB.curYear!=="string") DB.curYear = "";
  /* الحقول اللي جوه العناصر ممكن تكون ناقصة كمان */
  DB.exams.forEach(function(e){ if(!Array.isArray(e.qs)) e.qs=[]; if(!e.marks) e.marks={}; });
  DB.attempts.forEach(function(a){
    if(!a.answers) a.answers={}; if(!a.marks) a.marks={}; if(!a.notes) a.notes={}; });
  DB.tasks.forEach(function(t){ if(!t.done) t.done={}; });
  DB.groups.forEach(function(g){ if(!Array.isArray(g.days)) g.days=[]; });
  DB.students.forEach(function(st){ if(!Array.isArray(st.groups)) st.groups=[]; });
  DB.families.forEach(function(f){ if(!f.code) f.code=genFamCode(); });
  return DB;
}
function load(){
  try{ var r = localStorage.getItem(KEY); DB = r ? JSON.parse(r) : blank(); }
  catch(e){ DB = blank(); }
  if(!DB || !DB.meta) DB = blank();
  normalizeDB();
  ensureCodes();
  migratePayModes();        /* ترحيل آمن — بيملا الناقص بس */
  migratePays();            /* توحيد سجل الدفعات */
  migrateBillDates();       /* تواريخ بداية الاحتساب */
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast("مساحة التخزين ممتلئة"); } }
function uid(p){ return (p||"i") + (DB.seq++) + Math.random().toString(36).slice(2,6); }

/* ============================================================
   كود المجموعة — حرفين ورقمين (مثال: MA01)
   ده المفتاح الثابت للمجموعة. أي بيانات ترفعها بعد كده بتترحّل
   عليه، فحتى لو غيّرت اسم المجموعة الربط مبيضيعش.
   ============================================================ */
var CODE_L = "ABCDEFGHJKLMNPQRSTUVWXYZ";   /* من غير I و O عشان مايتلخبطوش بـ 1 و 0 */
function codeTaken(c){
  c = String(c||"").toUpperCase();
  for(var i=0;i<DB.groups.length;i++) if(String(DB.groups[i].code||"").toUpperCase()===c) return true;
  return false;
}
function genGroupCode(seed){
  /* بنحاول نطلّع حرفين من اسم المادة عشان الكود يبقى له معنى */
  var base = String(seed||"").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,2);
  if(base.length<2) base = "";
  for(var tries=0; tries<400; tries++){
    var L = base || (CODE_L[Math.floor(Math.random()*CODE_L.length)] +
                     CODE_L[Math.floor(Math.random()*CODE_L.length)]);
    var d = String(Math.floor(Math.random()*90)+10);
    var c = L + d;
    if(!codeTaken(c)) return c;
    base = "";                                  /* لو الحروف متكررة نرجع للعشوائي */
  }
  return "G" + (DB.seq++);
}
function normCode(c){ return String(c==null?"":c).replace(/\s/g,"").toUpperCase(); }
function groupByCode(c){
  var k = normCode(c);
  if(!k) return null;
  for(var i=0;i<DB.groups.length;i++) if(normCode(DB.groups[i].code)===k) return DB.groups[i];
  return null;
}
function groupByName(nm){
  var k = normAr(nm);
  if(!k) return null;
  for(var i=0;i<DB.groups.length;i++) if(normAr(DB.groups[i].name)===k) return DB.groups[i];
  return null;
}
/* أي مجموعة قديمة من غير كود بتاخد واحد */
function ensureCodes(){
  var ch = 0;
  DB.groups.forEach(function(g){
    if(!g.code){ g.code = genGroupCode(g.subject || g.name); ch++; }
  });
  if(ch) save();
  return ch;
}

/* ---------- أدوات ---------- */
var $ = function(s){ return document.querySelector(s); };
var AR = "٠١٢٣٤٥٦٧٨٩";
function ar(n){ return String(n==null?"":n).replace(/\d/g,function(d){ return AR[d]; }); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function num(v,d){ var n = Number(String(v==null?"":v).replace(/[^\d.-]/g,"")); return isNaN(n)?(d||0):n; }
function money(n){ return ar(Math.round(num(n)).toLocaleString("en-US")) + " ج"; }
function today(){ var d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtD(s){ if(!s) return ""; var p=String(s).split("-"); return ar(p[2]+"/"+p[1]+"/"+p[0]); }
var DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function dowOf(d){ return new Date(d+"T00:00:00").getDay(); }
function normAr(s){ return String(s==null?"":s).replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي")
  .replace(/ة/g,"ه").replace(/[ًٌٍَُِّْـ]/g,"").replace(/\s+/g," ").trim().toLowerCase(); }
function initials(n){ var p = String(n||"").trim().split(/\s+/); 
  return (p[0]||"?").slice(0,1) + (p[1]? p[1].slice(0,1) : ""); }
function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(window._tt); window._tt=setTimeout(function(){ t.classList.remove("on"); },2200); }

/* شهور السنة الدراسية بالترتيب من سبتمبر */
function schoolMonths(){
  var out = [], m = num(DB.meta.startMonth,9);
  for(var i=0;i<12;i++){ out.push(((m-1+i)%12)+1); }
  return out;
}
function monthKey(mi){ return "m"+mi; }

/* ============================================================
   المزامنة
   • بيانات المدرّس كلها بتتحفظ في /private (هو بس اللي يقراها)
   • النسخة العامة في /pub: مواعيد المجموعات وأسماء الطلاب
     والتعليمات — عشان الطالب يشوفها بكود مجموعته
   ============================================================ */
var SYNC = { on:false, at:0, busy:false };

/* ============================================================
   النسخة العامة
   خصوصية: بيانات المجموعة **مفيهاش أسماء طلاب**. الطالب بيدخل
   بكوده الشخصي، فمبيشوفش غير بياناته هو ولا أسماء زمايله.
   ============================================================ */
function pubSnapshot(){
  var groups = {};
  DB.groups.forEach(function(g){
    if(!g.code) return;
    groups[normCode(g.code)] = {
      name: g.name||"", grade: g.grade||"", subject: g.subject||"",
      days: g.days||[], time: g.time||"", place: g.place||"",
      fee: num(g.fee), status: g.status||"on"
    };
  });
  /* دليل أكواد الطلاب: الكود الشخصي → الاسم ومجموعته */
  var studs = {};
  try{ ensureStuCodes(); }catch(e){}
  activeStudents().forEach(function(st){
    if(!st.code) return;
    var gs = studentGroups(st).filter(function(x){ return x.code; });
    if(!gs.length) return;
    studs[normCode(st.code)] = {
      n: st.name, sid: st.id, g: normCode(gs[0].code),
      gs: gs.map(function(x){ return normCode(x.code); })
    };
  });
  return {
    teacher: { name: DB.meta.name||"", subject: DB.meta.subject||"",
               phone: DB.meta.phone||"", about: DB.meta.about||"",
               year: DB.meta.year||"" },
    groups: groups,
    students: studs,
    at: Date.now()
  };
}
function syncUp(){
  if(!fbOn() || FB.role!=="teacher") return Promise.resolve(false);
  SYNC.busy = true;
  var snap = pubSnapshot();
  return Promise.all([
    fbSet("private/db", DB),
    fbSet("pub/teacher", snap.teacher),
    fbSet("pub/groups", snap.groups),
    fbSet("pub/students", snap.students)
  ]).then(function(){
    SYNC.busy=false; SYNC.on=true; SYNC.at=Date.now();
    try{ localStorage.setItem(KEY+"_syncAt", String(SYNC.at)); }catch(e){}
    return true;
  }).catch(function(e){ SYNC.busy=false; FB.err=e.message; return false; });
}
function syncDown(){
  if(!fbOn() || FB.role!=="teacher") return Promise.resolve(false);
  return fbGet("private/db").then(function(v){
    if(!v || !v.meta) return false;
    DB = v;
    normalizeDB();                      /* لازم قبل أي رسم — ده كان سبب العطل */
    ensureCodes(); save(); return true;
  }).catch(function(){ return false; });
}
/* بيتنادى بعد أي تعديل — بيحفظ محليًا ويرفع للسحابة */
function saveSync(){
  save();
  if(fbOn() && FB.role==="teacher"){
    clearTimeout(window._sy);
    window._sy = setTimeout(function(){
      try{ syncUp(); }catch(e){}
    }, 900);
  }
}

/* ---------- بحث وربط ---------- */
function groupById(id){ for(var i=0;i<DB.groups.length;i++) if(DB.groups[i].id===id) return DB.groups[i]; return null; }
function studentById(id){ for(var i=0;i<DB.students.length;i++) if(DB.students[i].id===id) return DB.students[i]; return null; }
function groupStudents(gid){
  return DB.students.filter(function(s){ return s.status!=="left" && (s.groups||[]).indexOf(gid)>=0; })
    .sort(function(a,b){ return normAr(a.name)<normAr(b.name)?-1:1; });
}
function studentGroups(s){ return (s.groups||[]).map(groupById).filter(Boolean); }
function activeStudents(){ return DB.students.filter(function(s){ return s.status!=="left"; }); }

/* ============================================================
   كود الطالب و QR
   كل طالب له كود ثابت. بيتحوّل QR يطبعه الطالب أو يحطه في تليفونه،
   والمدرّس بيمسحه بالكاميرا فالحضور يتسجّل في ثانية.
   الـQR بيتولّد هنا بالكامل — من غير مكتبات خارجية عشان يشتغل
   من غير نت.
   ============================================================ */
function genStuCode(){
  for(var i=0;i<400;i++){
    var c = "S" + String(Math.floor(Math.random()*9000)+1000);
    if(!DB.students.some(function(s){ return s.code===c; })) return c;
  }
  return "S"+(DB.seq++);
}
function ensureStuCodes(){
  var n2 = 0;
  DB.students.forEach(function(s){ if(!s.code){ s.code = genStuCode(); n2++; } });
  if(n2) save();
  return n2;
}
function stuByCode(c){
  c = String(c||"").trim().toUpperCase();
  if(!c) return null;
  for(var i=0;i<DB.students.length;i++)
    if(String(DB.students[i].code||"").toUpperCase()===c) return DB.students[i];
  return null;
}
/* ============================================================
   مولّد QR
   حاولت أكتبه من الأول وقارنت المصفوفة بمولّد مرجعي، فطلعت
   مختلفة — يعني الماسح مكانش هيقراه. مولّد QR صحيح محتاج تنفيذ
   دقيق للمواصفة، فبنستخدم مكتبة مجرّبة بدل ما نخاطر بأكواد
   مايقراهاش الماسح.
   المكتبة بتتحمّل مرة وتتخزّن، ولو مفيش نت بنعرض الكود كنص كبير
   يتكتب بالإيد — أحسن من QR غلط.
   ============================================================ */
var QR_LIB = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
var qrReady = null;
function loadQR(){
  if(window.qrcode) return Promise.resolve(true);
  if(qrReady) return qrReady;
  qrReady = new Promise(function(res){
    var sc = document.createElement("script");
    sc.src = QR_LIB;
    sc.onload  = function(){ res(!!window.qrcode); };
    sc.onerror = function(){ res(false); };
    document.head.appendChild(sc);
  });
  return qrReady;
}
/* بيرجّع SVG أو null لو المكتبة مش متاحة */
function qrSVG(text, px){
  if(!window.qrcode) return null;
  try{
    var q = window.qrcode(0, "M");      /* النسخة تلقائية · تصحيح M */
    q.addData(String(text));
    q.make();
    var n = q.getModuleCount(), pad = 2, S = n + pad*2, rects = "";
    for(var r=0;r<n;r++) for(var c=0;c<n;c++)
      if(q.isDark(r,c)) rects += '<rect x="'+(c+pad)+'" y="'+(r+pad)+'" width="1" height="1"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+S+' '+S+'" '+
      'width="'+(px||160)+'" height="'+(px||160)+'" shape-rendering="crispEdges">'+
      '<rect width="'+S+'" height="'+S+'" fill="#fff"/>'+
      '<g fill="#0E1A2B">'+rects+'</g></svg>';
  }catch(e){ return null; }
}
/* بديل واضح لما المكتبة مش متاحة */
function codeBox(code){
  return '<div style="border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center">'+
    '<div class="mut" style="font-size:11.5px">كود الطالب</div>'+
    '<div style="font-family:Cairo,sans-serif;font-weight:900;font-size:30px;'+
    'letter-spacing:.18em;direction:ltr;margin-top:4px">'+esc(code)+'</div></div>';
}

function honorBoard(){
  return activeStudents().map(function(s){
    var lv = studentLevel(s.id), a = attStats(s.id,null), t = taskRate(s.id);
    var parts = [], w = 0;
    if(lv){ parts.push(lv.avg*0.5); w += 0.5; }
    if(a.tot){ parts.push(a.rate*0.3); w += 0.3; }
    if(t.tot){ parts.push(t.pct*0.2); w += 0.2; }
    var score = w ? Math.round(parts.reduce(function(x,y){ return x+y; },0)/w) : null;
    return { s:s, score:score, lv:lv, a:a, t:t };
  }).filter(function(x){ return x.score!==null; })
    .sort(function(a,b){ return b.score-a.score; });
}

  if(!d) return "";
  if(d.indexOf("20")===0 && d.length>=12) return d;      /* عليه كود الدولة */
  if(d.indexOf("0")===0) return "2"+d;                   /* 01xxxxxxxxx → 201xxxxxxxxx */
  return "20"+d;
}

var Q_TYPES = [

function qIsAuto(q){

/* حالة الامتحان الفعلية — بتتحسب من التواريخ مش من الحقل بس */
function examState(e){
  if(!e) return "draft";
  if(e.status==="draft" || e.status==="closed") return e.status;
  var now = new Date().toISOString().slice(0,16).replace("T"," ");
  var from = (e.from||"").replace("T"," ");
  var to   = (e.to||"").replace("T"," ");
  if(from && now < from) return "sched";
  if(to && now > to)     return "ended";
  return "open";
}
function examStateName(st){ for(var i=0;i<EX_STATES.length;i++) if(EX_STATES[i].id===st) return EX_STATES[i]; return EX_STATES[0]; }
/* هل الطالب يقدر يدخل الامتحان دلوقتي؟ */
function examOpenFor(e, sid){
  if(examState(e)!=="open") return { ok:false, why:"الامتحان مش متاح دلوقتي" };
  var g = groupById(e.gid);
  if(!g) return { ok:false, why:"المجموعة مش موجودة" };
  var s = studentById(sid);
  if(!s || (s.groups||[]).indexOf(e.gid)<0)
    return { ok:false, why:"الامتحان ده مش لمجموعتك" };
  var mine = attemptsOf(e.id, sid);
  var done = mine.filter(function(a){ return a.submittedAt; }).length;
  var tries = Math.max(1, num(e.tries,1));
  var live = mine.filter(function(a){ return !a.submittedAt; })[0];
  if(live) return { ok:true, resume:live };
  if(done >= tries) return { ok:false, why:"خلصت محاولاتك ("+ar(tries)+")" };
  return { ok:true };
}

function attemptById(id){ for(var i=0;i<DB.attempts.length;i++) if(DB.attempts[i].id===id) return DB.attempts[i]; return null; }

/* الوقت المتبقي بالثواني */
function attemptLeft(a, e){
  if(!a || !e) return 0;
  var mins = num(e.mins,0);
  if(!mins) return 999999;
  var endByDuration = a.startedAt + mins*60000;
  var endByWindow = e.to ? new Date(e.to).getTime() : Infinity;
  return Math.max(0, Math.floor((Math.min(endByDuration, endByWindow) - Date.now())/1000));
}

/* ============================================================
   التصحيح
   ============================================================ */
function normAns(v, q){
  var t = String(v==null?"":v);
  if(q && q.exact) return t.trim();
  return normAr(t);
}
/* تصحيح سؤال واحد — بيرجّع الدرجة أو null لو محتاج تصحيح يدوي */
function gradeQ(q, ans){
  if(!qIsAuto(q)) return null;
  var mk = num(q.mark,1);
  if(ans===undefined || ans===null || ans==="") return 0;
  if(q.type==="mcq")  return String(ans)===String(q.correct) ? mk : 0;
  if(q.type==="tf")   return String(ans)===String(q.tf) ? mk : 0;
  if(q.type==="text"){
    var list = (q.texts||[]).filter(function(x){ return String(x||"").trim(); });
    if(!list.length) return null;                 /* مفيش إجابة مرجعية → يدوي */
    for(var i=0;i<list.length;i++)
      if(normAns(list[i], q) === normAns(ans, q)) return mk;
    return 0;
  }
  return null;
}
/* تصحيح المحاولة كاملة */
function gradeAttempt(a){
  var e = examById(a.examId);
  if(!e) return a;
  var auto = 0, pending = 0, manual = 0;
  (e.qs||[]).forEach(function(q){
    var g = gradeQ(q, (a.answers||{})[q.id]);
    if(g===null){
      /* يدوي: لو المدرّس صحّحه ناخد درجته، وإلا في الانتظار */
      var m = (a.marks||{})[q.id];
      if(m===undefined || m===null || m==="") pending++;
      else manual += num(m,0);
    }else{
      auto += g;
      a.marks = a.marks || {};
      a.marks[q.id] = g;                          /* بنحفظ الدرجة التلقائية */
    }
  });
  a.auto = auto; a.manual = manual; a.pending = pending;
  a.total = auto + manual;
  a.state = a.submittedAt ? (pending? "grading" : "done") : "live";
  return a;
}
function examTotalMark(e){
  if(!e) return 0;
  if(!(e.qs||[]).length) return num(e.max,0);
  return (e.qs||[]).reduce(function(t,q){ return t + num(q.mark,0); }, 0);
}
/* هل الطالب يشوف نتيجته؟ */
function canSeeResult(e, a){
  if(!e || !a || !a.submittedAt) return false;
  var mode = e.showMode || "now";
  if(mode==="never") return false;
  if(mode==="after")  return !a.pending;
  return true;
}

/* ---------- إحصائيات الامتحان الإلكتروني ---------- */
function onlineStats(e){
  var studs = groupStudents(e.gid);
  var all = attemptsOf(e.id);
  var byStu = {};
  all.forEach(function(a){
    if(!byStu[a.sid] || (a.total||0) > (byStu[a.sid].total||0)) byStu[a.sid] = a;
  });
  var started = Object.keys(byStu).length;
  var sub = 0, pend = 0, scores = [], pass = 0;
  var tot = examTotalMark(e) || 1;
  Object.keys(byStu).forEach(function(k){
    var a = gradeAttempt(byStu[k]);
    if(!a.submittedAt) return;
    sub++;
    if(a.pending) pend++;
    else {
      scores.push(a.total);
      if(a.total >= tot/2) pass++;
    }
  });
  var sum = scores.reduce(function(x,y){ return x+y; }, 0);
  return {
    students: studs.length, started: started, submitted: sub, pending: pend,
    done: scores.length, notStarted: studs.length - started,
    max: scores.length? Math.max.apply(null,scores) : null,
    min: scores.length? Math.min.apply(null,scores) : null,
    avg: scores.length? Math.round(sum/scores.length*10)/10 : null,
    pass: pass, fail: scores.length-pass,
    passPct: scores.length? Math.round(pass/scores.length*100) : 0,
    total: tot, byStu: byStu
  };
}

/* ============================================================
   الامتحانات والدرجات
   ============================================================ */
function examById(id){ for(var i=0;i<DB.exams.length;i++) if(DB.exams[i].id===id) return DB.exams[i]; return null; }
function examStats(e){
  var g = groupById(e.gid);
  var st = g ? groupStudents(g.id) : [];
  var vals = [];
  st.forEach(function(s){
    var v = (e.marks||{})[s.id];
    if(v!==undefined && v!==null && v!=="") vals.push(num(v));
  });
  if(!vals.length) return { n:0, total:st.length, avg:null, max:null, min:null, pass:0, fail:0 };
  var sum = vals.reduce(function(a,b){ return a+b; },0);
  var pass = vals.filter(function(v){ return v >= num(e.max,100)/2; }).length;
  return { n:vals.length, total:st.length,
           avg: Math.round(sum/vals.length*10)/10,
           max: Math.max.apply(null,vals), min: Math.min.apply(null,vals),
           pass:pass, fail:vals.length-pass };
}
/* مستوى الطالب عبر كل امتحاناته */
function studentExams(sid){
  var out = [];
  DB.exams.forEach(function(e){
    var v = (e.marks||{})[sid];
    if(v===undefined || v===null || v==="") return;
    out.push({ e:e, mark:num(v), max:num(e.max,100),
               pct: Math.round(num(v)/Math.max(num(e.max,100),1)*100) });
  });
  return out.sort(function(a,b){ return String(a.e.date).localeCompare(String(b.e.date)); });
}
function studentLevel(sid){
  var ex = studentExams(sid);
  if(!ex.length) return null;
  var avg = Math.round(ex.reduce(function(a,x){ return a+x.pct; },0)/ex.length);
  var trend = null;
  if(ex.length>=2) trend = ex[ex.length-1].pct - ex[ex.length-2].pct;
  return { avg:avg, n:ex.length, trend:trend, last:ex[ex.length-1] };
}

/* ============================================================
   الفلوس — القلب
   الطالب بيدفع لكل مجموعة شهريًا. المستحق = عدد الشهور اللي
   عدّت من تاريخ اشتراكه × سعر المجموعة. المدفوع من سجل الدفعات.
   ============================================================ */
function payOf(sid, gid, mi){
  for(var i=0;i<DB.pays.length;i++){
    var p = DB.pays[i];
    if(p.sid===sid && p.gid===gid && p.mi===mi) return p;
  }
  return null;
}
function isPaid(sid, gid, mi){ return !!payOf(sid, gid, mi); }
/* الشهور اللي المفروض الطالب دفعها لحد النهاردة في المجموعة دي */
function dueMonths(s, g){
  if(!g) return [];
  var now = new Date(), curM = now.getMonth()+1;
  var months = schoolMonths();
  var joinM = s.joinMonth ? num(s.joinMonth) : months[0];
  var out = [], started = false;
  for(var i=0;i<months.length;i++){
    if(months[i]===joinM) started = true;
    if(!started) continue;
    out.push(months[i]);
    if(months[i]===curM) break;                  /* لحد الشهر الحالي */
  }
  return out;
}
function studentDue(s){
  var mode = payModeOf(s);
  if(mode==="free") return { due:0, paid:0, rest:0, mode:"free" };
  /* ============================================================
     المستحقات لحد النهاردة — بس بنضم كل دفعاته الفعلية كمان،
     عشان لو دفع مقدّم لشهر جاي يظهر في المدفوع مش يختفي.
     ============================================================ */
  var rows = duesOf(s.id, today());
  var due  = rows.reduce(function(a,x){ return a+num(x.amount); }, 0);
  var rest = rows.reduce(function(a,x){ return a+num(x.rest); }, 0);
  var paid = 0;
  DB.pays.forEach(function(p){ if(p.sid===s.id) paid += num(p.amount); });
  return { due: Math.max(due, paid), paid: paid, rest: rest, mode: mode };
}
function lateStudents(){
  return activeStudents().filter(function(s){ return studentDue(s).rest > 0; })
    .sort(function(a,b){ return studentDue(b).rest - studentDue(a).rest; });
}
function monthIncome(mi){
  var t = 0;
  DB.pays.forEach(function(p){ if(p.mi===mi) t += num(p.amount); });
  return t;
}
function totalIncome(){ var t=0; DB.pays.forEach(function(p){ t+=num(p.amount); }); return t; }

/* ============================================================
   الحصص والحضور
   مفتاح الحصة: «المجموعة|التاريخ» — مصدر واحد للحقيقة.
   ============================================================ */
function sesKey(gid, d){ return gid+"|"+d; }
/* ============================================================
   حالة الحصة
   الحصة عندها ٣ حالات: لسه · جارية · خلصت.
   «بدء الحصة» بيفتح الرصد، و«إنهاء الحصة» بيقفله ويحسب المستحق
   للمجموعات اللي بتتحصّل بالحصة.
   ============================================================ */
function sesState(gid, d){
  var o = DB.sessions[sesKey(gid,d)];
  if(!o) return "none";
  if(o.ended) return "done";
  if(o.started) return "live";
  var n2 = 0; for(var k in (o.att||{})) n2++;
  return n2 ? "live" : "none";
}
function startSes(gid, d){
  var k = sesKey(gid,d);
  if(!DB.sessions[k]) DB.sessions[k] = { att:{}, at:Date.now() };
  DB.sessions[k].started = Date.now();
  delete DB.sessions[k].ended;
  saveSync();
}
function endSes(gid, d){
  var k = sesKey(gid,d);
  if(!DB.sessions[k]) DB.sessions[k] = { att:{}, at:Date.now() };
  DB.sessions[k].ended = Date.now();
  /* المجموعات اللي بالحصة: نسجّل مستحق لكل حاضر */
  /* ============================================================
     المستحق بيتسجّل حسب طريقة **الطالب**:
     · بالحصة  → مستحق للحصة دي
     · بالشهر  → مفيش مستحق حصة (مستحقه شهري واحد بس)
     · معفي    → مفيش مستحق خالص
     وبنمنع التكرار: لو الحصة اتقفلت مرتين مبيتسجّلش مرتين.
     ============================================================ */
  var g = groupById(gid);
  if(g){
    var att = DB.sessions[k].att || {};
    groupStudents(gid).forEach(function(s){
      if(payModeOf(s) !== "ses") return;
      if(!billEligible(s, g, d)) return;    /* قبل بداية الاحتساب */
      var v = att[s.id];
      if(v!=="P" && v!=="L") return;
      var has = (DB.sesDue||[]).some(function(x){
        return x.sid===s.id && x.gid===gid && x.date===d; });
      if(has) return;
      DB.sesDue = DB.sesDue || [];
      DB.sesDue.push({ id:uid("sd"), sid:s.id, gid:gid, date:d,
                       amount:num(g.fee), paid:false });
    });
  }
  saveSync();
}
/* ============================================================
   سجل واحد للدفعات — مصدر الحقيقة الوحيد
   قبل كده كان فيه نظامين: الشهري في DB.pays والحصة بعلامة
   منفصلة في sesDue.paid — فتحصيل اليوم كان بيوري نص المبلغ.
   دلوقتي **كل دفعة = سجل واحد في DB.pays**، وحالة أي مستحق
   بتتحسب من السجل ده مش من علامة مخزّنة.

   شكل الدفعة:
     { id, sid, gid, amount, date, kind:"month"|"ses",
       mi (للشهري) | dueId+dueDate (للحصة), at }
   ============================================================ */
function payDel(p){
  if(!p) return;
  DB.pays = DB.pays.filter(function(x){ return x!==p; });
  /* لو دفعة حصة، نشيل العلامة القديمة كمان */
  if(p.dueId) (DB.sesDue||[]).forEach(function(x){
    if(x.id===p.dueId){ x.paid=false; x.paidAt=""; } });
}
function payAdd(o){
  var p = { id:uid("p"), sid:o.sid, gid:o.gid, amount:num(o.amount),
            date:o.date || today(), kind:o.kind || "month", at:Date.now() };
  if(o.kind==="ses"){ p.dueId = o.dueId; p.dueDate = o.dueDate; }
  else p.mi = num(o.mi);
  DB.pays.push(p);
  return p;
}
/* دفعة الشهر */
function payOfMonth(sid, gid, mi){
  for(var i=0;i<DB.pays.length;i++){
    var p = DB.pays[i];
    if(p.sid===sid && p.gid===gid && num(p.mi)===num(mi) && (p.kind||"month")==="month") return p;
  }
  return null;
}
/* دفعة حصة */
function payOfDue(dueId){
  for(var i=0;i<DB.pays.length;i++) if(DB.pays[i].dueId===dueId) return DB.pays[i];
  return null;
}
/* ============================================================
   الدفع الجزئي
   المدفوع لأي مستحق = مجموع كل الدفعات المرتبطة بيه.
   فينفع الطالب يدفع على مرات، والحالة بتبقى:
   لم يدفع · مدفوع جزئيًا · مدفوع بالكامل
   ============================================================ */
function paidForDue(dueId){
  var t = 0;
  DB.pays.forEach(function(p){ if(p.dueId===dueId) t += num(p.amount); });
  return t;
}
function paidForMonth(sid, gid, mi){
  var t = 0;
  DB.pays.forEach(function(p){
    if(p.sid===sid && p.gid===gid && (p.kind||"month")==="month" && num(p.mi)===num(mi))
      t += num(p.amount);
  });
  return t;
}
function duePaid(due){ return paidForDue(due.id) >= num(due.amount) - 0.001; }
function dueRest(due){ return Math.max(0, num(due.amount) - paidForDue(due.id)); }
/* حالة الدفع النصية */
function payLabel(amount, paid){
  if(paid <= 0) return { t:"لم يدفع", c:"bad" };
  if(paid >= num(amount) - 0.001) return { t:"مدفوع", c:"ok" };
  return { t:"مدفوع جزئيًا", c:"warn" };
}
/* ترحيل: أي حصة معلّمة مدفوعة من غير سجل → بنعملها سجل */
/* ============================================================
   ترحيل تواريخ الاحتساب
   المجموعات القديمة مالهاش تاريخ بداية، فكان النظام بيحسب
   بأثر رجعي لأول السنة الدراسية. بنحط لكل مجموعة تاريخ بداية
   منطقي: أقدم حصة مرصودة فيها، وإلا تاريخ إنشائها، وإلا النهاردة.
   البيانات القديمة مبتتحذفش — بس مبتدخلش الحساب.
   ============================================================ */
function migrateBillDates(){
  var ch = 0;
  DB.groups.forEach(function(g){
    if(g.billFrom) return;
    /* أقدم حصة مرصودة للمجموعة */
    var first = "";
    for(var k in DB.sessions){
      var p = k.split("|");
      if(p[0]!==g.id) continue;
      if(!first || p[1] < first) first = p[1];
    }
    g.startDate = g.startDate || first || (g.at? iso(new Date(g.at)) : today());
    g.billFrom  = g.startDate;
    ch++;
  });
  /* الطلاب من غير تاريخ انضمام: بياخدوا بداية احتساب مجموعتهم */
  DB.students.forEach(function(s){
    if(s.joinDate) return;
    var g = studentGroups(s)[0];
    s.joinDate = (g && groupBillFrom(g)) || today();
    ch++;
  });
  if(ch) save();
  return ch;
}
function migratePays(){
  var ch = 0;
  (DB.sesDue||[]).forEach(function(x){
    if(!x.paid) return;
    if(payOfDue(x.id)) return;
    payAdd({ sid:x.sid, gid:x.gid, amount:x.amount, date:x.paidAt || x.date,
             kind:"ses", dueId:x.id, dueDate:x.date });
    ch++;
  });
  DB.pays.forEach(function(p){ if(!p.kind) p.kind = "month"; });
  if(ch) save();
  return ch;
}

/* ============================================================
   المستحقات
   المستحق مش بيتخزّن للشهري — بيتحسب من تاريخ الاشتراك.
   المستحق بيتخزّن للحصة بس (لأنه مربوط بحصة حصلت فعلًا).
   ============================================================ */
/* كل مستحقات الطالب لحد تاريخ معيّن */
/* ============================================================
   بداية احتساب المستحقات — المصدر الوحيد
   المشكلة اللي كانت: الطالب من غير تاريخ انضمام كان بيترجّع
   لأول السنة الدراسية، فالنظام يعمل ١٢ مستحق بأثر رجعي لطالب
   بدأ من أسبوع.
   دلوقتي البداية = **أحدث تاريخ** بين:
     · تاريخ بداية احتساب المجموعة (billFrom)
     · تاريخ انضمام الطالب (joinDate)
   وأي تاريخ قبلها بيتجاهل في الحساب — من غير ما نحذف أي سجل.
   ============================================================ */
function groupBillFrom(g){
  if(!g) return "";
  return g.billFrom || g.startDate || "";
}
function studentJoin(s, gid){
  if(!s) return "";
  if(s.joinIn && s.joinIn[gid]) return s.joinIn[gid];
  return s.joinDate || "";
}
function billFrom(s, g){
  var a = groupBillFrom(g);
  var b = studentJoin(s, g && g.id);
  /* ============================================================
     لو مفيش تواريخ خالص (بيانات اتحطت برمجيًا من غير ترحيل)،
     بناخد أقدم حصة مرصودة للمجموعة كبداية معقولة — أدق بكتير
     من الرجوع لأول السنة الدراسية.
     ============================================================ */
  if(!a && !b){
    if(!g) return "";
    var first = "";
    for(var k in DB.sessions){
      var p = k.split("|");
      if(p[0]!==g.id) continue;
      if(!first || p[1] < first) first = p[1];
    }
    return first || today();
  }
  if(!a) return b;
  if(!b) return a;
  return a > b ? a : b;           /* الأحدث */
}
function billEligible(s, g, date){
  /* معفي في التاريخ ده؟ مفيش مستحق خالص */
  if(isExemptOn(s, date)) return false;
  var from = billFrom(s, g);
  if(!from) return false;         /* من غير تاريخ بداية مفيش مستحقات */
  return String(date) >= String(from);
}

function duesOf(sid, upto){
  upto = upto || today();
  var s = studentById(sid);
  if(!s) return [];
  /* معفي دلوقتي؟ مفيش أي مستحق حالي — والسجل القديم بيفضل محفوظ */
  if(isExempt(s)) return [];
  var out = [];
  if(payModeOf(s)==="ses"){
    /* بالحصة: من الحصص المسجّلة — وجوه نافذة الاحتساب بس */
    (DB.sesDue||[]).forEach(function(x){
      if(x.sid!==sid) return;
      if(x.date > upto) return;
      if(!billEligible(s, groupById(x.gid), x.date)) return;
      var pd0 = paidForDue(x.id);
      out.push({ kind:"ses", id:x.id, gid:x.gid, date:x.date,
                 amount:num(x.amount), paid:duePaid(x), paidAmt:pd0,
                 rest:dueRest(x), what:"حصة "+fmtD(x.date) });
    });
  }else{
    /* شهري: من بداية الاحتساب لحد النهاردة — شهر بشهر */
    studentGroups(s).forEach(function(g){
      var from = billFrom(s, g);
      if(!from) return;
      var payday = Math.min(28, Math.max(1, num(g.payday,1)));
      var y = num(from.slice(0,4)), m = num(from.slice(5,7));
      var endY = num(upto.slice(0,4)), endM = num(upto.slice(5,7));
      var guard = 0;
      while((y < endY || (y===endY && m <= endM)) && guard++ < 60){
        var mk = y+"-"+String(m).padStart(2,"0");
        var dueDate = mk+"-"+String(payday).padStart(2,"0");
        /* المستحق لازم يكون بعد البداية وقبل أو مع النهاردة */
        if(dueDate <= upto && dueDate >= from && !isExemptOn(s, dueDate)){
          var pdA = paidForMonth(sid, g.id, m);
          out.push({ kind:"month", id:g.id+"|"+mk, gid:g.id, date:dueDate, mi:m,
                     amount:num(g.fee), paidAmt:pdA,
                     paid: pdA >= num(g.fee)-0.001,
                     rest: Math.max(0, num(g.fee)-pdA),
                     what:(MONTHS[m-1]||"")+" "+y });
        }
        m++; if(m>12){ m=1; y++; }
      }
    });
  }
  return out.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
}
/* تصنيف المستحقات: النهاردة · قديم · جاي */
function dueBuckets(sid){
  var t = today();
  var all = duesOf(sid, t);
  var todayD = [], old = [];
  all.forEach(function(d){
    if(!d.rest) return;
    if(d.date === t) todayD.push(d);
    else if(d.date < t) old.push(d);
  });
  return { today:todayD, old:old,
           todaySum: todayD.reduce(function(a,x){ return a+x.rest; },0),
           oldSum:   old.reduce(function(a,x){ return a+x.rest; },0) };
}

/* ============================================================
   أرقام اليوم — كلها محسوبة من السجل مباشرة
   ============================================================ */
function todayIncome(d){
  d = d || today();
  var t = 0;
  DB.pays.forEach(function(p){ if(p.date===d) t += num(p.amount); });
  (DB.sales||[]).forEach(function(x){ if(x.date===d) t += num(x.amount); });
  return t;
}
/* مستحقات اليوم والقديم لكل الطلاب */
function allDues(){
  var t = today();
  var todayD = [], old = [];
  activeStudents().forEach(function(s){
    if(isExempt(s)) return;                   /* مش في أي متأخرات */
    var bk = dueBuckets(s.id);
    bk.today.forEach(function(x){ x.s = s; todayD.push(x); });
    bk.old.forEach(function(x){ x.s = s; old.push(x); });
  });
  old.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  return { today:todayD, old:old,
           todaySum: todayD.reduce(function(a,x){ return a+x.rest; },0),
           oldSum:   old.reduce(function(a,x){ return a+x.rest; },0) };
}
/* مجموعات مستحقة الدفع النهاردة */
function groupsDueToday(){
  var t = today();
  var out = [];
  DB.groups.forEach(function(g){
    if(g.status==="off") return;
    var studs = groupStudents(g.id);
    var need = 0, got = 0, cnt = 0;
    studs.forEach(function(s){
      if(isExempt(s)) return;                 /* المعفي بره التحصيل المتوقع */
      duesOf(s.id, t).forEach(function(d){
        if(d.gid!==g.id || d.date!==t) return;
        need += num(d.amount);
        if(!d.rest) got += num(d.amount);
        cnt++;
      });
    });
    if(cnt) out.push({ g:g, students:studs.length, n:cnt,
                       need:need, got:got, rest:need-got });
  });
  return out;
}
/* حضور اليوم */
function todayAtt(d){
  d = d || today();
  var pres=0, abs=0, late=0, marked=0, total=0;
  groupToday(d).forEach(function(g){
    var o = sesOf(g.id, d) || { att:{} };
    groupStudents(g.id).forEach(function(s){
      total++;
      var v = (o.att||{})[s.id];
      if(v===undefined) return;
      marked++;
      if(v==="P") pres++; else if(v==="L"){ pres++; late++; } else abs++;
    });
  });
  return { pres:pres, abs:abs, late:late, marked:marked, total:total };
}
/* امتحانات النهاردة */
function examsToday(d){
  d = d || today();
  return DB.exams.filter(function(e){
    return String(e.date||"").slice(0,10)===d ||
           (isOnlineExam(e) && String(e.from||"").slice(0,10)<=d &&
            (!e.to || String(e.to).slice(0,10)>=d) && examState(e)==="open");
  });
}

/* ============================================================
   نظام الدفع
   الطريقة بقت على **الطالب** مش المجموعة — فينفع مجموعة واحدة
   فيها طالب شهري وطالب بالحصة وطالب معفي.
   الترحيل: الطالب اللي مالوش طريقة بياخد طريقة مجموعته الأولى،
   فالبيانات القديمة بتكمل شغالة زي ما هي.
   ============================================================ */
var PAY_MODES = [
  { id:"month", name:"بالشهر",  i:"◈" },
  { id:"ses",   name:"بالحصة",  i:"◉" },
  { id:"free",  name:"معفي",    i:"★" }
];
/* ============================================================
   الإعفاء المالي — حالة مستقلة مش مستحق بصفر
   الفرق مهم: طالب دفع كل حاجة رصيده صفر، وطالب معفي **مالوش
   مستحق من الأساس**. النظام بيفرّق بينهم في كل شاشة.

   الإعفاء له فترة: من تاريخ لتاريخ (أو مفتوح). الفترة اللي
   الطالب كان فيها معفي **مبيتحسبش عنها مستحق أبدًا** — حتى لو
   رجع يدفع بعدها. والسجل المالي القديم بيفضل محفوظ.
   ============================================================ */
var EX_REASONS = ["منحة","قرار إداري","حالة خاصة","خصم كامل","أخرى"];

/* هل الطالب معفي في التاريخ ده؟ */
function isExemptOn(s, date){
  if(!s) return false;
  date = date || today();
  /* الحالة الحالية */
  if(s.payMode === "free"){
    var from = s.exFrom || "";
    var to   = s.exTo   || "";
    if(from && date < from) return false;      /* قبل بداية الإعفاء */
    if(to && date > to)     return false;      /* بعد انتهائه */
    return true;
  }
  /* رجع يدفع — بس فترة إعفائه السابقة لسه معفية */
  if(s.exFrom && s.exTo)
    return date >= s.exFrom && date <= s.exTo;
  return false;
}
/* معفي دلوقتي؟ */
function isExempt(s){ return isExemptOn(s, today()); }
/* وصف حالة الإعفاء */
function exemptInfo(s){
  if(!s || !isExempt(s)) return null;
  return { from: s.exFrom || "", to: s.exTo || "",
           reason: s.exReason || "",
           label: "معفي من الدفع" +
             (s.exTo ? " حتى "+fmtD(s.exTo) : "") };
}
function payModeName(m){
  for(var i=0;i<PAY_MODES.length;i++) if(PAY_MODES[i].id===m) return PAY_MODES[i].name;
  return "بالشهر";
}
/* طريقة دفع الطالب — مع احتياطي من مجموعته */
function payModeOf(s){
  if(!s) return "month";
  if(s.payMode) return s.payMode;
  var g = studentGroups(s)[0];
  return (g && g.mode==="ses") ? "ses" : "month";
}
/* ترحيل آمن: بينقل طريقة المجموعة للطلاب اللي مالهمش طريقة */
function migratePayModes(){
  var ch = 0;
  DB.students.forEach(function(s){
    if(s.payMode) return;
    var g = studentGroups(s)[0];
    s.payMode = (g && g.mode==="ses") ? "ses" : "month";
    ch++;
  });
  if(ch) save();
  return ch;
}
/* شهر الحساب الحالي — بنشتغل عليه بس مش السنة كلها */
function curMonthKey(){
  var d = UI.gMonth || today();
  return String(d).slice(0,7);
}
function monthIdxOf(mk){ return num(String(mk).split("-")[1], 1); }
/* المستحق الشهري لشهر واحد بس */
function monthDue(s, g, mk){
  if(payModeOf(s)!=="month") return null;
  var mi = monthIdxOf(mk);
  /* المستحق الشهري لشهر واحد بس — وجوه نافذة الاحتساب */
  var from = billFrom(s, g);
  if(!from) return null;
  if(mk < String(from).slice(0,7)) return null;
  var payday = Math.min(28, Math.max(1, num(g.payday,1)));
  var dueDate = mk+"-"+String(payday).padStart(2,"0");
  if(dueDate < from) return null;
  var pA = paidForMonth(s.id, g.id, mi);
  return { mi:mi, amount:num(g.fee), paidAmt:pA,
           paid: pA >= num(g.fee)-0.001 };
}
/* تاريخ بداية اشتراك الطالب بصيغة سنة-شهر */
function joinMonthKey(s){
  if(s.joinDate) return String(s.joinDate).slice(0,7);
  var jm = num(s.joinMonth, 0);
  if(!jm) return "";
  /* بنثبّته على السنة الدراسية الحالية */
  var start = num(DB.meta.startMonth, 9);
  var now = new Date();
  var y = now.getFullYear();
  var yearStart = (now.getMonth()+1 >= start) ? y : y-1;
  var jy = (jm >= start) ? yearStart : yearStart + 1;
  return jy + "-" + String(jm).padStart(2,"0");
}



/* حصص الشهر المطلوب بس */
function sesDuesMonth(sid, gid, mk){
  return sesDuesOf(sid, gid).filter(function(x){ return String(x.date).slice(0,7)===mk; });
}
/* حالة الدفع للطالب في المجموعة والشهر ده */
function payStateOf(s, g, mk){
  var mode = payModeOf(s);
  var ex = exemptInfo(s);
  if(ex) return { mode:"free", label:ex.label, cls:"", due:0, paid:0, rest:0, n:0, ex:ex };
  if(mode==="free") return { mode:"free", label:"معفي", cls:"", due:0, paid:0, rest:0, n:0 };
  if(mode==="ses"){
    var rows = sesDuesMonth(s.id, g.id, mk);
    var paid = rows.filter(function(x){ return duePaid(x); });
    var rest = rows.filter(function(x){ return !duePaid(x); });
    var paidAmt = rows.reduce(function(a,x){ return a+paidForDue(x.id); }, 0);
    var restAmt = rows.reduce(function(a,x){ return a+dueRest(x); }, 0);
    return { mode:"ses",
      label: !rows.length ? "مفيش حصص"
           : (rest.length ? ar(rest.length)+" حصة متأخرة" : "سديد"),
      cls: !rows.length ? "" : (rest.length ? "bad" : "ok"),
      due: rows.reduce(function(a,x){ return a+num(x.amount); },0),
      paid: paidAmt, rest: restAmt,
      n: rows.length, rows:rows };
  }
  var d = monthDue(s, g, mk);
  if(!d) return { mode:"month", label:"مفيش تحصيل", cls:"", due:0, paid:0, rest:0, n:0 };
  var pA = paidForMonth(s.id, g.id, d.mi);
  var L = payLabel(d.amount, pA);
  return { mode:"month", label:L.t, cls:L.c,
           due:d.amount, paid:pA, rest:Math.max(0, d.amount-pA),
           n:1, mi:d.mi };
}

/* ============================================================
   فلوس المجموعة
   لازم تفرّق بين الشهري وبالحصة — كانت بتحسب بالشهور دايمًا،
   فمجموعة بالحصة بـ٣٠ ج كانت بتطلع «٧٢٠ ج متأخر» (١٢ شهر × طالبين).
   ============================================================ */
/* توزيع الطلاب على أنظمة الدفع */
function payBreakdown(list){
  var out = { ses:0, month:0, free:0, billable:0, total:0 };
  (list||activeStudents()).forEach(function(s){
    out.total++;
    if(isExempt(s)){ out.free++; return; }
    out.billable++;
    if(payModeOf(s)==="ses") out.ses++; else out.month++;
  });
  return out;
}
function groupMoney(g, mk){
  mk = mk || curMonthKey();
  var studs = groupStudents(g.id);
  var paid = 0, rest = 0, paidN = 0, restN = 0, late = {}, free = 0;
  studs.forEach(function(s){
    if(isExempt(s)){ free++; return; }        /* الحارس الأول */
    var st = payStateOf(s, g, mk);
    if(st.mode==="free"){ free++; return; }
    paid += st.paid; rest += st.rest;
    if(st.mode==="ses"){
      paidN += (st.rows||[]).filter(function(x){ return x.paid; }).length;
      restN += (st.rows||[]).filter(function(x){ return !x.paid; }).length;
    }else if(st.n){
      if(st.rest) restN++; else paidN++;
    }
    if(st.rest) late[s.id] = st.rest;
  });
  return { paid:paid, rest:rest, paidN:paidN, restN:restN, free:free,
           late:late, lateStu:Object.keys(late).length, mk:mk };
}
/* تفاصيل متأخرات طالب في مجموعة — بالتواريخ */
function lateDetail(s, g, mk){
  mk = mk || curMonthKey();
  var st = payStateOf(s, g, mk), rows = [];
  if(st.mode==="free") return rows;
  if(st.mode==="ses"){
    (st.rows||[]).forEach(function(x){
      if(x.paid) return;
      rows.push({ what:"حصة "+fmtD(x.date), day:DAYS[dowOf(x.date)],
                  date:x.date, amount:num(x.amount) });
    });
  }else if(st.rest){
    rows.push({ what:MONTHS[st.mi-1]||"", day:"", date:"", amount:st.rest });
  }
  return rows;
}

/* حصص الطالب في مجموعة بالحصة */
function sesDuesOf(sid, gid){
  var s = studentById(sid);
  return (DB.sesDue||[]).filter(function(x){
    if(x.sid!==sid) return false;
    if(gid && x.gid!==gid) return false;
    return billEligible(s, groupById(x.gid), x.date);
  }).sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}
function toggleSesDue(id){
  var x = (DB.sesDue||[]).filter(function(y){ return y.id===id; })[0];
  if(!x) return;
  x.paid = !x.paid;
  x.paidAt = x.paid ? today() : "";
  saveSync();
  return x;
}
/* مستحق حصص الطالب (للمجموعات اللي بالحصة) */
function sesDueOf(sid){
  var s = studentById(sid);
  var due=0, paid=0;
  (DB.sesDue||[]).forEach(function(x){
    if(x.sid!==sid) return;
    if(!billEligible(s, groupById(x.gid), x.date)) return;
    due += num(x.amount);
    if(duePaid(x)) paid += num(x.amount);
  });
  return { due:due, paid:paid, rest:Math.max(0,due-paid) };
}
function sesOf(gid, d){ return DB.sessions[sesKey(gid,d)] || null; }
function attOf(gid, d, sid){ var s = sesOf(gid,d); return s ? (s.att||{})[sid] : undefined; }
function setAtt(gid, d, sid, v){
  var k = sesKey(gid,d);
  if(!DB.sessions[k]) DB.sessions[k] = { att:{}, at:Date.now() };
  if(!DB.sessions[k].att) DB.sessions[k].att = {};
  if(v) DB.sessions[k].att[sid] = v; else delete DB.sessions[k].att[sid];
  save();
}
/* مواعيد المجموعة: أيام الأسبوع + الوقت */
function groupToday(d){
  var dow = dowOf(d);
  return DB.groups.filter(function(g){
    return g.status!=="off" && (g.days||[]).indexOf(dow)>=0;
  }).sort(function(a,b){ return String(a.time||"").localeCompare(String(b.time||"")); });
}
function attStats(sid, gid){
  var tot=0, pres=0;
  for(var k in DB.sessions){
    var p = k.split("|");
    if(gid && p[0]!==gid) continue;
    var v = (DB.sessions[k].att||{})[sid];
    if(v===undefined) continue;
    tot++; if(v==="P"||v==="L") pres++;   /* المتأخر حاضر بس متأخر */
  }
  return { tot:tot, pres:pres, abs:tot-pres, rate: tot? Math.round(pres/tot*100) : 100 };
}

        (n2? '<span class="b">'+ar(n2)+'</span>' : '<span class="c">✓</span>')+'</button>';

function openSide(){
  document.getElementById("side").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeSide(){
  document.getElementById("side").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
function render(){
  try{ _render(); }
  catch(err){
    /* ============================================================
       لو الرسم وقع، الشاشة كانت هتفضل متجمّدة والمستخدم مش فاهم.
       بنعرض الخطأ وزرار يرجّعه لشاشة آمنة.
       ============================================================ */
    try{
      document.getElementById("view").innerHTML =
        '<div class="card"><div class="bd">'+
        '<div class="note bad"><b>حصلت مشكلة في عرض الشاشة</b><br>'+
        esc(String((err && err.message) || err)).slice(0,200)+'</div>'+
        '<button class="btn block" data-act="goHome" style="margin-top:10px">'+
          '↺ ارجع للوحة اليوم</button>'+
        '<button class="btn ghost block" data-act="gOut" style="margin-top:8px">'+
          '⎋ تسجيل الخروج</button></div></div>';
    }catch(e2){}
    try{ console.error("render:", err); }catch(e3){}
  }
}
function _render(){
  /* البرنامج مقفول؟ شاشة القفل قبل أي حاجة */
  if(UI.locked && DB.lock && DB.lock.on && DB.lock.pin){
    document.getElementById("side").style.display = "none";
    closeSide();
    var old0 = document.getElementById("fab"); if(old0) old0.remove();
    $("#view").innerHTML = lockScreenHTML();
    var pi = document.getElementById("ul_pin"); if(pi) setTimeout(function(){ pi.focus(); },80);
    return;
  }
  /* مش داخل؟ نعرض البوابة */
  if(FB.role!=="teacher" && FB.role!=="student"){
    document.body.classList.remove("in");
    document.getElementById("side").style.display = "none";
    closeSide();
    var ob2 = document.getElementById("outBtn");
    if(ob2) ob2.style.display = (FB.role==="student") ? "" : "none";
    $("#view").innerHTML = gateHTML();
    $("#hSub").textContent = "إدارة الدروس الخصوصية";
    window.scrollTo(0,0); return;
  }
  if(FB.role==="student"){
    document.body.classList.remove("in");
    document.getElementById("side").style.display = "none";
    closeSide();
    var ob2 = document.getElementById("outBtn");
    if(ob2) ob2.style.display = (FB.role==="student") ? "" : "none";
    $("#view").innerHTML = UI.take ? viewTakeExam()
                         : (UI.stuTab==="exams" ? viewStuExams() : viewStudentPortal());
    $("#hSub").textContent = (GATE.teacher||{}).name || DB.meta.name || "";
    window.scrollTo(0,0); return;
  }
  document.body.classList.add("in");
  var ob = document.getElementById("outBtn"); if(ob) ob.style.display = "";
  document.getElementById("side").style.display = "";
  drawSide();
  var h = "";
  if(UI.sub && UI.sub.c) h = viewComm(UI.sub.c);
  else if(UI.sub && UI.sub.g) h = viewGroup(UI.sub.g);
  else if(UI.sub && UI.sub.s) h = viewStudent(UI.sub.s);
  else if(UI.tab==="home")   h = viewHome();
  else if(UI.tab==="groups") h = viewGroups();
  else if(UI.tab==="studs")  h = viewStudents();
  else if(UI.tab==="money")  h = viewMoney();
  else if(UI.tab==="more")   { UI.tab="home"; h = viewHome(); }
  else if(UI.tab==="book")   h = viewBookings();
  else if(UI.tab==="comm")   h = (UI.sub && UI.sub.c) ? viewComm(UI.sub.c) : viewComms();
  else if(UI.tab==="exams")  h = (UI.sub && UI.sub.on)   ? viewOnline(UI.sub.on)
                               : (UI.sub && UI.sub.res)  ? viewExamResults(UI.sub.res)
                               : (UI.sub && UI.sub.gr)   ? viewGradeStu(UI.sub.gr, UI.sub.sid)
                               : (UI.sub && UI.sub.e)    ? viewExam(UI.sub.e) : viewExams();
  else if(UI.tab==="tasks")  h = viewTasks();
  else if(UI.tab==="fams")   h = (UI.sub && UI.sub.f) ? viewFamily(UI.sub.f) : viewFamilies();
  else if(UI.tab==="books")  h = viewBooks();
  else if(UI.tab==="remind") h = viewReminders();
  else if(UI.tab==="cert")   h = viewCerts();
  else if(UI.tab==="honor")  h = viewHonor();
  else if(UI.tab==="qr")     h = viewQR();
  else if(UI.tab==="years")  h = viewYears();
  else if(UI.tab==="arch")   h = viewArchive();
  else if(UI.tab==="sesh")   h = viewSessionLog();
  else if(UI.tab==="lock")   h = viewLock();
  else                       h = viewReports();
  $("#view").innerHTML = h;
  /* الزرار العائم — بيضيف حاجة حسب الشاشة اللي انت فيها */
  var FAB = { groups:["newGroup","مجموعة"], studs:["newStu","طالب"],
              exams:["newExam","امتحان"], tasks:["newTask","مهمة"],
              fams:["newFam","أسرة"], books:["newBook","مذكرة"],
              remind:["newRem","تذكير"] };
  var old = document.getElementById("fab");
  if(old) old.remove();
  var f = (!UI.sub) ? FAB[UI.tab] : null;
  if(f){
    var btn = document.createElement("button");
    btn.id = "fab"; btn.className = "fab";
    btn.setAttribute("data-act", f[0]);
    btn.title = "إضافة "+f[1];
    btn.textContent = "+";
    document.body.appendChild(btn);
  }
  var secName = navName(UI.tab);
  $("#hTitle").childNodes[0].nodeValue = secName || "دروسي";
  $("#hSub").textContent = (DB.meta.name ? (DB.meta.name + (DB.meta.subject? " · "+DB.meta.subject : ""))
                                        : "إدارة الدروس الخصوصية") + "  ·  v" + APP_VER;
  window.scrollTo(0,0);
}

    '<div style="flex:1;min-width:180px"><h2 style="font-size:20px">'+esc(t)+'</h2>'+
    (s?'<div class="mut" style="font-size:12.5px;margin-top:2px">'+s+'</div>':'')+'</div>'+
    '<div class="row noprint">'+(btns||"")+'</div></div>';
}
function stat(k,v,s,cls){
  return '<div class="stat '+(cls||"")+'"><div class="k">'+esc(k)+'</div>'+
    '<div class="v">'+v+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':'')+'</div>';
}
function back(label, act){
  return '<button class="btn ghost sm noprint" data-act="'+act+'" style="margin-bottom:10px">→ '+esc(label)+'</button>';

/* ---------- ١) لوحة اليوم ---------- */
function viewHome(){
  var d = UI.date || today();
  var gs = groupToday(d);
  var late = lateStudents();
  var curM = new Date().getMonth()+1;
  var h = pageHd("لوحة اليوم", esc(DAYS[dowOf(d)])+" · "+fmtD(d),
    '<button class="btn sm" data-act="newGroup">+ مجموعة</button>');

  /* ============================================================
     أرقام اليوم — كلها محسوبة من السجل المركزي مباشرة
     ============================================================ */
  var todayIn = todayIncome(d);
  var D  = allDues();
  var A  = todayAtt(d);
  var doneN = gs.filter(function(g){ return sesState(g.id,d)==="done"; }).length;
  var dueRem = dueReminders().length;

  h += '<div class="stats">'+
    stat("حصص النهاردة", ar(gs.length),
         gs.length? ("خلص "+ar(doneN)+" من "+ar(gs.length)) : "مفيش حصص",
         (gs.length && doneN===gs.length) ? "money" : "acc") +
    stat("تحصيل النهاردة", money(todayIn),
         MONTHS[curM-1]+": "+money(monthIncome(curM)), "money") +
    '<button class="stat'+(D.todaySum?" late":"")+'" data-act="duesToday" '+
      'style="border:1px solid var(--line);cursor:pointer;text-align:right;font:inherit">'+
      '<div class="k">مستحق النهاردة</div>'+
      '<div class="v"'+(D.todaySum?' style="color:var(--bad)"':'')+'>'+money(D.todaySum)+'</div>'+
      '<div class="s">'+(D.today.length? ar(D.today.length)+' مستحق · اضغط للتفاصيل':'مفيش')+'</div>'+
    '</button>'+
    '<button class="stat'+(D.oldSum?" late":"")+'" data-act="duesOld" '+
      'style="border:1px solid var(--line);cursor:pointer;text-align:right;font:inherit">'+
      '<div class="k">متأخر قديم</div>'+
      '<div class="v"'+(D.oldSum?' style="color:var(--bad)"':'')+'>'+money(D.oldSum)+'</div>'+
      '<div class="s">'+(D.old.length? ar(D.old.length)+' مستحق · اضغط للتفاصيل':'مفيش')+'</div>'+
    '</button>'+
  '</div>';

  /* الحضور والغياب */
  if(A.total){
    h += '<div class="stats">'+
      stat("حاضر", ar(A.pres), A.late? ar(A.late)+" متأخر":"", A.pres?"money":"")+
      stat("غايب", ar(A.abs), "", A.abs?"late":"")+
      stat("اترصد", ar(A.marked)+" من "+ar(A.total),
           A.marked<A.total? ar(A.total-A.marked)+" لسه":"اكتمل",
           A.marked===A.total?"money":"warn")+
      stat("الطلاب", ar(activeStudents().length), ar(DB.groups.length)+" مجموعة","")+
    '</div>';
  }

  /* مجموعات مستحقة الدفع النهاردة */
  var GD = groupsDueToday();
  if(GD.length){
    h += '<div class="card"><div class="hd"><h3>مجموعات مستحقة الدفع النهاردة</h3>'+
      '<span class="tag">'+ar(GD.length)+'</span></div><div class="bd flush">';
    GD.forEach(function(x){
      var pct = x.need? Math.round(x.got/x.need*100) : 100;
      h += '<button class="item" data-act="openGroup" data-g="'+x.g.id+'">'+
        '<span class="av'+(x.rest?" b":" g")+'">₤</span>'+
        '<span class="tx"><b>'+esc(x.g.name)+'</b><small>'+
          ar(x.n)+' مستحق · المطلوب '+money(x.need)+' · اتحصّل '+money(x.got)+
          (x.rest? ' · باقي '+money(x.rest):'')+'</small></span>'+
        '<span class="tag '+(x.rest?"bad":"ok")+'">'+ar(pct)+'٪</span>'+
        '<span class="chev">‹</span></button>';
    });
    h += '</div></div>';
  }

  /* امتحانات النهاردة */
  var EX = examsToday(d);
  if(EX.length){
    h += '<div class="card"><div class="hd"><h3>امتحانات النهاردة</h3>'+
      '<span class="tag">'+ar(EX.length)+'</span></div><div class="bd flush">';
    EX.forEach(function(e){
      var g2 = groupById(e.gid);
      h += '<button class="item" data-act="'+(isOnlineExam(e)?"openOnline":"openExam")+
        '" data-e="'+e.id+'">'+
        '<span class="av">◔</span><span class="tx"><b>'+esc(e.title)+'</b><small>'+
        esc(g2?g2.name:"")+(isOnlineExam(e)? ' · '+ar((e.qs||[]).length)+' سؤال':'')+'</small></span>'+
        '<span class="chev">‹</span></button>';
    });
    h += '</div></div>';
  }

  if(dueRem){
    var r0 = dueReminders()[0];
    h += '<div class="note warn" style="margin-bottom:12px">'+
      '<b>⏰ تذكير:</b> '+esc(r0.title)+
      (dueRem>1? ' <span class="mut">وكمان '+ar(dueRem-1)+'</span>':'')+
      ' <button class="btn ghost sm" data-act="tab" data-t="remind" style="margin-inline-start:6px">شوفهم</button></div>';
  }

  /* حصص النهاردة */
  h += '<div class="card"><div class="hd"><h3>حصص '+esc(DAYS[dowOf(d)])+'</h3>'+
    '<input type="date" value="'+d+'" data-act="setDate" style="width:auto;padding:7px 9px;font-size:13px">'+
    '</div><div class="bd flush">';
  if(!gs.length){
    h += '<div class="empty"><div class="big">☕</div><b>مفيش حصص النهاردة</b>'+
      '<p>لو عندك مجموعة بتيجي النهاردة، ظبّط أيامها من صفحتها.</p></div>';
  }else{
    gs.forEach(function(g){
      var st = groupStudents(g.id);
      var ses = sesOf(g.id, d);
      var done = ses ? Object.keys(ses.att||{}).length : 0;
      var absN = 0;
      if(ses) for(var k in (ses.att||{})) if(ses.att[k]==="A") absN++;
      h += '<button class="item" data-act="openSes" data-g="'+g.id+'" data-d="'+d+'">'+
        '<span class="av'+(done?"":" w")+'">'+esc(g.time||"—").slice(0,5)+'</span>'+
        '<span class="tx"><b>'+esc(g.name)+'</b><small>'+
          ar(st.length)+' طالب'+(g.place? ' · '+esc(g.place):'')+
          (done? ' · اترصد '+ar(done)+(absN?' · '+ar(absN)+' غايب':'') : ' · لسه ماترصدش')+
        '</small></span>'+
        (function(){
          var stt = sesState(g.id, d);
          if(stt==="done") return '<span class="tag ok">خلصت</span>';
          if(stt==="live") return '<span class="tag warn">جارية</span>';
          return '<span class="tag">لسه</span>';
        })()+
        '<span class="chev">‹</span></button>';
    });
  }
  h += '</div></div>';

  /* المتأخرين */
  if(late.length){
    h += '<div class="card"><div class="hd"><h3>متأخرين في الدفع</h3>'+
      '<span class="tag bad">'+ar(late.length)+'</span></div><div class="bd flush">';
    late.slice(0,6).forEach(function(s){
      var due = studentDue(s);
      h += '<button class="item" data-act="openStu" data-s="'+s.id+'">'+
        '<span class="av b">'+esc(initials(s.name))+'</span>'+
        '<span class="tx"><b>'+esc(s.name)+'</b><small>'+
          esc(studentGroups(s).map(function(g){ return g.name; }).join(" · ")||"مفيش مجموعات")+'</small></span>'+
        '<span class="tag bad">'+money(due.rest)+'</span><span class="chev">‹</span></button>';
    });
    if(late.length>6) h += '<button class="item" data-act="tab" data-t="money">'+
      '<span class="tx mut" style="text-align:center">…وكمان '+ar(late.length-6)+' — شوف كل المتأخرات</span></button>';
    h += '</div></div>';
  }
  if(!DB.groups.length) h += firstRun();
  return h;
}
function firstRun(){
  return '<div class="card"><div class="bd">'+
    '<div class="eyebrow">البداية</div>'+
    '<h3 style="font-size:17px;margin:5px 0 8px">ابدأ في ٣ خطوات</h3>'+
    '<div class="note" style="margin-bottom:10px"><b>١)</b> اعمل مجموعة — المادة والصف والمواعيد والسعر الشهري.<br>'+

    '<button class="btn block" data-act="newGroup">+ اعمل أول مجموعة</button>'+
    '</div></div>';

  h += '</div></div>';

/* ============================================================
   شجرة الحصص: شهور ← أسابيع ← حصص
   الشهر بيتقسم ٤ أسابيع بأيام الشهر (١–٧ · ٨–١٤ · ١٥–٢١ · ٢٢–آخر
   الشهر). تقسيم ثابت وواضح، والمدرّس بيلاقي حصته بسرعة.
   ============================================================ */
function weekOfMonth(d){
  var day = num(String(d).slice(8,10), 1);
  return Math.min(4, Math.ceil(day/7));
}
function weekName(w){ return ["الأسبوع الأول","الأسبوع الثاني","الأسبوع الثالث","الأسبوع الرابع"][w-1]||("أسبوع "+w); }
function monthKeyOf(d){ return String(d).slice(0,7); }
function monthName(mk){
  var p = String(mk).split("-");
  return (MONTHS[num(p[1],1)-1]||"") + " " + ar(p[0]);
}
/* كل حصص المجموعة مرتّبة شهر ← أسبوع */
function groupSessionTree(gid){
  var months = {};
  for(var k in DB.sessions){
    var p = k.split("|");
    if(p[0]!==gid) continue;
    var d = p[1], mk = monthKeyOf(d), w = weekOfMonth(d);
    months[mk] = months[mk] || { key:mk, weeks:{}, n:0, marked:0 };
    months[mk].weeks[w] = months[mk].weeks[w] || { w:w, days:[] };
    months[mk].weeks[w].days.push(d);
    months[mk].n++;
    var o = DB.sessions[k], cnt = 0;
    for(var q in (o.att||{})) cnt++;
    if(cnt) months[mk].marked++;
  }
  return Object.keys(months).sort().reverse().map(function(mk){
    var m = months[mk];
    m.weekList = Object.keys(m.weeks).map(Number).sort(function(a,b){ return b-a; })
      .map(function(w){
        m.weeks[w].days.sort().reverse();
        return m.weeks[w];
      });
    return m;
  });
}
function sesInfo(gid, d){
  var o = sesOf(gid, d) || { att:{} };
  var n2=0, abs=0, late=0;
  for(var q in (o.att||{})){
    n2++;
    if(o.att[q]==="A") abs++;
    else if(o.att[q]==="L") late++;
  }
  return { n:n2, abs:abs, late:late, pres:n2-abs, title:o.title||"",
           state: o.ended? "done" : (o.started||n2? "live":"none") };
}

          '" style="color:var(--bad);flex:0 0 auto">حذف الشهر</button>'+

    if(openM){

        h += '<div style="padding-inline-start:22px;border-top:1px solid var(--line2)">'+

              '" data-w="'+wk.w+'" style="color:var(--bad);flex:0 0 auto;padding:5px 9px">✕</button>'+
          '</div>';
        if(openW){

                  (i2.abs? ' · '+ar(i2.abs)+' غايب':'')+(i2.late? ' · '+ar(i2.late)+' متأخر':'')
                  : 'لسه ماترصدش')+'</small></button>'+
              (i2.state==="done"? '<span class="tag ok">خلصت</span>'
                : (i2.state==="live"? '<span class="tag warn">جارية</span>':''))+
              '<button class="btn ghost sm" data-act="editSes" data-g="'+gid+'" data-d="'+d+

          });

        h += '</div>';

    }
    h += '</div>';

  return h + '</div></div>';
