      '<span class="tx" style="text-align:center">…وكمان '+ar(hist.length-20)+' حصة</span></div>';
    h += '</div></div>';
  }

  /* سجل الدفعات */
  var mine = DB.pays.filter(function(p){ return p.sid===sid; })
    .sort(function(a,b){ return (b.at||0)-(a.at||0); });
  if(mine.length){
    h += '<div class="card"><div class="hd"><h3>سجل الدفعات</h3>'+
      '<button class="btn ghost sm" data-act="printStu" data-s="'+sid+'">⎙ إيصال</button></div><div class="bd flush">';
    mine.slice(0,12).forEach(function(p){
      var g = groupById(p.gid);
      h += '<div class="item" style="cursor:default"><span class="av">✓</span>'+
        '<span class="tx"><b>'+esc(MONTHS[p.mi-1])+' — '+esc(g?g.name:"—")+'</b>'+
        '<small>'+fmtD(p.date)+'</small></span>'+
        '<span class="tag ok">'+money(p.amount)+'</span></div>';
    });
    h += '</div></div>';
  }
  return h;
}

function viewExamResults(eid){
  var e = examById(eid);
  if(!e){ UI.sub=null; return viewExams(); }
  var g = groupById(e.gid), studs = groupStudents(e.gid), o = onlineStats(e);
  var h = back("الامتحان","backOnline");
  h += pageHd("نتائج: "+e.title, esc(g?g.name:"")+" · من "+ar(o.total)+" درجة",
    '<button class="btn ghost sm" data-act="exReport" data-e="'+eid+'">⎙ تقرير</button>'+
    '<button class="btn ghost sm" data-act="exCsv" data-e="'+eid+'">↓ تصدير</button>');

  h += '<div class="stats">'+
    stat("سلّموا", ar(o.submitted)+" / "+ar(o.students), ar(o.notStarted)+" ما دخلوش","")+
    stat("المتوسط", o.avg!=null? ar(o.avg) : "—", "من "+ar(o.total),"acc")+
    stat("أعلى / أقل", (o.max!=null? ar(o.max):"—")+" / "+(o.min!=null? ar(o.min):"—"),"","money")+
    stat("نسبة النجاح", ar(o.passPct)+"٪", ar(o.pass)+" ناجح · "+ar(o.fail)+" راسب",
         o.passPct>=60?"money":"late")+
  '</div>';

  if(o.pending)
    h += '<div class="note warn" style="margin-bottom:12px"><b>'+ar(o.pending)+
      ' طالب</b> عنده أسئلة مقالية محتاجة تصحيح. النتيجة مش نهائية قبل ما تصحّحها.</div>';

  h += '<div class="card"><div class="hd"><h3>الطلاب</h3></div><div class="bd flush">';
  studs.forEach(function(st){
    var a = o.byStu[st.id];
    if(!a){
      h += '<div class="item" style="cursor:default;opacity:.6">'+
        '<span class="av w">—</span><span class="tx"><b>'+esc(st.name)+'</b>'+
        '<small>ما دخلش الامتحان</small></span>'+
        '<span class="tag">غايب</span></div>';
      return;
    }
    a = gradeAttempt(a);
    var pct = o.total? Math.round(a.total/o.total*100) : 0;
    var dur = a.submittedAt? Math.round((a.submittedAt-a.startedAt)/60000) : null;

/* ---------- تصحيح إجابات طالب ---------- */
function viewGradeStu(eid, sid){
  var e = examById(eid), st = studentById(sid);
  if(!e || !st){ UI.sub=null; return viewExams(); }
  var all = attemptsOf(eid, sid);
  var a = all.filter(function(x){ return x.submittedAt; }).sort(function(x,y){ return y.total-x.total; })[0] || all[0];
  if(!a) { UI.sub={res:eid}; return viewExamResults(eid); }
  a = gradeAttempt(a);
  var tot = examTotalMark(e);
  var pct = tot? Math.round(a.total/tot*100) : 0;
  var qs = (e.qs||[]).slice().sort(function(x,y){ return num(x.order,0)-num(y.order,0); });

  var h = back("النتائج","backResults");
  h += pageHd(st.name, esc(e.title)+" · "+ar(a.total)+" من "+ar(tot)+" ("+ar(pct)+"٪)",
    (contactOf(st)? '<button class="btn ghost sm" data-act="waExamRes" data-e="'+eid+'" data-s="'+sid+'">✆ ابعت النتيجة</button>':''));

  h += '<div class="stats">'+
    stat("تلقائي", ar(a.auto),"","money")+
    stat("يدوي", ar(a.manual),"","")+
    stat("النهائي", ar(a.total), "من "+ar(tot), pct>=50?"money":"late")+
    stat("الحالة", a.pending? "في انتظار التصحيح":"مكتمل",
         a.pending? ar(a.pending)+" سؤال":"", a.pending?"late":"money")+
  '</div>';

  h += '<div class="card"><div class="bd flush">';
  qs.forEach(function(q,i){
    var ans = (a.answers||{})[q.id];
    var mk  = (a.marks||{})[q.id];
    var auto = qIsAuto(q);
    var shown = ans;
    if(q.type==="mcq") shown = (q.opts||[])[num(ans,-1)] || "—";
    if(q.type==="tf")  shown = ans==="1"? "صح" : (ans==="0"? "خطأ" : "—");
    var right = "";
    if(q.type==="mcq") right = (q.opts||[])[num(q.correct,-1)] || "";
    if(q.type==="tf")  right = String(q.tf)==="1"? "صح":"خطأ";
    if(q.type==="text") right = (q.texts||[]).join(" · ");
    var ok2 = auto && mk!=null && num(mk,0) >= num(q.mark,1);

    h += '<div class="item" style="cursor:default;align-items:flex-start;flex-direction:column;gap:8px">'+
      '<div style="display:flex;gap:10px;width:100%;align-items:flex-start">'+
        '<span class="av'+(auto? (ok2?" g":" b") : " w")+'">'+ar(i+1)+'</span>'+
        '<span class="tx"><b style="white-space:normal">'+esc(q.text)+'</b>'+
        '<small>'+esc(qTypeName(q.type))+' · '+ar(q.mark)+' درجة · '+
          (auto?"تلقائي":"يدوي")+'</small></span>'+
        '<span class="tag '+(mk!=null&&mk!==""?(ok2||!auto?"ok":"bad"):"warn")+'">'+
          (mk!=null&&mk!==""? ar(mk)+" / "+ar(q.mark) : "للتصحيح")+'</span>'+
      '</div>'+
      '<div style="width:100%;padding-inline-start:48px">'+
        '<div class="note" style="margin-bottom:6px"><b>إجابة الطالب:</b><br>'+
          (shown===undefined||shown===""||shown===null? '<span style="color:var(--bad)">لم يجب</span>'
            : esc(String(shown)))+'</div>'+
        (right? '<div class="note ok" style="margin-bottom:6px"><b>الإجابة الصحيحة:</b> '+esc(right)+'</div>':'')+
        (!auto
          ? '<div class="row" style="flex-wrap:nowrap;gap:7px">'+
            '<input type="number" inputmode="decimal" step="0.5" min="0" max="'+esc(q.mark)+'" '+
              'value="'+esc(mk==null?"":mk)+'" data-act="setQMark" data-a="'+a.id+'" data-q="'+q.id+
              '" placeholder="الدرجة" style="width:90px;flex:0 0 90px;text-align:center">'+
            '<input type="text" value="'+esc((a.notes||{})[q.id]||"")+'" '+
              'data-act="setQNote" data-a="'+a.id+'" data-q="'+q.id+
              '" placeholder="تعليق للطالب (اختياري)" style="flex:1">'+
            '</div>' : '')+
      '</div></div>';
  });
  return h+'</div></div>';
}

/* ============================================================
   سجل الحصص — كل حصة اترصدت
   ============================================================ */
function allSessions(){
  var out = [];
  for(var k in DB.sessions){
    var p = k.split("|");
    var g = groupById(p[0]);
    if(!g) continue;
    var o = DB.sessions[k], att = o.att||{};
    var pres=0, abs=0, late=0, n2=0;
    for(var sid in att){
      n2++;
      if(att[sid]==="P") pres++;
      else if(att[sid]==="A") abs++;
      else if(att[sid]==="L") late++;
    }
    out.push({ gid:p[0], date:p[1], g:g, n:n2, pres:pres, abs:abs, late:late,
               title: o.title||"",
               state: o.ended? "done" : (o.started||n2? "live":"none") });
  }
  return out.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}
function viewSessionLog(){
  var gid = UI.shG || "";

    '<th>المحصّل</th><th>الحضور</th></tr></thead><tbody>';

    var exp = 0, got = 0, tot = 0, pres = 0;
    st.forEach(function(s){
      dueMonths(s,g).forEach(function(mi){
        exp += num(g.fee);
        if(isPaid(s.id,g.id,mi)) got += num(g.fee);
      });
      var a = attStats(s.id,g.id); tot += a.tot; pres += a.pres;
    });
    h += '<tr><td><b>'+esc(g.name)+'</b></td><td class="num">'+ar(st.length)+'</td>'+
      '<td>'+money(g.fee)+'</td><td>'+money(exp)+'</td>'+
      '<td><b style="color:var(--seal)">'+money(got)+'</b></td>'+
      '<td class="num">'+(tot? ar(Math.round(pres/tot*100))+"٪" : "—")+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  /* أكتر الطلاب غيابًا */
  var byAbs = activeStudents().map(function(s){
    var a = attStats(s.id, null); return { s:s, a:a };
  }).filter(function(x){ return x.a.abs>0; }).sort(function(x,y){ return y.a.abs-x.a.abs; });
  if(byAbs.length){
    h += '<div class="card"><div class="hd"><h3>الأكتر غيابًا</h3></div><div class="bd flush">';
    byAbs.slice(0,8).forEach(function(x){
      h += '<button class="item" data-act="openStu" data-s="'+x.s.id+'">'+
        '<span class="av w">'+esc(initials(x.s.name))+'</span>'+
        '<span class="tx"><b>'+esc(x.s.name)+'</b><small>حضور '+ar(x.a.rate)+'٪</small></span>'+
        '<span class="tag warn">'+ar(x.a.abs)+' غياب</span></button>';
    });
    h += '</div></div>';
  }

  h += '<div class="card"><div class="hd"><h3>البيانات</h3></div><div class="bd">'+
    '<div class="note">بياناتك محفوظة على جهازك بس. خد نسخة احتياطية بانتظام.</div>'+
    '<div class="row" style="margin-top:10px">'+
    '<button class="btn ghost sm" data-act="backup">↓ نسخة احتياطية</button>'+
    '<button class="btn ghost sm" data-act="restore">↑ استرجاع</button>'+
    '<button class="btn ghost sm" data-act="wipe" style="color:var(--bad)">مسح الكل</button>'+
    '</div></div></div>';
  return h;
}

/* ============================================================
   امتحانات الطالب
   الطالب بيدخل بكود مجموعته، فمبيشوفش غير امتحانات مجموعته.
   الإجابات بتتحفظ محليًا مع كل تغيير + بتترفع للسحابة — فلو
   الصفحة اتحدّثت أو النت قطع، الإجابات مبتضيعش.

function stuExams(){
  if(!GATE.sid) return [];
  var out = [];
  (GATE.exams||[]).forEach(function(e){
    if(examState(e)==="draft" || examState(e)==="closed") return;
    out.push(e);
  });
  return out.sort(function(a,b){ return String(b.from||"").localeCompare(String(a.from||"")); });
}
function stuAttempt(examId){
  var k = "att_"+examId+"_"+GATE.sid;
  try{ var v = localStorage.getItem(KEY+"_"+k); return v? JSON.parse(v) : null; }
  catch(e){ return null; }
}
function saveStuAttempt(a){
  try{ localStorage.setItem(KEY+"_att_"+a.examId+"_"+a.sid, JSON.stringify(a)); }catch(e){}
  /* الرفع للسحابة — فشله مايضيّعش الإجابة المحفوظة محليًا */
  if(fbOn()){
    fbSet("attempts/"+GATE.code+"/"+a.examId+"/"+a.sid, a).catch(function(){
      UI.saveWarn = true;
    });
  }
}

        '</small></span>'+
        '<span class="tag '+stt.c+'">'+esc(stt.name)+'</span>'+

                ? '<button class="btn block" data-act="stuStart" data-e="'+e.id+'">'+

/* التحقق من صلاحية الطالب — بيتأكد من الوقت والمحاولات */
function examOpenForStu(e){
  if(examState(e)!=="open") return { ok:false, why:"الامتحان مش متاح دلوقتي" };
  var a = stuAttempt(e.id);
  if(a && !a.submittedAt) return { ok:true, resume:a };
  if(a && a.submittedAt){
    var tries = Math.max(1, num(e.tries,1));
    if(num(a.tryNo,1) >= tries) return { ok:false, why:"خلصت محاولاتك ("+ar(tries)+")" };
  }
  return { ok:true };
}

function attemptLeftStu(a, e){
  var mins = num(e.mins,0);
  if(!mins) return 999999;
  var endD = a.startedAt + mins*60000;
  var endW = e.to ? new Date(e.to).getTime() : Infinity;
  return Math.max(0, Math.floor((Math.min(endD, endW) - Date.now())/1000));
}
function fmtLeft(s){
  if(s>=999999) return "بلا حد";
  var m = Math.floor(s/60), x = s%60;
  return m+":"+String(x).padStart(2,"0");
}

function nextSession(g){
  var days = g.days||[];
  if(!days.length) return null;
  var d = new Date();
  for(var i=0;i<8;i++){
    var dw = d.getDay();
    if(days.indexOf(dw)>=0)
      return { label: (i===0? "النهاردة "+DAYS[dw] : (i===1? "بكرة "+DAYS[dw] : DAYS[dw]+" "+fmtD(iso(d)))) };
    d.setDate(d.getDate()+1);
  }
  return null;
}

function saveGroup(){
  var gid = $("#modal").dataset.gid;
  var name = val("g_name").trim();
  if(!name){ toast("اكتب اسم المجموعة"); return; }
  var days = [];
  document.querySelectorAll(".gday").forEach(function(b){ if(b.checked) days.push(num(b.value)); });
  var g = gid ? groupById(gid) : null;
  if(!g){ g = { id:uid("g"), status:"on" }; DB.groups.push(g); }
  if(!g.code) g.code = genGroupCode(val("g_sub").trim() || name);
  g.name = name; g.subject = val("g_sub").trim(); g.grade = val("g_grade").trim();
  g.days = days; g.time = val("g_time"); g.fee = num(val("g_fee"));
  g.mode = val("g_mode")||"month";           /* الطريقة الافتراضية للطلاب الجدد */
  g.payday = Math.min(28, Math.max(1, num(val("g_payday"),1)));
  g.perMonth = Math.max(1, num(val("g_per"),8));
  g.startDate = val("g_start") || g.startDate || today();
  g.billFrom  = val("g_bill")  || g.startDate;
  g.place = val("g_place").trim();
  if(gid) g.status = val("g_status")||"on";
  saveSync(); closeModal(); render();
  toast(gid? "اتحفظت" : "اتضافت المجموعة");
}

function saveStu(){
  var sid = $("#modal").dataset.sid;
  var name = val("s_name").trim();
  if(!name){ toast("اكتب اسم الطالب"); return; }
  var grps = [];
  document.querySelectorAll(".sgrp").forEach(function(b){ if(b.checked) grps.push(b.value); });
  var s = sid ? studentById(sid) : null;
  if(!s){ s = { id:uid("s"), status:"on", at:Date.now() }; DB.students.push(s); }
  s.name = name; s.grade = val("s_grade").trim(); s.phone = val("s_phone").trim();
  s.guard = val("s_guard").trim(); s.guardPhone = val("s_gphone").trim();
  s.groups = grps;
  s.joinDate = val("s_jd") || s.joinDate || today();
  s.joinMonth = num(String(s.joinDate).slice(5,7), schoolMonths()[0]);
  var fv = val("s_fam"); if(fv) s.famId = fv; else delete s.famId;
  /* ============================================================
     تغيير الحالة المالية
     الإعفاء بيبدأ من تاريخ التغيير — مفيش إعفاء بأثر رجعي،
     ومفيش مستحقات بأثر رجعي عن فترة الإعفاء.
     ============================================================ */
  var oldMode = s.payMode || "";
  s.payMode = val("s_pay") || "month";
  if(s.payMode === "free"){
    s.exFrom   = val("s_exf") || s.exFrom || today();
    s.exTo     = val("s_ext") || "";
    s.exReason = val("s_exr") || "";
  }else if(oldMode === "free"){
    /* رجع يدفع — بنقفل فترة الإعفاء عند النهاردة عشان
       الفترة اللي فاتت تفضل معفية ومايتحسبش عنها مستحق */
    if(s.exFrom && !s.exTo){
      var y2 = new Date(); y2.setDate(y2.getDate()-1);
      s.exTo = iso(y2);
    }
  }
  s.note = val("s_note").trim();
  saveSync(); closeModal(); render();
  toast(sid? "اتحفظ" : "اتضاف الطالب");
}

/* ============================================================
   نافذة الحصة — مركز تحكم كامل
   كل طالب في صف واحد: الحضور · الدفع · الواجب · الملاحظة ·
   رسالة الغياب. نفس العمليات اللي في شاشة المجموعة بالظبط —
   مفيش منطق منفصل.
   ============================================================ */
function modalSession(gid, d){
  var g = groupById(gid);
  if(!g){ toast("المجموعة مش موجودة"); return; }
  var st = groupStudents(gid);
  if(!st.length){ toast("مفيش طلاب في المجموعة"); return; }
  UI.sesFilter = UI.sesFilter || "";
  UI.sesQ = UI.sesQ || "";
  openModal(sesModalHTML(gid, d));
}
function sesModalHTML(gid, d){
  var g = groupById(gid);
  var st = groupStudents(gid);
  var ses = sesOf(gid,d) || { att:{} };
  var mk = String(d).slice(0,7);
  var _t = ses.title;

  /* ملخّص الحصة — كله محسوب من البيانات المركزية */
  var pres=0, abs=0, late=0, free=0, needToday=0, gotToday=0, oldRest=0;
  var rows = st.map(function(s){
    var v = (ses.att||{})[s.id];
    if(v==="P") pres++; else if(v==="L"){ pres++; late++; } else if(v==="A") abs++;
    var ex = isExempt(s);
    if(ex) free++;
    /* مستحق اليوم لهذا الطالب */
    var todayDues = ex ? [] : duesOf(s.id, d).filter(function(x){ return x.date===d; });
    var need = todayDues.reduce(function(a,x){ return a+num(x.amount); },0);
    var got  = todayDues.reduce(function(a,x){ return a+num(x.paidAmt||0); },0);
    needToday += need; gotToday += got;
    /* متأخر سابق */
    var old = ex ? [] : duesOf(s.id, d).filter(function(x){ return x.date < d && x.rest>0; });
    var oldSum = old.reduce(function(a,x){ return a+num(x.rest); },0);
    oldRest += oldSum;
    return { s:s, v:v, ex:ex, dues:todayDues, need:need, got:got,
             rest:Math.max(0,need-got), old:oldSum };
  });

  /* الفلترة */
  var F = UI.sesFilter, Q = normAr(UI.sesQ||"");
  var shown = rows.filter(function(r){
    if(Q && normAr(r.s.name).indexOf(Q)<0) return false;
    if(F==="pres") return r.v==="P" || r.v==="L";
    if(F==="abs")  return r.v==="A";
    if(F==="unpaid") return !r.ex && r.rest>0;
    if(F==="paid")   return !r.ex && r.need>0 && r.rest<=0;
    if(F==="free")   return r.ex;
    if(F==="old")    return r.old>0;
    if(F==="due")    return !r.ex && r.need>0;
    return true;
  });

  var h = mh((_t? _t+" — " : g.name+" — ")+fmtD(d))+'<div class="mb">';

  /* ملخّص */
  h += '<div class="stats" style="margin-bottom:10px">'+
    stat("الطلاب", ar(st.length),
         "حاضر "+ar(pres)+" · غايب "+ar(abs)+(free? " · معفي "+ar(free):""), "")+
    stat("مستحق النهاردة", money(needToday),
         needToday? "اتحصّل "+money(gotToday):"مفيش تحصيل", needToday?"":"")+
    stat("المتبقي", money(Math.max(0,needToday-gotToday)), "", (needToday-gotToday)>0?"late":"money")+
    (oldRest? stat("متأخر سابق", money(oldRest), "من أيام فاتت", "late") : "")+
  '</div>';

  /* أزرار الحصة */
  var stt = sesState(gid,d);
  h += '<div class="row" style="margin-bottom:9px">'+
    (stt==="done"
      ? '<span class="tag ok" style="padding:8px 13px;font-size:13px">✓ الحصة خلصت</span>'+
        '<button class="btn ghost sm" data-act="reopenSes" data-g="'+gid+'" data-d="'+d+'">إعادة فتح</button>'
      : (stt==="live"
        ? '<button class="btn ok sm" data-act="endSes" data-g="'+gid+'" data-d="'+d+'">■ إنهاء الحصة</button>'
        : '<button class="btn sm" data-act="startSes" data-g="'+gid+'" data-d="'+d+'">▶ ابدأ الحصة</button>'))+
    '<button class="btn ghost sm" data-act="allPres" data-g="'+gid+'" data-d="'+d+'">✓ الكل حاضر</button>'+
    (abs? '<button class="btn sm" data-act="waAbsAll" data-g="'+gid+'" data-d="'+d+
      '" style="background:var(--warn)">✆ بلّغ الغائبين ('+ar(abs)+')</button>':'')+
  '</div>';

  /* بحث وفلترة */
  h += '<input type="text" id="ses_q" value="'+esc(UI.sesQ||"")+'" data-act="sesQ" '+
    'placeholder="ابحث عن طالب…" style="margin-bottom:8px">';
  h += '<div class="chips">'+
    [["","الكل",st.length],["pres","حاضر",pres],["abs","غايب",abs],
     ["due","عليه مستحق",rows.filter(function(r){return !r.ex&&r.need>0}).length],
     ["unpaid","لم يدفع",rows.filter(function(r){return !r.ex&&r.rest>0}).length],
     ["paid","دفع",rows.filter(function(r){return !r.ex&&r.need>0&&r.rest<=0}).length],
     ["old","متأخرات",rows.filter(function(r){return r.old>0}).length],
     ["free","معفي",free]].map(function(x){
      return '<button class="'+(F===x[0]?"on":"")+'" data-act="sesF" data-f="'+x[0]+'">'+
        esc(x[1])+' <small>'+ar(x[2])+'</small></button>';
    }).join("")+'</div>';

  /* صف لكل طالب */
  h += '<div style="border:1px solid var(--line);border-radius:11px;overflow:hidden">';
  if(!shown.length) h += '<div class="empty" style="padding:22px"><b>مفيش طلاب في الفلتر ده</b></div>';
  shown.forEach(function(r){
    var s = r.s, v = r.v;
    var tk = dayTaskOf(gid, d, s.id);
    var note = (ses.notes||{})[s.id] || "";
    var PL = r.need ? payLabel(r.need, r.got) : null;
    h += '<div style="padding:11px 12px;border-bottom:1px solid var(--line2)">'+
      /* الاسم والحالة */
      '<div style="display:flex;gap:9px;align-items:center;margin-bottom:7px">'+
        '<button class="av'+(r.ex?" g":(r.rest?" b":(v==="A"?" w":"")))+'" '+
          'data-act="openStuFromSes" data-s="'+s.id+'" style="border:0;cursor:pointer">'+
          esc(initials(s.name))+'</button>'+
        '<span class="tx"><b>'+esc(s.name)+'</b><small>'+
          (r.ex ? '★ معفي من الدفع'
            : (r.need ? esc(payModeName(payModeOf(s)))+' · '+money(r.need)+
                 (r.got? ' · اتدفع '+money(r.got):'')
               : esc(payModeName(payModeOf(s)))+' · مفيش تحصيل النهاردة'))+
          (r.old? ' · <span style="color:var(--bad)">متأخر سابق '+money(r.old)+'</span>':'')+
        '</small></span>'+
        (r.ex ? '<span class="tag ok">معفي</span>'
              : (PL ? '<span class="tag '+PL.c+'">'+esc(PL.t)+'</span>' : ''))+
      '</div>'+
      /* الأزرار */
      '<div style="display:flex;gap:5px;flex-wrap:wrap;padding-inline-start:47px">'+
        '<span class="att">'+
          '<button class="'+(v==="P"?"on p":"")+'" data-act="gAtt" data-g="'+gid+'" data-d="'+d+
            '" data-s="'+s.id+'" data-v="P" title="حاضر">✓</button>'+
          '<button class="'+(v==="L"?"on l":"")+'" data-act="gAtt" data-g="'+gid+'" data-d="'+d+
            '" data-s="'+s.id+'" data-v="L" title="متأخر">⏱</button>'+
          '<button class="'+(v==="A"?"on a":"")+'" data-act="gAtt" data-g="'+gid+'" data-d="'+d+
            '" data-s="'+s.id+'" data-v="A" title="غايب">✕</button>'+
        '</span>'+
        '<button class="btn '+(tk?"ok":"ghost")+' sm" data-act="gTask" data-g="'+gid+
          '" data-d="'+d+'" data-s="'+s.id+'" style="padding:6px 10px">'+
          esc(tk? (HW_STATES.filter(function(x){return x.id===tk})[0]||{}).n || "واجب" : "واجب")+'</button>'+
        (r.ex ? ''
          : (r.rest > 0
            ? '<button class="btn ok sm" data-act="payNow" data-g="'+gid+'" data-s="'+s.id+
              '" data-d="'+d+'" style="padding:6px 10px">₤ دفع '+money(r.rest)+'</button>'
            : (r.need
              ? '<button class="btn ghost sm" data-act="payNow" data-g="'+gid+'" data-s="'+s.id+
                '" data-d="'+d+'" style="padding:6px 10px;color:var(--ok)">✓ مدفوع</button>'
              : '')))+
        (r.old>0 && !r.ex
          ? '<button class="btn sm" data-act="payOld" data-s="'+s.id+
            '" style="padding:6px 10px;background:var(--bad)">متأخر '+money(r.old)+'</button>' : '')+
        '<button class="btn '+(note?"ok":"ghost")+' sm" data-act="sesNote" data-g="'+gid+
          '" data-d="'+d+'" data-s="'+s.id+'" style="padding:6px 10px" title="'+esc(note)+'">✎</button>'+
        (v==="A" && contactOf(s)
          ? '<button class="btn sm" data-act="waAbsent" data-s="'+s.id+'" data-g="'+gid+
            '" data-d="'+d+'" style="padding:6px 10px;background:var(--warn)">✆ غياب</button>' : '')+
      '</div>'+
      (note? '<div class="mut" style="font-size:12px;padding-inline-start:47px;margin-top:5px">'+
        '✎ '+esc(note)+'</div>' : '')+
      '</div>';
  });
  h += '</div></div>';
  return h + '<div class="mf"><button class="btn" data-act="close">تم</button></div>';
}

/* ============================================================
   الاستيراد
   بتلزق البيانات من إكسيل (نسخ ولصق) أو ترفع ملف CSV.
   الأعمدة: اسم الطالب · المجموعة (اسم أو كود) · الأيام · السعر الشهري
   الربط بيتم بكود المجموعة الأول، وبعده بالاسم. والمجموعة اللي

var IMP_COLS = [
  { k:"name",  label:"اسم الطالب",   al:["اسم الطالب","الاسم","اسم","الطالب","student","name"] },
  { k:"group", label:"المجموعة",     al:["المجموعة","المجموعه","مجموعة","مجموعه","group","الكود","كود","كود المجموعة"] },
  { k:"days",  label:"الأيام",       al:["الأيام","الايام","اليوم","المواعيد","days","يوم"] },
  { k:"fee",   label:"السعر الشهري", al:["السعر الشهري","السعر","الاشتراك","الشهري","المبلغ","fee","price"] },
  { k:"time",  label:"الوقت",        al:["الوقت","الساعة","الساعه","time"] },
  { k:"grade", label:"الصف",         al:["الصف","المرحلة","المرحله","grade","class"] },
  { k:"phone", label:"الهاتف",       al:["الهاتف","التليفون","الموبايل","phone","تليفون"] },
  { k:"guard", label:"ولي الأمر",    al:["ولي الأمر","ولي الامر","الوالد","guardian"] },
  { k:"gphone",label:"هاتف ولي الأمر",al:["هاتف ولي الأمر","هاتف ولي الامر","تليفون ولي الأمر"] }
];
/* بيفهم الأيام من أي صيغة: «سبت اتنين» · «السبت والاثنين» · «سبت،اثنين» */
function parseDays(txt){
  var t = normAr(txt);
  if(!t) return [];
  var out = [];
  var map = [
    [0, /احد|الاحد|sun/],
    [1, /اثنين|الاثنين|اتنين|mon/],
    [2, /ثلاثاء|الثلاثاء|تلات|tue/],
    [3, /اربعاء|الاربعاء|اربع|wed/],
    [4, /خميس|الخميس|thu/],
    [5, /جمعه|الجمعه|fri/],
    [6, /سبت|السبت|sat/]
  ];
  map.forEach(function(m){ if(m[1].test(t) && out.indexOf(m[0])<0) out.push(m[0]); });
  return out.sort();
}
/* بيقسّم النص المُلصق: تاب أو فاصلة أو أكتر من مسافتين */
function splitRow(line){
  if(line.indexOf("\t")>=0) return line.split("\t");
  if(line.indexOf(",")>=0 && line.split(",").length>=2) return splitCsv(line);
  return line.split(/\s{2,}|\s*\|\s*/);
}
function splitCsv(line){
  var out=[], cur="", q=false;
  for(var i=0;i<line.length;i++){
    var c = line[i];
    if(c==='"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if(c==="," && !q){ out.push(cur); cur=""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
/* بيحلّل النص لصفوف جاهزة */
function parseImport(text){
  var lines = String(text||"").split(/\r?\n/).map(function(l){ return l.trim(); })
    .filter(function(l){ return l.length; });
  if(!lines.length) return { rows:[], map:[], head:[] };
  var first = splitRow(lines[0]).map(function(c){ return c.trim(); });
  /* هل السطر الأول عناوين؟ */
  var map = first.map(function(c){
    var k = normAr(c);
    for(var i=0;i<IMP_COLS.length;i++)
      for(var j=0;j<IMP_COLS[i].al.length;j++)
        if(normAr(IMP_COLS[i].al[j])===k) return IMP_COLS[i].k;
    return "";
  });
  var hasHead = map.filter(Boolean).length >= 2;
  if(!hasHead){
    /* من غير عناوين: الترتيب المتوقع */
    map = ["name","group","days","fee","time","grade","phone","guard","gphone"].slice(0, first.length);
  }
  var body = hasHead ? lines.slice(1) : lines;
  var rows = [];
  body.forEach(function(l, i){
    var c = splitRow(l).map(function(x){ return String(x||"").trim().replace(/^"|"$/g,""); });
    var o = { _line: i+1+(hasHead?1:0) };
    map.forEach(function(k, ci){ if(k && c[ci]!==undefined) o[k] = c[ci]; });
    if(!o.name) return;
    rows.push(o);
  });
  return { rows:rows, map:map, head: hasHead? first : [] };
}
/* المعاينة قبل التنفيذ */
function importPreview(rows){
  var newG = {}, seen = {};
  var out = rows.map(function(r){
    var gTxt = String(r.group||"").trim();
    var g = gTxt ? (groupByCode(gTxt) || groupByName(gTxt)) : null;
    var isNew = false;
    if(!g && gTxt){
      if(!newG[normAr(gTxt)]){
        newG[normAr(gTxt)] = { name:gTxt, days:parseDays(r.days), fee:num(r.fee),
                               time:String(r.time||"").trim() };
      }
      isNew = true;
    }
    var st = null, dup = false;
    var nk = normAr(r.name);
    for(var i=0;i<DB.students.length;i++)
      if(normAr(DB.students[i].name)===nk){ st = DB.students[i]; break; }
    if(seen[nk+"|"+normAr(gTxt)]) dup = true;
    seen[nk+"|"+normAr(gTxt)] = 1;
    return { r:r, g:g, gTxt:gTxt, isNew:isNew, exist:st, dup:dup };
  });
  return { rows:out, newGroups:Object.keys(newG).map(function(k){ return newG[k]; }) };
}

function doImport(){
  var res = parseImport(UI.impText);
  var pv = importPreview(res.rows);
  if(!pv.rows.length){ toast("مفيش صفوف"); return; }
  var addG = 0, addS = 0, updS = 0, link = 0;
  pv.rows.forEach(function(x){
    if(x.dup) return;
    var r = x.r;
    /* المجموعة: بالكود ثم بالاسم، وإلا نعملها */
    var g = x.gTxt ? (groupByCode(x.gTxt) || groupByName(x.gTxt)) : null;
    if(!g && x.gTxt){
      g = { id:uid("g"), code:genGroupCode(x.gTxt), name:x.gTxt, subject:DB.meta.subject||"",
            grade:String(r.grade||"").trim(), days:parseDays(r.days), time:String(r.time||"").trim(),
            fee:num(r.fee), place:"", status:"on" };
      DB.groups.push(g); addG++;
    }else if(g){
      /* بنكمّل الناقص بس — مبنغيّرش اللي متسجّل */
      var d2 = parseDays(r.days);
      if(d2.length && !(g.days||[]).length) g.days = d2;
      if(num(r.fee) && !num(g.fee)) g.fee = num(r.fee);
      if(r.time && !g.time) g.time = String(r.time).trim();
    }
    /* الطالب */
    var nk = normAr(r.name), st = null;
    for(var i=0;i<DB.students.length;i++)
      if(normAr(DB.students[i].name)===nk){ st = DB.students[i]; break; }
    if(!st){
      st = { id:uid("s"), name:String(r.name).trim(), status:"on", groups:[],
             joinMonth:schoolMonths()[0], at:Date.now() };
      DB.students.push(st); addS++;
    }else updS++;
    if(r.grade && !st.grade) st.grade = String(r.grade).trim();
    if(r.phone && !st.phone) st.phone = String(r.phone).trim();
    if(r.guard && !st.guard) st.guard = String(r.guard).trim();
    if(r.gphone && !st.guardPhone) st.guardPhone = String(r.gphone).trim();
    if(g){
      st.groups = st.groups || [];
      if(st.groups.indexOf(g.id)<0){ st.groups.push(g.id); link++; }
    }
  });
  saveSync(); UI.impText=""; closeModal(); UI.tab="studs"; UI.sub=null; render();
  toast("اتضاف "+ar(addS)+" طالب"+(addG? " · "+ar(addG)+" مجموعة":"")+
        (updS? " · اتحدّث "+ar(updS):""));
}

function scanHit(code){
  var s = stuByCode(code);
  if(!s){ toast("الكود ده مش معروف: "+code); return; }
  var gid = UI.scanG;
  if((s.groups||[]).indexOf(gid)<0){

  }
  var d = today();
  if(attOf(gid,d,s.id)==="P"){ toast(s.name+" متسجّل قبل كده"); return; }
  setAtt(gid, d, s.id, "P");
  UI.scanLog = UI.scanLog || [];
  UI.scanLog.unshift({ name:s.name, time:new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}) });
  var box = document.getElementById("sc_log");
  if(box) box.innerHTML = scanLogHTML();
  var c = document.getElementById("sc_code"); if(c) c.value = "";
  try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}

var SCAN = { stream:null, timer:null };
function scanStart(){
  var box = document.getElementById("sc_cam");
  if(!box) return;
  if(!navigator.mediaDevices || !window.BarcodeDetector){
    box.textContent = "المتصفح ده مايدعمش الماسح — اكتب الكود بالإيد تحت";
    return;
  }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(function(st){
    SCAN.stream = st;
    box.innerHTML = "";
    var v = document.createElement("video");
    v.setAttribute("playsinline","");
    v.style.cssText = "width:100%;height:100%;object-fit:cover";
    v.srcObject = st; v.play();
    box.appendChild(v);
    var det = new window.BarcodeDetector({ formats:["qr_code"] });
    SCAN.timer = setInterval(function(){
      det.detect(v).then(function(codes){
        if(codes && codes.length) scanHit(codes[0].rawValue);
      }).catch(function(){});
    }, 700);
  }).catch(function(){
    box.textContent = "مقدرتش أفتح الكاميرا — اسمح بالإذن أو اكتب الكود بالإيد";
  });
}
function scanStop(){
  if(SCAN.timer){ clearInterval(SCAN.timer); SCAN.timer=null; }
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(function(t){ t.stop(); }); SCAN.stream=null; }
  var box = document.getElementById("sc_cam");
  if(box) box.textContent = "الكاميرا متوقفة";
}

/* بيجمّع بيانات الطالب في المدة */
function stuReportData(sid, from, to){
  var s = studentById(sid);
  var gs = studentGroups(s);
  /* الحضور */
  var att = { total:0, present:0, absent:0, late:0, rows:[] };
  for(var k in DB.sessions){
    var p = k.split("|"), d = p[1];
    if(from && d < from) continue;
    if(to && d > to) continue;
    var v = (DB.sessions[k].att||{})[sid];
    if(v===undefined) continue;
    var g = groupById(p[0]);
    att.total++;
    if(v==="P") att.present++;
    else if(v==="L"){ att.late++; att.present++; }
    else att.absent++;
    att.rows.push({ date:d, g:g? g.name : "—", v:v });
  }
  att.rows.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  att.rate = att.total ? Math.round(att.present/att.total*100) : 100;

  /* الواجبات */
  var tk = { total:0, done:0, rows:[] };
  DB.tasks.forEach(function(t){
    if(from && t.date < from) return;
    if(to && t.date > to) return;
    if(!groupStudents(t.gid).some(function(x){ return x.id===sid; })) return;
    tk.total++;
    var ok2 = !!(t.done||{})[sid];
    if(ok2) tk.done++;
    tk.rows.push({ date:t.date, title:t.title, kind:taskKindName(t.kind), done:ok2,
                   g:(groupById(t.gid)||{}).name||"" });
  });
  tk.rows.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  tk.pct = tk.total ? Math.round(tk.done/tk.total*100) : 100;

  /* الامتحانات */
  var ex = { rows:[], sum:0, max:0 };
  DB.exams.forEach(function(e){
    var d2 = (e.date||"").slice(0,10);
    if(from && d2 < from) return;
    if(to && d2 > to) return;
    var mark = null, tot = null;
    if(isOnlineExam(e)){
      var a = attemptsOf(e.id, sid).filter(function(x){ return x.submittedAt; })
        .sort(function(x,y){ return num(y.total,0)-num(x.total,0); })[0];
      if(!a) return;
      a = gradeAttempt(a);
      mark = a.total; tot = examTotalMark(e);
    }else{
      var v2 = (e.marks||{})[sid];
      if(v2===undefined || v2===null || v2==="") return;
      mark = num(v2); tot = num(e.max,100);
    }
    ex.sum += mark; ex.max += tot;
    ex.rows.push({ date:d2, title:e.title, mark:mark, tot:tot,
                   pct: tot? Math.round(mark/tot*100) : 0,
                   g:(groupById(e.gid)||{}).name||"" });
  });
  ex.rows.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  ex.pct = ex.max ? Math.round(ex.sum/ex.max*100) : null;

  /* الفلوس */
  var pays = DB.pays.filter(function(p2){
    return p2.sid===sid && (!from || p2.date>=from) && (!to || p2.date<=to); });
  var ses = sesDuesOf(sid).filter(function(x){
    return (!from || x.date>=from) && (!to || x.date<=to); });
  var money2 = {
    paid: pays.reduce(function(a,x){ return a+num(x.amount); },0) +
          ses.filter(function(x){ return x.paid; }).reduce(function(a,x){ return a+num(x.amount); },0),
    rest: studentDue(s).rest,
    rows: pays.map(function(p2){
      return { date:p2.date, what:(MONTHS[p2.mi-1]||"")+" — "+((groupById(p2.gid)||{}).name||""),
               amount:num(p2.amount) };
    }).concat(ses.filter(function(x){ return x.paid; }).map(function(x){
      return { date:x.paidAt||x.date, what:"حصة "+fmtD(x.date)+" — "+((groupById(x.gid)||{}).name||""),
               amount:num(x.amount) };
    })).sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); })
  };
  return { s:s, gs:gs, from:from, to:to, att:att, tk:tk, ex:ex, money:money2 };
}

/* ============================================================
   فحص سلامة الربط
   بيدوّر على البيانات اليتيمة: حاجة بتشير لمجموعة أو طالب
   اتحذفوا. البيانات دي بتظهر في شاشات بأسماء فاضية وبتلخبط
   الإحصائيات، فالأحسن نلاقيها ونصلّحها.
   ============================================================ */
function healthCheck(){
  var gIds = {}, sIds = {}, eIds = {};
  DB.groups.forEach(function(g){ gIds[g.id]=1; });
  DB.students.forEach(function(x){ sIds[x.id]=1; });
  DB.exams.forEach(function(e){ eIds[e.id]=1; });
  var out = [];
  function add(what, n2, fix){ if(n2) out.push({ what:what, n:n2, fix:fix }); }

  var badSes = Object.keys(DB.sessions).filter(function(k){ return !gIds[k.split("|")[0]]; });
  add("حصص لمجموعات محذوفة", badSes.length, function(){
    badSes.forEach(function(k){ delete DB.sessions[k]; }); });

  var badEx = DB.exams.filter(function(e){ return !gIds[e.gid]; });
  add("امتحانات لمجموعات محذوفة", badEx.length, function(){
    DB.exams = DB.exams.filter(function(e){ return gIds[e.gid]; }); });

  var badTk = DB.tasks.filter(function(t){ return !gIds[t.gid]; });
  add("واجبات لمجموعات محذوفة", badTk.length, function(){
    DB.tasks = DB.tasks.filter(function(t){ return gIds[t.gid]; }); });

  var badPay = DB.pays.filter(function(p){ return !sIds[p.sid] || !gIds[p.gid]; });
  add("دفعات لطلاب أو مجموعات محذوفة", badPay.length, function(){
    DB.pays = DB.pays.filter(function(p){ return sIds[p.sid] && gIds[p.gid]; }); });

  var badDue = (DB.sesDue||[]).filter(function(x){ return !sIds[x.sid] || !gIds[x.gid]; });
  add("مستحقات حصص يتيمة", badDue.length, function(){
    DB.sesDue = (DB.sesDue||[]).filter(function(x){ return sIds[x.sid] && gIds[x.gid]; }); });

  var badAtt = DB.attempts.filter(function(a){ return !eIds[a.examId] || !sIds[a.sid]; });
  add("محاولات امتحان يتيمة", badAtt.length, function(){
    DB.attempts = DB.attempts.filter(function(a){ return eIds[a.examId] && sIds[a.sid]; }); });

  /* درجات وحضور وواجبات لطلاب محذوفين */
  var ghostMarks = 0;
  DB.exams.forEach(function(e){
    Object.keys(e.marks||{}).forEach(function(sid){ if(!sIds[sid]) ghostMarks++; }); });
  add("درجات لطلاب محذوفين", ghostMarks, function(){
    DB.exams.forEach(function(e){
      Object.keys(e.marks||{}).forEach(function(sid){ if(!sIds[sid]) delete e.marks[sid]; }); }); });

  var ghostAtt = 0;
  Object.keys(DB.sessions).forEach(function(k){
    Object.keys(DB.sessions[k].att||{}).forEach(function(sid){ if(!sIds[sid]) ghostAtt++; }); });
  add("حضور لطلاب محذوفين", ghostAtt, function(){
    Object.keys(DB.sessions).forEach(function(k){
      Object.keys(DB.sessions[k].att||{}).forEach(function(sid){
        if(!sIds[sid]) delete DB.sessions[k].att[sid]; }); }); });

  var ghostTk = 0;
  DB.tasks.forEach(function(t){
    Object.keys(t.done||{}).forEach(function(sid){ if(!sIds[sid]) ghostTk++; }); });
  add("واجبات لطلاب محذوفين", ghostTk, function(){
    DB.tasks.forEach(function(t){
      Object.keys(t.done||{}).forEach(function(sid){ if(!sIds[sid]) delete t.done[sid]; }); }); });

  var badFam = DB.students.filter(function(x){
    return x.famId && !DB.families.some(function(f){ return f.id===x.famId; }); });
  add("طلاب مربوطين بأسر محذوفة", badFam.length, function(){
    badFam.forEach(function(x){ delete x.famId; }); });

  var badGrp = 0;
  DB.students.forEach(function(x){
    (x.groups||[]).forEach(function(g){ if(!gIds[g]) badGrp++; }); });
  add("طلاب في مجموعات محذوفة", badGrp, function(){
    DB.students.forEach(function(x){
      x.groups = (x.groups||[]).filter(function(g){ return gIds[g]; }); }); });

  return out;
}

   يكتب اللي استلمه بس والنظام يوزّعه.
   ============================================================ */
function modalPay(s, g, dues, d, title){
  var rest = dues.reduce(function(a,x){ return a+num(x.rest); }, 0);
  var full = dues.reduce(function(a,x){ return a+num(x.amount); }, 0);
  var paid = full - rest;
  openModal(mh(title || ("دفع — "+s.name))+'<div class="mb">'+
    '<div class="note" style="margin-bottom:11px"><b>'+esc(s.name)+'</b>'+
      ' · '+esc(payModeName(payModeOf(s)))+
      (g? '<br>'+esc(g.name):'')+'</div>'+
    '<div class="stats" style="margin-bottom:11px">'+
      stat("المستحق", money(full), ar(dues.length)+" بند","")+
      (paid? stat("اتدفع", money(paid),"","money"):"")+
      stat("المتبقي", money(rest),"", rest?"late":"money")+
    '</div>'+
    '<div style="border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:11px">'+
      dues.map(function(x){
        var L = payLabel(x.amount, x.paidAmt||0);
        return '<div style="display:flex;align-items:center;gap:8px;padding:9px 11px;'+
          'border-bottom:1px solid var(--line2);font-size:13px">'+
          '<span style="flex:1"><b>'+esc(x.what)+'</b><br>'+
            '<span class="mut">'+fmtD(x.date)+' · '+(x.kind==="ses"?"حصة":"شهري")+'</span></span>'+
          ((x.paidAmt||0)? '<span class="mut">اتدفع '+money(x.paidAmt)+'</span>':'')+
          '<span class="tag '+L.c+'">'+money(x.rest)+'</span></div>';
      }).join("")+'</div>'+
    '<label class="f"><span>المبلغ المستلم</span>'+
      '<input type="number" id="py_a" inputmode="decimal" value="'+esc(rest)+'" '+
      'style="font-size:20px;text-align:center;font-weight:700"></label>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<button class="btn ghost sm" data-act="pySet" data-v="'+rest+'">الكل ('+money(rest)+')</button>'+
      '<button class="btn ghost sm" data-act="pySet" data-v="'+Math.round(rest/2)+'">نص ('+money(Math.round(rest/2))+')</button>'+
    '</div>'+
    '<div class="note">لو دفع أقل من المستحق، الباقي هيفضل عليه والحالة هتبقى '+
      '<b>مدفوع جزئيًا</b>. والمبلغ بيتوزّع على البنود من الأقدم للأحدث.</div>'+
    '</div>'+
    '<div class="mf"><button class="btn ghost" data-act="payBack">رجوع</button>'+
    '<button class="btn" data-act="savePay">✓ سجّل الدفع</button></div>');
  $("#modal").dataset.sid = s.id;
  $("#modal").dataset.dues = JSON.stringify(dues.map(function(x){
    return { id:x.id, kind:x.kind, gid:x.gid, mi:x.mi||0,
             amount:num(x.amount), rest:num(x.rest) };
  }));
}

  gPay: function(el){
    var s = studentById(el.dataset.s), g = groupById(el.dataset.g);
    if(!s || !g) return;
    var mk2 = el.dataset.m, P = payStateOf(s, g, mk2);
    if(P.mode==="free"){ toast("الطالب معفي"); return; }
    if(P.mode==="ses"){
      var rest = (P.rows||[]).filter(function(x){ return !duePaid(x); });
      if(!rest.length){
        var pd = (P.rows||[]).filter(function(x){ return duePaid(x); });
        if(!pd.length) return;
        if(!confirm("إلغاء دفع حصة "+fmtD(pd[0].date)+"؟")) return;
        payDel(payOfDue(pd[0].id));
        saveSync(); render(); toast("اتلغت"); return;
      }
      if(!confirm("تسديد "+rest.length+" حصة بإجمالي "+money(P.rest)+"؟")) return;
      rest.forEach(function(x){
        payAdd({ sid:s.id, gid:g.id, amount:x.amount, date:today(),
                 kind:"ses", dueId:x.id, dueDate:x.date });
        x.paid = true; x.paidAt = today();      /* للتوافق مع النسخ القديمة */
      });
      saveSync(); render(); toast("اتسدّد "+money(P.rest));
      return;
    }
    /* شهري */
    var mi = P.mi;
    if(!mi){ toast("لسه ما اشتركش في الشهر ده"); return; }
    var ex = payOfMonth(s.id, g.id, mi);
    if(ex){
      if(!confirm("إلغاء دفعة "+MONTHS[mi-1]+" ("+money(ex.amount)+")؟")) return;
      payDel(ex);
      saveSync(); render(); toast("اتلغت"); return;
    }
    payAdd({ sid:s.id, gid:g.id, amount:g.fee, mi:mi, kind:"month", date:today() });
    saveSync(); render();
    toast("اتسجّل "+money(g.fee)+" — "+MONTHS[mi-1]);
  },

  savePay: function(){
    var sid = $("#modal").dataset.sid;
    var s = studentById(sid);
    if(!s) return;
    var amt = num(val("py_a"), 0);
    if(amt <= 0){ toast("اكتب المبلغ"); return; }
    var list = JSON.parse($("#modal").dataset.dues || "[]");
    /* بنوزّع المبلغ على المستحقات بالترتيب — الأقدم الأول */
    var left = amt, done = 0;
    list.forEach(function(x){
      if(left <= 0) return;
      var rest = num(x.rest);
      if(rest <= 0) return;
      var take = Math.min(left, rest);
      if(x.kind === "ses"){
        var due = (DB.sesDue||[]).filter(function(y){ return y.id===x.id; })[0];
        if(!due) return;
        payAdd({ sid:s.id, gid:x.gid, amount:take, date:today(),
                 kind:"ses", dueId:due.id, dueDate:due.date });
        if(paidForDue(due.id) >= num(due.amount)-0.001){ due.paid=true; due.paidAt=today(); }
      }else{
        payAdd({ sid:s.id, gid:x.gid, amount:take, mi:num(x.mi),
                 kind:"month", date:today() });
      }
      left -= take; done += take;
    });
    saveSync(); closeModal();
    if(UI.sesG) modalSession(UI.sesG, UI.sesD);
    render();
    toast("اتسجّل "+money(done)+(left>0? " · فاضل "+money(left)+" زيادة":""));
  },

/* ============================================================

   ============================================================ */
function moveQ(eid, qid, dir){
  var e = examById(eid); if(!e) return;
  var qs = (e.qs||[]).slice().sort(function(a,b){ return num(a.order,0)-num(b.order,0); });
  var i = qs.findIndex(function(q){ return q.id===qid; });
  var j = i + dir;
  if(i<0 || j<0 || j>=qs.length) return;
  var t = qs[i]; qs[i] = qs[j]; qs[j] = t;
  qs.forEach(function(q,k){ q.order = k; });
  e.qs = qs;
  saveSync(); pushExams(); render();
}
/* رفع الامتحانات للنسخة العامة عشان الطالب يشوفها */
function pushExams(){
  if(!fbOn() || FB.role!=="teacher" || !FB.db) return;
  var byCode = {};
  DB.exams.forEach(function(e){
    if(!isOnlineExam(e)) return;
    var g = groupById(e.gid);
    if(!g || !g.code) return;
    var c = normCode(g.code);
    byCode[c] = byCode[c] || {};
    /* بنرفع الأسئلة من غير الإجابات الصحيحة — الطالب مالوش شغل بيها */
    byCode[c][e.id] = {
      id:e.id, title:e.title, subject:e.subject||"", desc:e.desc||"",
      from:e.from||"", to:e.to||"", mins:num(e.mins,0), tries:num(e.tries,1),
      showMode:e.showMode||"now", status:e.status||"draft", online:1,
      qs:(e.qs||[]).map(function(q){
        return { id:q.id, type:q.type, text:q.text, mark:num(q.mark,1),
                 order:num(q.order,0), opts:q.opts||[] };
      })
    };
  });
  fbSet("pub/exams", byCode).catch(function(){});
}
/* تسجيل إجابة الطالب — بيحفظ فورًا */
function setStuAns(v){
  var e = (GATE.exams||[]).filter(function(x){ return x.id===UI.takeId; })[0];
  var a = UI.attempt;
  if(!e || !a || a.submittedAt) return;
  var qs = (e.qs||[]).slice().sort(function(x,y){ return num(x.order,0)-num(y.order,0); });

/* المدرّس بيسحب محاولات الطلاب */
function pullAttempts(loud){
  if(!fbOn() || FB.role!=="teacher"){ if(loud) toast("مفيش اتصال"); return; }
  var codes = DB.groups.map(function(g){ return normCode(g.code); }).filter(Boolean);
  var got = 0;
  Promise.all(codes.map(function(c){
    return fbGet("attempts/"+c).catch(function(){ return null; });
  })).then(function(all){
    all.forEach(function(byExam){
      if(!byExam) return;
      Object.keys(byExam).forEach(function(exId){
        Object.keys(byExam[exId]||{}).forEach(function(sid){
          var r = byExam[exId][sid];
          if(!r || !r.id) return;
          var cur = DB.attempts.filter(function(x){ return x.id===r.id; })[0];
          if(cur){
            /* بناخد الأحدث بس — عشان ما ندهسش تصحيح المدرّس */
            if(num(r.savedAt,0) > num(cur.savedAt,0) || (r.submittedAt && !cur.submittedAt)){
              cur.answers = r.answers||{}; cur.submittedAt = r.submittedAt||0;
              cur.savedAt = r.savedAt||0; got++;
            }
          }else{
            DB.attempts.push({ id:r.id, examId:exId, sid:sid, tryNo:num(r.tryNo,1),
              startedAt:num(r.startedAt,0), submittedAt:num(r.submittedAt,0),
              savedAt:num(r.savedAt,0), answers:r.answers||{}, marks:{}, notes:{} });
            got++;
          }
        });
      });
    });
    if(got){ DB.attempts.forEach(gradeAttempt); save(); render(); }
    if(loud) toast(got? "وصل "+ar(got)+" تحديث" : "مفيش جديد");
  });
}
/* رفع النتائج للطلاب */
function pushResults(examId){
  if(!fbOn() || FB.role!=="teacher") return;
  var e = examById(examId); if(!e) return;
  var g = groupById(e.gid); if(!g || !g.code) return;
  var out = {};
  attemptsOf(examId).forEach(function(a){
    if(!a.submittedAt) return;
    a = gradeAttempt(a);
    out[a.sid] = { total:a.total, auto:a.auto, manual:a.manual,
                   pending:a.pending||0, at:Date.now() };
  });
  fbSet("results/"+normCode(g.code)+"/"+examId, out).catch(function(){});
}

function gErr(e){
  var m = String((e && e.code) || (e && e.message) || e);
  if(/wrong-password|invalid-cred|invalid-login/.test(m))
    return "كلمة السر غلط — لو دي أول مرة، اكتب اللي عايزها واضغط دخول وهتتحفظ";
  if(/user-not-found/.test(m))       return "مفيش حساب لسه";
  if(/email-already-in-use/.test(m)) return "فيه كلمة سر متسجّلة — اكتبها للدخول";
  if(/requires-recent-login/.test(m))return "سجّل خروج وادخل تاني الأول";
  if(/operation-not-allowed/.test(m))return "فعّل Email/Password من فايربيز الأول";
  if(/weak-password/.test(m))        return "كلمة السر قصيرة — ٦ حروف على الأقل";
  if(/network/.test(m))              return "مفيش اتصال بالنت";
  if(/too-many/.test(m))             return "محاولات كتير — استنى شوية";
  if(/انتهت المهلة/.test(m))
    return "السحابة مش بترد. اتأكد إن النت شغال، أو ادخل من غير إنترنت من الشاشة الأولى.";
  return "حصلت مشكلة: " + m;
}
function gAuth(){
  if(!fbInit()){ GATE.msg="مش قادر أوصل للسحابة — اتأكد من النت"; render(); return; }
  var pw = val("ga_pw");
  var setup = (GATE.claimed===false);
  if(!pw){ GATE.msg="اكتب كلمة السر"; render(); return; }
  if(setup){
    if(pw.length<6){ GATE.msg="كلمة السر قصيرة — ٦ حروف على الأقل"; render(); return; }
    if(pw !== val("ga_pw2")){ GATE.msg="كلمتا السر مش متطابقتين"; render(); return; }
  }
  GATE.busy = true; GATE.msg=""; render();
  /* ============================================================
     فايربيز الجديد بيخفي إن الحساب مش موجود ويرجّع «بيانات غلط»
     زي كلمة السر الغلط بالظبط — عشان محدش يخمّن الحسابات.
     فبنجرّب الدخول الأول، ولو فشل بنجرّب نعمل الحساب. لو طلع
     موجود بالفعل يبقى فعلًا كلمة السر غلط.
     ============================================================ */
  /* المهلة هنا مهمة: من غيرها الزرار يفضل «لحظة…» للأبد لو
     الفايربيز ما ردّش، والمستخدم يفتكر إن البرنامج معلّق. */
  var f = withTimeout(setup
    ? FB.auth.createUserWithEmailAndPassword(TEACHER_EMAIL,pw)
    : FB.auth.signInWithEmailAndPassword(TEACHER_EMAIL,pw).catch(function(e){
        var m = String((e&&e.code)||"");
        if(!/user-not-found|invalid-cred|invalid-login|wrong-password/.test(m)) throw e;
        if(pw.length<6) throw { code:"auth/weak-password" };
        if(!confirm("مفيش كلمة سر متسجّلة لحد دلوقتي.\n\n"+
                    "تحب نحفظ اللي كتبته دلوقتي ككلمة سر البرنامج؟\n"+
                    "لو ده مش قصدك اضغط إلغاء وحاول تاني.")) throw e;
        return FB.auth.createUserWithEmailAndPassword(TEACHER_EMAIL,pw)
          .catch(function(e2){
            var m2 = String((e2&&e2.code)||"");
            /* الحساب موجود فعلًا — يبقى كلمة السر غلط */
            if(/email-already-in-use/.test(m2)) throw e;
            throw e2;
          });
      }), 12000, "تسجيل الدخول");
  f.then(function(c){
    FB.uid = c.user.uid;
    /* أول حساب بيسجّل نفسه كمالك — بعد كده الباب بيتقفل */
    return fbGet("config/teacherUid").then(function(t){
      if(!t) return fbSet("config/teacherUid", FB.uid).then(function(){ return FB.uid; });
      return t;
    });
  }).then(function(t){
    FB.teacherUid = t;
    if(t !== FB.uid){
      GATE.busy=false; GATE.msg="الحساب ده مش مالك البرنامج";
      try{ FB.auth.signOut(); }catch(e){}
      render(); return;
    }
    FB.role = "teacher";
    try{ localStorage.setItem(KEY+"_sess", JSON.stringify({r:"teacher"})); }catch(e){}
    GATE.busy=false;
    render();
    return syncDown().then(function(got){
      if(!got) syncUp();
      UI.tab="home"; UI.sub=null; render();
      toast(got? "أهلًا — البيانات اتحمّلت" : "أهلًا " + (DB.meta.name||""));
    });
  }).catch(function(e){
    var m = String((e&&e.code)||"");
    /* الحساب موجود بس كلمة السر غلط، أو مش موجود ولسه محدش أخد الملكية */
    if(/user-not-found/.test(m) && GATE.claimed!==true){
      GATE.claimed = false; GATE.busy=false;
      GATE.msg = "لسه مفيش كلمة سر — اختار واحدة دلوقتي"; render(); return;
    }
    if(/email-already-in-use/.test(m)){
      GATE.claimed = true; GATE.busy=false;
      GATE.msg = "فيه كلمة سر متسجّلة بالفعل — اكتبها للدخول"; render(); return;
    }
    GATE.busy=false; GATE.msg=gErr(e); render();
  });
}

function gStudentIn(){
  if(!fbInit()){ GATE.msg="مش قادر أوصل للسحابة — اتأكد من النت"; render(); return; }
  var code = normCode(val("ga_code"));
  if(code.length<4){ GATE.msg="اكتب كودك الشخصي (زي S1375)"; render(); return; }
  GATE.busy=true; GATE.msg=""; render();
  FB.auth.signInAnonymously().then(function(c){
    FB.uid = c.user.uid;
    return fbGet("pub/students/"+code);
  }).then(function(me){
    if(!me || !me.g){
      GATE.busy=false;
      GATE.msg="الكود ده مش موجود — اتأكد منه من كارتك أو اسأل المدرّس";
      render(); return;
    }
    GATE.myCode = code; GATE.sid = me.sid; GATE.myName = me.n || "";
    GATE.code = me.g;                       /* كود مجموعته — للاستخدام الداخلي */
    return Promise.all([ fbGet("pub/groups/"+me.g), fbGet("pub/teacher") ]).then(function(r){
      var g = r[0];
      if(!g){ GATE.busy=false; GATE.msg="مجموعتك مش متاحة دلوقتي"; render(); return; }
      if(g.status==="off"){ GATE.busy=false; GATE.msg="مجموعتك متوقفة حاليًا"; render(); return; }
      GATE.grp = g; GATE.teacher = r[1]||{};
      FB.role = "student"; GATE.busy=false;
      try{ localStorage.setItem(KEY+"_sess",
        JSON.stringify({ r:"student", my:code, c:me.g, s:me.sid, n:me.n })); }catch(e){}
      render();
      return Promise.all([gLoadNotices(), gLoadExams()]).then(function(){ render(); });
    });
  }).catch(function(e){
    GATE.busy=false; GATE.msg=gErr(e); render();
  });
}
function gLoadNotices(){
  if(!fbOn() || !GATE.code) return Promise.resolve();
  return fbGet("pub/notices").then(function(all){
    all = all || {};
    var out = [];
    Object.keys(all).forEach(function(k){
      var m = all[k]; if(!m || !m.text) return;
      if(m.to==="all"){ out.push({ text:m.text, at:m.at, date:m.date, to:"all" }); return; }
      if(m.code && normCode(m.code)===GATE.code){
        if(m.sid){ if(GATE.sid && m.sid===GATE.sid) out.push({ text:m.text, at:m.at, date:m.date, to:"me" }); }
        else out.push({ text:m.text, at:m.at, date:m.date, to:"grp" });
      }
    });
    GATE.notices = out;
  }).catch(function(){ GATE.notices = []; });
}

function pushNotices(){
  if(!fbOn() || FB.role!=="teacher" || !FB.db) return;

                  sid: m.sid||"" };
  });
  fbSet("pub/notices", out).catch(function(){});
}

function pullBookings(loud){
  if(!fbOn() || FB.role!=="teacher"){ if(loud) toast("مفيش اتصال"); return; }
  fbGet("bookings").then(function(all){
    all = all || {};
    DB.bookings = DB.bookings || [];
    var have = {}; DB.bookings.forEach(function(b){ have[b.id]=b; });
    var add = 0;
    Object.keys(all).forEach(function(k){
      var b = all[k]; if(!b || !b.name) return;
      if(have[k]) return;
      DB.bookings.push({ id:k, name:b.name, grade:b.grade||"", phone:b.phone||"",
        addr:b.addr||"", note:b.note||"", date:b.date||"", at:b.at||0, status:b.status||"new" });
      add++;
    });
    if(add){ save(); render(); }
    if(loud) toast(add? "وصل "+ar(add)+" طلب جديد" : "مفيش طلبات جديدة");
  }).catch(function(){ if(loud) toast("مقدرتش أوصل للسحابة"); });
}

/* استرجاع الجلسة */
function restoreSession(){
  /* جلسة محلية محفوظة؟ ندخل على طول من غير ما نستنى السحابة */
  var s0 = null;
  try{ s0 = JSON.parse(localStorage.getItem(KEY+"_sess")||"null"); }catch(e){}
  if(s0 && s0.r==="local"){
    FB.role = "teacher";
    render();
    fbInit();                    /* نجهّز السحابة في الخلفية لو حب يربط */
    return;
  }
  if(!fbInit()) { render(); return; }
  var sess = null;
  try{ sess = JSON.parse(localStorage.getItem(KEY+"_sess")||"null"); }catch(e){}
  /* لو الفايربيز ما ردّش خلال ٦ ثواني، نعرض البوابة عادي */
  var settled = false;
  setTimeout(function(){
    if(!settled && !FB.role){ settled = true; render(); }
  }, 6000);
  FB.auth.onAuthStateChanged(function(u){
    settled = true;
    if(!u){ if(FB.role) { FB.role=null; render(); } return; }
    FB.uid = u.uid;
    if(sess && sess.r==="student" && sess.c){
      GATE.code = sess.c; GATE.sid = sess.s||"";
      GATE.myCode = sess.my||""; GATE.myName = sess.n||"";
      Promise.all([ fbGet("pub/groups/"+sess.c), fbGet("pub/teacher") ]).then(function(r){
        if(!r[0]) return;
        GATE.grp = r[0]; GATE.teacher = r[1]||{}; FB.role="student";
        gLoadNotices().then(render);
      }).catch(function(){});
      return;
    }
    if(u.isAnonymous) return;
    fbGet("config/teacherUid").then(function(t){
      FB.teacherUid = t;
      if(t && t===u.uid){
        FB.role = "teacher";
        syncDown().then(function(){ pullBookings(false); render(); });
      }
    }).catch(function(){});
  });
  render();
}

document.addEventListener("input", function(e){
  var el = e.target;
  if(el.id==="imp_t"){ UI.impText = el.value; return; }
  /* إجابة نصية أو مقالية — بتتحفظ مع الكتابة */
  if(el.dataset && el.dataset.act==="stuAnsBox"){
    var e2 = (GATE.exams||[]).filter(function(x){ return x.id===UI.takeId; })[0];
    var a2 = UI.attempt;
    if(!e2 || !a2 || a2.submittedAt) return;
    var qs2 = (e2.qs||[]).slice().sort(function(x,y){ return num(x.order,0)-num(y.order,0); });
    var q2 = qs2[UI.qi||0];
    if(!q2) return;
    a2.answers = a2.answers || {};
    a2.answers[q2.id] = el.value;
    a2.savedAt = Date.now();
    clearTimeout(window._ansT);
    window._ansT = setTimeout(function(){ saveStuAttempt(a2); }, 500);
    return;
  }
  if(!el.dataset || el.dataset.act!=="setQ") return;
  UI.q = el.value;
  clearTimeout(window._q);
  window._q = setTimeout(function(){
    var pos = el.selectionStart; render();
    var again = document.querySelector('[data-act="setQ"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(x){} }
  }, 200);
});
document.addEventListener("change", function(e){
  var el = e.target;
  if(el.dataset && el.dataset.act==="setDate"){ UI.date = el.value; render(); }
  if(el.dataset && el.dataset.act==="scanG"){ UI.scanG = el.value; }
  /* المدرّس بيرصد درجة سؤال يدوي */
  if(el.dataset && (el.dataset.act==="setQMark" || el.dataset.act==="setQNote")){
    var at = attemptById(el.dataset.a);
    if(!at) return;
    if(el.dataset.act==="setQMark"){
      at.marks = at.marks || {};
      var v2 = String(el.value).trim();
      if(v2==="") delete at.marks[el.dataset.q];
      else at.marks[el.dataset.q] = Math.max(0, num(v2,0));
    }else{
      at.notes = at.notes || {};
      at.notes[el.dataset.q] = el.value;
    }
    gradeAttempt(at);
    saveSync(); pushResults(at.examId); render();
  }
  /* نوع السؤال بيغيّر الحقول الظاهرة */
  /* حقول الإعفاء تظهر مع اختيار «معفي» */
  if(el.id==="ses_q"){
    UI.sesQ = el.value;
    if(UI.sesG){
      $("#modal").innerHTML = sesModalHTML(UI.sesG, UI.sesD);
      var q = document.getElementById("ses_q");
      if(q){ q.focus(); try{ q.setSelectionRange(q.value.length,q.value.length); }catch(e){} }
    }
    return;
  }
  if(el.id==="s_pay"){
    var box = document.getElementById("s_exBox");
    if(box) box.style.display = (el.value==="free") ? "block" : "none";
  }
  if(el.id==="q_ty"){
    ["mcq","tf","text","essay"].forEach(function(t){
      var box = document.getElementById("q_"+t);
      if(box) box.style.display = (el.value===t) ? "block" : "none";
    });
    var gr = document.getElementById("q_gr");
    if(gr && el.value==="essay"){ gr.value="manual"; gr.disabled=true; }
    else if(gr){ gr.disabled=false; }
  }
  /* إجابة الطالب: اختيار من متعدد */
  if(el.dataset && el.dataset.act==="stuAns"){ setStuAns(el.value); }
  /* رصد درجة امتحان */
  if(el.dataset && el.dataset.act==="setMark"){
    var ex = examById(el.dataset.e);
    if(!ex) return;
    ex.marks = ex.marks || {};
    var v = String(el.value).trim();
    if(v==="") delete ex.marks[el.dataset.s];
    else{
      var x = num(v,0);
      if(x > num(ex.max,100)){ toast("الدرجة أكبر من النهاية العظمى ("+ar(ex.max)+")"); x = num(ex.max,100); }
      if(x < 0) x = 0;
      ex.marks[el.dataset.s] = x;
    }
    saveSync(); render();
  }
});

   دخول وهو داخل.
   ============================================================ */
setInterval(function(){
  if(FB.role!=="teacher" && FB.role!=="student") return;
  if(UI.locked) return;
  var v = document.getElementById("view");
  if(!v) return;
  /* البوابة ظاهرة؟ (أزرارها موجودة) */
  if(v.querySelector('[data-act="gTeach"]') || v.querySelector('[data-act="gLocal"]')){
    render();
  }
}, 1500);

setInterval(function(){
  if(!UI.take || !UI.attempt) return;
  var e = (GATE.exams||[]).filter(function(x){ return x.id===UI.takeId; })[0];
  if(!e) return;
  var left = attemptLeftStu(UI.attempt, e);
  if(left<=0 && !UI.attempt.submittedAt){
    submitAttempt();
    toast("انتهى الوقت — اتسلّم الامتحان تلقائيًا");
    return;
  }
  if(num(e.mins,0) && left<=60) render();
}, 1000);

load();
/* لو القفل شغّال، البرنامج يفتح مقفول */
if(DB.lock && DB.lock.on && DB.lock.pin) UI.locked = true;
restoreSession();
</script>
</body>
</html>
