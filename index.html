<title>دروسي — إدارة الدروس الخصوصية</title>

<meta name="theme-color" content="#014A59">

<meta name="description" content="إدارة الدروس الخصوصية — المجموعات والحضور والتحصيل">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23014A59'/%3E%3Cg stroke='%23ffffff' stroke-opacity='.18' stroke-width='2'%3E%3Cpath d='M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512'/%3E%3C/g%3E%3Ctext x='256' y='350' font-family='Georgia,serif' font-size='260' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   هوية بصرية لمدرّس رياضيات: ورق المربعات والمخططات الهندسية.
   خلفية بشبكة خفيفة زي كراسة الرسم البياني، وحبر أزرق عميق،
   ولون واحد للفلوس. الشبكة هي التوقيع البصري — بتظهر في كل
   خلفية وبتدي إحساس الدقة والحساب.
   ============================================================ */
:root{
  /* الباليتة مستخرجة من صور التطبيق نفسه:
     #014A59 غامق · #0E877E فاتح · برتقالي للأزرار المهمة */
  --paper:#F6F7F5; --card:#FFFFFF; --ink:#014A59; --line:#DCE6E4; --line2:#EDF2F1;
  --mut:#6A7F80; --grid:#E2ECEA;
  --seal:#0E877E; --seal-l:#E3F3F1;        /* الأخضر المزرق */
  --ok:#0E877E; --ok-l:#E3F3F1;
  --warn:#E8930C; --warn-l:#FDF3E3;        /* البرتقالي */
  --bad:#D2504A; --bad-l:#FBECEB;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/26px 26px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/26px 26px,
    var(--paper);
  color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%}
h1,h2,h3,.dsp{font-family:Cairo,system-ui,sans-serif;font-weight:800;margin:0;line-height:1.3}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

/* ---------- الهيكل ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
     padding:11px 14px;display:flex;align-items:center;gap:9px;
     background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
     background-size:22px 22px}
.top .logo{width:34px;height:34px;border-radius:10px;background:var(--seal);
     display:grid;place-items:center;font-family:Cairo;font-weight:900;font-size:17px;flex:0 0 34px}
.top h1{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{display:block;font-size:11px;font-weight:400;color:#9FB0C7;font-family:Tajawal}
.wrap{max-width:980px;margin:0 auto;padding:14px 12px 92px}

.nav{position:fixed;bottom:0;right:0;left:0;z-index:40;background:var(--card);
     border-top:1px solid var(--line);display:flex;padding:6px 4px
     calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:0;border:0;padding:7px 2px;border-radius:10px;cursor:pointer;
     display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);
     font:inherit;font-size:11px;font-weight:700}
.nav button .i{font-size:18px;line-height:1}
.nav button.on{color:var(--seal);background:var(--seal-l)}

/* ---------- البطاقات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      margin-bottom:12px;overflow:hidden}
.card>.hd{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;
          align-items:center;gap:9px;flex-wrap:wrap}
.card>.hd h3{font-size:15.5px;flex:1;min-width:0}
.card>.bd{padding:14px}
.card>.bd.flush{padding:0}
.eyebrow{font-size:10.5px;letter-spacing:.13em;color:var(--seal);font-weight:800;
         font-family:Cairo,sans-serif}

/* ---------- الأزرار ---------- */
button,select,input,textarea{font:inherit}
.btn{background:var(--seal);color:#fff;border:0;border-radius:11px;padding:12px 16px;
     font-family:Cairo,sans-serif;font-weight:800;font-size:14.5px;cursor:pointer;transition:.14s filter}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper);filter:none}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- الحقول ---------- */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],
input[type=email],input[type=password],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--seal);outline-offset:-1px;border-color:var(--seal)}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}

/* ---------- الإحصائيات ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
      position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--line)}
.stat.money::after{background:var(--ok)} .stat.late::after{background:var(--bad)}
.stat.acc::after{background:var(--seal)} .stat.warn::after{background:var(--warn)}
.stat .k{font-size:11.5px;color:var(--mut);font-weight:600}
.stat .v{font-family:Cairo,sans-serif;font-weight:900;font-size:25px;margin-top:2px;line-height:1.1}
.stat .s{font-size:11.5px;color:var(--mut)}
.stat.money .v{color:var(--ok)} .stat.late .v{color:var(--bad)}

/* ---------- القوائم ---------- */
.item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line2);
      background:0;border-left:0;border-right:0;border-top:0;width:100%;text-align:right;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--paper)}
.av{width:38px;height:38px;border-radius:11px;background:var(--seal-l);color:var(--seal);
    display:grid;place-items:center;font-family:Cairo;font-weight:900;font-size:14px;flex:0 0 38px}
.av.w{background:var(--warn-l);color:var(--warn)}
.av.b{background:var(--bad-l);color:var(--bad)}
.av.g{background:var(--ok-l);color:var(--ok)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:#B9C4D4;font-size:19px;flex:0 0 auto}

/* ---------- الوسوم ---------- */
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--paper);
     color:var(--mut);font-weight:700;flex:0 0 auto;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.bad{background:var(--bad-l);color:var(--bad)}
.tag.code{background:var(--ink);color:#fff;letter-spacing:.06em;direction:ltr;font-family:Cairo,sans-serif}

/* شريط الشهور */
.months{display:flex;gap:3px;flex-wrap:wrap}
.mo{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line);
    background:var(--card);display:grid;place-items:center;font-size:9px;
    font-weight:800;color:#B9C4D4;font-family:Cairo,sans-serif;cursor:pointer;padding:0}
.mo.paid{background:var(--ok);border-color:var(--ok);color:#fff}
.mo.due{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.mo.next{border-style:dashed}
.mo:focus-visible{outline:2px solid var(--warn);outline-offset:1px}

/* أزرار الحضور السريعة */
.att{display:flex;gap:5px;flex:0 0 auto}
.att button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--card);cursor:pointer;font-size:14px;font-weight:800;color:var(--mut);padding:0}
.att button.on.p{background:var(--ok);border-color:var(--ok);color:#fff}
.att button.on.a{background:var(--bad);border-color:var(--bad);color:#fff}
.att button.on.l{background:var(--warn);border-color:var(--warn);color:#fff}

/* ---------- الشرائح ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
      background:var(--card);font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button small{margin-inline-start:5px;padding:1px 6px;border-radius:999px;
      background:var(--line2);color:var(--mut);font-size:10.5px;font-weight:800}
.chips button.on small{background:rgba(255,255,255,.2);color:#fff}

/* ---------- متفرقات ---------- */
.note{background:var(--paper);border:1px solid var(--line);border-radius:11px;
      padding:11px 13px;font-size:13px;color:var(--mut);line-height:1.65}
.note b{color:var(--ink)}
.note.ok{background:var(--ok-l);border-color:#BFE6D3;color:#0A6B3D}
.note.warn{background:var(--warn-l);border-color:#EBDCB0;color:#8A6200}
.note.bad{background:var(--bad-l);border-color:#EFC9C9;color:#932B2B}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .big{font-size:36px;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-family:Cairo,sans-serif;font-size:15.5px;margin-bottom:4px}
.sep{height:1px;background:var(--line2);margin:11px 0}
.hide{display:none!important}
.center{text-align:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right}
th{background:var(--paper);font-weight:800;font-size:12px;color:var(--mut);font-family:Cairo,sans-serif}
.tw{overflow-x:auto}

/* ---------- النوافذ ---------- */
.mask{position:fixed;inset:0;background:rgba(14,26,43,.5);z-index:60;display:none;
      align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.modal{background:var(--card);width:100%;max-width:580px;border-radius:18px 18px 0 0;
       max-height:92dvh;display:flex;flex-direction:column}
@media(min-width:600px){ .mask{align-items:center;padding:16px} .modal{border-radius:18px;max-height:88dvh} }
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.modal .mh h3{flex:1;font-size:16px}
.modal .mb{padding:16px;overflow:auto;flex:1}
.modal .mf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));
           border-top:1px solid var(--line2);display:flex;gap:8px}
.modal .mf .btn{flex:1}
.x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);
   cursor:pointer;font-size:16px;color:var(--mut);flex:0 0 32px}

.toast{position:fixed;bottom:78px;right:50%;transform:translateX(50%);z-index:70;
       background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;font-size:13.5px;
       font-weight:600;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center}
.toast.on{opacity:1;bottom:88px}

/* زرار الإضافة العائم — برتقالي زي المرجع */
.fab{position:fixed;inset-inline-start:16px;bottom:calc(78px + env(safe-area-inset-bottom));
     z-index:35;width:56px;height:56px;border-radius:18px;border:0;background:var(--warn);
     color:#fff;font-size:26px;font-weight:300;cursor:pointer;line-height:1;
     box-shadow:0 6px 18px rgba(232,147,12,.35)}
.fab:hover{filter:brightness(1.06)}
.fab:active{transform:translateY(1px)}

/* ---------- البوابة ---------- */
.gate{min-height:calc(100dvh - 120px);display:flex;align-items:flex-start;justify-content:center}
.gwrap{width:100%;max-width:400px}
.glogo{width:64px;height:64px;border-radius:19px;background:var(--seal);color:#fff;
       display:grid;place-items:center;margin:0 auto;font-family:Cairo,sans-serif;
       font-weight:900;font-size:27px}

@media print{
  .top,.nav,.noprint,.chips{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .card{border-color:#999;break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="logo">π</div>
  <h1 id="hTitle">دروسي<small id="hSub">إدارة الدروس الخصوصية</small></h1>
  <button class="x hide" id="instBtn" data-act="install" title="ثبّت التطبيق" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">⤓</button>
  <button class="x" data-act="cloud" title="السحابة" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">☁</button><button class="x" data-act="settings" title="الإعدادات" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">⚙</button>
</header>

<div class="wrap"><div id="view"></div></div>

<nav class="nav" id="nav"></nav>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* ============================================================
   ربط السحابة (Firebase)
   المفاتيح دي مش سرّية — دي معرّفات المشروع وFirebase مصمّم
   إنها تكون ظاهرة. اللي بيحمي البيانات فعلًا هو قواعد الأمان
   (Rules) اللي على السيرفر.
   ============================================================ */
var FB_CONFIG = {
  apiKey: "AIzaSyD7kiRnLqvVv5HSsUR7PU3Q4sg-lmkkf3M",
  authDomain: "drosy-814e5.firebaseapp.com",
  databaseURL: "https://drosy-814e5-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "drosy-814e5",
  storageBucket: "drosy-814e5.firebasestorage.app",
  messagingSenderId: "631524642114",
  appId: "1:631524642114:web:1087bd6a5aeb98e8e88cdb"
};
var FB = { app:null, auth:null, db:null, ready:false, uid:null, role:null, teacherUid:null, err:"" };
/* ============================================================
   دخول المدرّس بكلمة سر بس.
   فايربيز محتاج «هوية» عشان الحماية تشتغل، فبنستخدم بريد داخلي
   ثابت المستخدم مايشوفهوش ولا يكتبه — هو بيكتب كلمة السر بس.
   كلمة السر نفسها مش في الكود: بتتحفظ مشفّرة على سيرفر جوجل،
   عشان الكود منشور على GitHub وأي حد يقدر يقراه.
   ============================================================ */
var TEACHER_EMAIL = "teacher@drosy.app";

function fbInit(){
  if(FB.ready || typeof firebase==="undefined") return FB.ready;
  try{
    FB.app  = firebase.initializeApp(FB_CONFIG);
    FB.auth = firebase.auth();
    FB.db   = firebase.database();
    FB.ready = true;
  }catch(e){ FB.err = e.message; }
  return FB.ready;
}
function fbOn(){ return FB.ready && navigator.onLine!==false; }
/* قراءة مرة واحدة */
function fbGet(path){
  return new Promise(function(res, rej){
    if(!fbOn()) return rej(new Error("مفيش اتصال"));
    FB.db.ref(path).once("value").then(function(sn){ res(sn.val()); }).catch(rej);
  });
}
function fbSet(path, val){
  if(!fbOn()) return Promise.reject(new Error("مفيش اتصال"));
  return FB.db.ref(path).set(val);
}
function fbPush(path, val){
  if(!fbOn()) return Promise.reject(new Error("مفيش اتصال"));
  return FB.db.ref(path).push(val);
}

/* ============================================================
   البيانات
   كل حاجة في مكان واحد، والحضور مربوط بالفلوس مباشرة:
   تسجّل حضور الحصة → التحصيل بيتحدّث لوحده.
   ============================================================ */
var APP_VER = "2.2";
var KEY = "dorosy_v1";
var DB = null;

function blank(){
  return {
    meta:{ name:"علاء رجب", subject:"الرياضيات", phone:"01121056554",
           year:yearNow(), startMonth:9,
           about:"مدرس رياضيات لجميع المراحل — ابتدائي · إعدادي · ثانوي",
           waAbsent:"", waMark:"", waDue:"" },
    groups:[], students:[], sessions:{}, pays:[],
    bookings:[], notices:[], sesDue:[],
    years:[],       /* السنوات الدراسية */
    lock:{ on:false, pin:"", bio:false },   /* قفل البرنامج */
    res:[],         /* موارد المجموعات — روابط وملفات */
    curYear:"",
    /* الوحدات الجديدة */
    families:[],      /* الأسر — ربط الإخوة ودفعة واحدة */
    exams:[],         /* الامتحانات ودرجاتها */
    tasks:[],         /* الواجبات والتسميع والشيتات */
    books:[],         /* المذكرات والكتب ومبيعاتها */
    sales:[],         /* عمليات بيع المذكرات */
    reminders:[],     /* التذكيرات */
    seq:1
  };
}
function yearNow(){
  var d = new Date(), y = d.getFullYear();
  /* السنة الدراسية بتبدأ سبتمبر */
  return (d.getMonth()+1 >= 9) ? y+"/"+(y+1) : (y-1)+"/"+y;
}
function load(){
  try{ var r = localStorage.getItem(KEY); DB = r ? JSON.parse(r) : blank(); }
  catch(e){ DB = blank(); }
  if(!DB.meta) DB = blank();
  ["groups","students","pays","bookings","notices",
   "families","exams","tasks","books","sales","reminders","sesDue",
   "years","res"].forEach(function(k){
    if(!Array.isArray(DB[k])) DB[k] = []; });
  if(!DB.sessions) DB.sessions = {};
  if(!DB.seq) DB.seq = 1;
  ensureCodes();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast("مساحة التخزين ممتلئة"); } }
function uid(p){ return (p||"i") + (DB.seq++) + Math.random().toString(36).slice(2,6); }

/* ============================================================
   كود المجموعة — حرفين ورقمين (مثال: MA01)
   ده المفتاح الثابت للمجموعة. أي بيانات ترفعها بعد كده بتترحّل
   عليه، فحتى لو غيّرت اسم المجموعة الربط مبيضيعش.
   ============================================================ */
var CODE_L = "ABCDEFGHJKLMNPQRSTUVWXYZ";   /* من غير I و O عشان مايتلخبطوش بـ 1 و 0 */
function codeTaken(c){
  c = String(c||"").toUpperCase();
  for(var i=0;i<DB.groups.length;i++) if(String(DB.groups[i].code||"").toUpperCase()===c) return true;
  return false;
}
function genGroupCode(seed){
  /* بنحاول نطلّع حرفين من اسم المادة عشان الكود يبقى له معنى */
  var base = String(seed||"").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,2);
  if(base.length<2) base = "";
  for(var tries=0; tries<400; tries++){
    var L = base || (CODE_L[Math.floor(Math.random()*CODE_L.length)] +
                     CODE_L[Math.floor(Math.random()*CODE_L.length)]);
    var d = String(Math.floor(Math.random()*90)+10);
    var c = L + d;
    if(!codeTaken(c)) return c;
    base = "";                                  /* لو الحروف متكررة نرجع للعشوائي */
  }
  return "G" + (DB.seq++);
}
function normCode(c){ return String(c==null?"":c).replace(/\s/g,"").toUpperCase(); }
function groupByCode(c){
  var k = normCode(c);
  if(!k) return null;
  for(var i=0;i<DB.groups.length;i++) if(normCode(DB.groups[i].code)===k) return DB.groups[i];
  return null;
}
function groupByName(nm){
  var k = normAr(nm);
  if(!k) return null;
  for(var i=0;i<DB.groups.length;i++) if(normAr(DB.groups[i].name)===k) return DB.groups[i];
  return null;
}
/* أي مجموعة قديمة من غير كود بتاخد واحد */
function ensureCodes(){
  var ch = 0;
  DB.groups.forEach(function(g){
    if(!g.code){ g.code = genGroupCode(g.subject || g.name); ch++; }
  });
  if(ch) save();
  return ch;
}

/* ============================================================
   المزامنة
   • بيانات المدرّس كلها بتتحفظ في /private (هو بس اللي يقراها)
   • النسخة العامة في /pub: مواعيد المجموعات وأسماء الطلاب
     والتعليمات — عشان الطالب يشوفها بكود مجموعته
   ============================================================ */
var SYNC = { on:false, at:0, busy:false };

function pubSnapshot(){
  var groups = {};
  DB.groups.forEach(function(g){
    if(!g.code) return;
    var studs = {};
    groupStudents(g.id).forEach(function(s){ studs[s.id] = { n: s.name }; });
    groups[normCode(g.code)] = {
      name: g.name||"", grade: g.grade||"", subject: g.subject||"",
      days: g.days||[], time: g.time||"", place: g.place||"",
      fee: num(g.fee), status: g.status||"on", students: studs
    };
  });
  return {
    teacher: { name: DB.meta.name||"", subject: DB.meta.subject||"",
               phone: DB.meta.phone||"", about: DB.meta.about||"",
               year: DB.meta.year||"" },
    groups: groups,
    at: Date.now()
  };
}
function syncUp(){
  if(!fbOn() || FB.role!=="teacher") return Promise.resolve(false);
  SYNC.busy = true;
  return Promise.all([
    fbSet("private/db", DB),
    fbSet("pub/teacher", pubSnapshot().teacher),
    fbSet("pub/groups", pubSnapshot().groups)
  ]).then(function(){
    SYNC.busy=false; SYNC.on=true; SYNC.at=Date.now();
    try{ localStorage.setItem(KEY+"_syncAt", String(SYNC.at)); }catch(e){}
    return true;
  }).catch(function(e){ SYNC.busy=false; FB.err=e.message; return false; });
}
function syncDown(){
  if(!fbOn() || FB.role!=="teacher") return Promise.resolve(false);
  return fbGet("private/db").then(function(v){
    if(!v || !v.meta) return false;
    DB = v;
    ["groups","students","pays"].forEach(function(k){ if(!Array.isArray(DB[k])) DB[k]=[]; });
    if(!DB.sessions) DB.sessions = {};
    ensureCodes(); save(); return true;
  }).catch(function(){ return false; });
}
/* بيتنادى بعد أي تعديل — بيحفظ محليًا ويرفع للسحابة */
function saveSync(){
  save();
  if(fbOn() && FB.role==="teacher"){
    clearTimeout(window._sy);
    window._sy = setTimeout(function(){
      try{ syncUp(); }catch(e){}
    }, 900);
  }
}

/* ============================================================
   كود الطالب و QR
   كل طالب له كود ثابت. بيتحوّل QR يطبعه الطالب أو يحطه في تليفونه،
   والمدرّس بيمسحه بالكاميرا فالحضور يتسجّل في ثانية.
   الـQR بيتولّد هنا بالكامل — من غير مكتبات خارجية عشان يشتغل
   من غير نت.
   ============================================================ */
function genStuCode(){

    var c = "S" + String(Math.floor(Math.random()*9000)+1000);

}

/* ============================================================
   مولّد QR
   حاولت أكتبه من الأول وقارنت المصفوفة بمولّد مرجعي، فطلعت
   مختلفة — يعني الماسح مكانش هيقراه. مولّد QR صحيح محتاج تنفيذ
   دقيق للمواصفة، فبنستخدم مكتبة مجرّبة بدل ما نخاطر بأكواد
   مايقراهاش الماسح.
   المكتبة بتتحمّل مرة وتتخزّن، ولو مفيش نت بنعرض الكود كنص كبير
   يتكتب بالإيد — أحسن من QR غلط.
   ============================================================ */
var QR_LIB = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
var qrReady = null;
function loadQR(){
  if(window.qrcode) return Promise.resolve(true);
  if(qrReady) return qrReady;
  qrReady = new Promise(function(res){
    var sc = document.createElement("script");
    sc.src = QR_LIB;
    sc.onload  = function(){ res(!!window.qrcode); };
    sc.onerror = function(){ res(false); };
    document.head.appendChild(sc);
  });
  return qrReady;
}
/* بيرجّع SVG أو null لو المكتبة مش متاحة */
function qrSVG(text, px){
  if(!window.qrcode) return null;
  try{
    var q = window.qrcode(0, "M");      /* النسخة تلقائية · تصحيح M */
    q.addData(String(text));
    q.make();
    var n = q.getModuleCount(), pad = 2, S = n + pad*2, rects = "";
    for(var r=0;r<n;r++) for(var c=0;c<n;c++)
      if(q.isDark(r,c)) rects += '<rect x="'+(c+pad)+'" y="'+(r+pad)+'" width="1" height="1"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+S+' '+S+'" '+
      'width="'+(px||160)+'" height="'+(px||160)+'" shape-rendering="crispEdges">'+
      '<rect width="'+S+'" height="'+S+'" fill="#fff"/>'+
      '<g fill="#0E1A2B">'+rects+'</g></svg>';
  }catch(e){ return null; }
}
/* بديل واضح لما المكتبة مش متاحة */
function codeBox(code){
  return '<div style="border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center">'+
    '<div class="mut" style="font-size:11.5px">كود الطالب</div>'+
    '<div style="font-family:Cairo,sans-serif;font-weight:900;font-size:30px;'+
    'letter-spacing:.18em;direction:ltr;margin-top:4px">'+esc(code)+'</div></div>';
}

function honorBoard(){
  return activeStudents().map(function(s){
    var lv = studentLevel(s.id), a = attStats(s.id,null), t = taskRate(s.id);
    var parts = [], w = 0;
    if(lv){ parts.push(lv.avg*0.5); w += 0.5; }
    if(a.tot){ parts.push(a.rate*0.3); w += 0.3; }
    if(t.tot){ parts.push(t.pct*0.2); w += 0.2; }
    var score = w ? Math.round(parts.reduce(function(x,y){ return x+y; },0)/w) : null;
    return { s:s, score:score, lv:lv, a:a, t:t };
  }).filter(function(x){ return x.score!==null; })
    .sort(function(a,b){ return b.score-a.score; });
}

/* ============================================================

function waNum(p){

  return "20"+d;
}
function waLink(phone, text){

/* ============================================================
   الامتحانات والدرجات
   ============================================================ */
function examById(id){ for(var i=0;i<DB.exams.length;i++) if(DB.exams[i].id===id) return DB.exams[i]; return null; }
function examStats(e){
  var g = groupById(e.gid);
  var st = g ? groupStudents(g.id) : [];
  var vals = [];
  st.forEach(function(s){
    var v = (e.marks||{})[s.id];
    if(v!==undefined && v!==null && v!=="") vals.push(num(v));
  });
  if(!vals.length) return { n:0, total:st.length, avg:null, max:null, min:null, pass:0, fail:0 };
  var sum = vals.reduce(function(a,b){ return a+b; },0);
  var pass = vals.filter(function(v){ return v >= num(e.max,100)/2; }).length;
  return { n:vals.length, total:st.length,
           avg: Math.round(sum/vals.length*10)/10,
           max: Math.max.apply(null,vals), min: Math.min.apply(null,vals),
           pass:pass, fail:vals.length-pass };
}
/* مستوى الطالب عبر كل امتحاناته */
function studentExams(sid){
  var out = [];
  DB.exams.forEach(function(e){
    var v = (e.marks||{})[sid];
    if(v===undefined || v===null || v==="") return;
    out.push({ e:e, mark:num(v), max:num(e.max,100),
               pct: Math.round(num(v)/Math.max(num(e.max,100),1)*100) });
  });
  return out.sort(function(a,b){ return String(a.e.date).localeCompare(String(b.e.date)); });
}
function studentLevel(sid){
  var ex = studentExams(sid);
  if(!ex.length) return null;
  var avg = Math.round(ex.reduce(function(a,x){ return a+x.pct; },0)/ex.length);
  var trend = null;
  if(ex.length>=2) trend = ex[ex.length-1].pct - ex[ex.length-2].pct;
  return { avg:avg, n:ex.length, trend:trend, last:ex[ex.length-1] };
}

  var tot=0, done=0;
  DB.tasks.forEach(function(t){
    var st = groupStudents(t.gid);
    if(!st.some(function(x){ return x.id===sid; })) return;
    tot++; if((t.done||{})[sid]) done++;
  });
  return { tot:tot, done:done, pct: tot? Math.round(done/tot*100):100 };
}

function payOf(sid, gid, mi){

/* الشهور اللي المفروض الطالب دفعها لحد النهاردة في المجموعة دي */
function dueMonths(s, g){
  if(!g) return [];
  var now = new Date(), curM = now.getMonth()+1;
  var months = schoolMonths();
  var joinM = s.joinMonth ? num(s.joinMonth) : months[0];
  var out = [], started = false;
  for(var i=0;i<months.length;i++){
    if(months[i]===joinM) started = true;
    if(!started) continue;
    out.push(months[i]);
    if(months[i]===curM) break;                  /* لحد الشهر الحالي */
  }
  return out;
}
function studentDue(s){
  var due = 0, paid = 0;
  studentGroups(s).forEach(function(g){
    /* المجموعات اللي بالحصة بتتحسب من سجل الحصص مش بالشهور */
    if(g.mode==="ses") return;
    dueMonths(s,g).forEach(function(mi){
      due += num(g.fee);
      if(isPaid(s.id,g.id,mi)) paid += num(g.fee);
    });
  });
  var sd = sesDueOf(s.id);
  due += sd.due; paid += sd.paid;
  return { due:due, paid:paid, rest: Math.max(0, due-paid) };
}
function lateStudents(){
  return activeStudents().filter(function(s){ return studentDue(s).rest > 0; })
    .sort(function(a,b){ return studentDue(b).rest - studentDue(a).rest; });
}
function monthIncome(mi){
  var t = 0;
  DB.pays.forEach(function(p){ if(p.mi===mi) t += num(p.amount); });
  return t;
}
function totalIncome(){ var t=0; DB.pays.forEach(function(p){ t+=num(p.amount); }); return t; }

/* ============================================================
   الحصص والحضور
   مفتاح الحصة: «المجموعة|التاريخ» — مصدر واحد للحقيقة.
   ============================================================ */
function sesKey(gid, d){ return gid+"|"+d; }
/* ============================================================
   حالة الحصة
   الحصة عندها ٣ حالات: لسه · جارية · خلصت.
   «بدء الحصة» بيفتح الرصد، و«إنهاء الحصة» بيقفله ويحسب المستحق
   للمجموعات اللي بتتحصّل بالحصة.
   ============================================================ */
function sesState(gid, d){
  var o = DB.sessions[sesKey(gid,d)];
  if(!o) return "none";
  if(o.ended) return "done";
  if(o.started) return "live";
  var n2 = 0; for(var k in (o.att||{})) n2++;
  return n2 ? "live" : "none";
}
function startSes(gid, d){
  var k = sesKey(gid,d);
  if(!DB.sessions[k]) DB.sessions[k] = { att:{}, at:Date.now() };
  DB.sessions[k].started = Date.now();
  delete DB.sessions[k].ended;
  saveSync();
}
function endSes(gid, d){
  var k = sesKey(gid,d);
  if(!DB.sessions[k]) DB.sessions[k] = { att:{}, at:Date.now() };
  DB.sessions[k].ended = Date.now();
  /* المجموعات اللي بالحصة: نسجّل مستحق لكل حاضر */
  var g = groupById(gid);
  if(g && g.mode==="ses"){
    var att = DB.sessions[k].att || {};
    groupStudents(gid).forEach(function(s){
      var v = att[s.id];
      if(v!=="P" && v!=="L") return;
      var has = DB.sesDue && DB.sesDue.some(function(x){
        return x.sid===s.id && x.gid===gid && x.date===d; });
      if(has) return;
      DB.sesDue = DB.sesDue || [];
      DB.sesDue.push({ id:uid("sd"), sid:s.id, gid:gid, date:d, amount:num(g.fee), paid:false });
    });
  }
  saveSync();
}
/* مستحق حصص الطالب (للمجموعات اللي بالحصة) */
function sesDueOf(sid){
  var due=0, paid=0;
  (DB.sesDue||[]).forEach(function(x){
    if(x.sid!==sid) return;
    due += num(x.amount);
    if(x.paid) paid += num(x.amount);
  });
  return { due:due, paid:paid, rest:Math.max(0,due-paid) };
}
function sesOf(gid, d){ return DB.sessions[sesKey(gid,d)] || null; }
function attOf(gid, d, sid){ var s = sesOf(gid,d); return s ? (s.att||{})[sid] : undefined; }
function setAtt(gid, d, sid, v){
  var k = sesKey(gid,d);
  if(!DB.sessions[k]) DB.sessions[k] = { att:{}, at:Date.now() };
  if(!DB.sessions[k].att) DB.sessions[k].att = {};
  if(v) DB.sessions[k].att[sid] = v; else delete DB.sessions[k].att[sid];
  save();
}
/* مواعيد المجموعة: أيام الأسبوع + الوقت */
function groupToday(d){
  var dow = dowOf(d);
  return DB.groups.filter(function(g){
    return g.status!=="off" && (g.days||[]).indexOf(dow)>=0;
  }).sort(function(a,b){ return String(a.time||"").localeCompare(String(b.time||"")); });
}
function attStats(sid, gid){
  var tot=0, pres=0;
  for(var k in DB.sessions){
    var p = k.split("|");
    if(gid && p[0]!==gid) continue;
    var v = (DB.sessions[k].att||{})[sid];
    if(v===undefined) continue;
    tot++; if(v==="P"||v==="L") pres++;   /* المتأخر حاضر بس متأخر */
  }
  return { tot:tot, pres:pres, abs:tot-pres, rate: tot? Math.round(pres/tot*100) : 100 };
}

          (done? ' · اترصد '+ar(done)+(absN?' · '+ar(absN)+' غايب':'') : ' · لسه ماترصدش')+
        '</small></span>'+
        (function(){
          var stt = sesState(g.id, d);
          if(stt==="done") return '<span class="tag ok">خلصت</span>';
          if(stt==="live") return '<span class="tag warn">جارية</span>';
          return '<span class="tag">لسه</span>';
        })()+
        '<span class="chev">‹</span></button>';
    });
  }
  h += '</div></div>';

  /* المتأخرين */
  if(late.length){
    h += '<div class="card"><div class="hd"><h3>متأخرين في الدفع</h3>'+
      '<span class="tag bad">'+ar(late.length)+'</span></div><div class="bd flush">';
    late.slice(0,6).forEach(function(s){
      var due = studentDue(s);
      h += '<button class="item" data-act="openStu" data-s="'+s.id+'">'+
        '<span class="av b">'+esc(initials(s.name))+'</span>'+
        '<span class="tx"><b>'+esc(s.name)+'</b><small>'+
          esc(studentGroups(s).map(function(g){ return g.name; }).join(" · ")||"مفيش مجموعات")+'</small></span>'+
        '<span class="tag bad">'+money(due.rest)+'</span><span class="chev">‹</span></button>';
    });
    if(late.length>6) h += '<button class="item" data-act="tab" data-t="money">'+
      '<span class="tx mut" style="text-align:center">…وكمان '+ar(late.length-6)+' — شوف كل المتأخرات</span></button>';
    h += '</div></div>';
  }
  if(!DB.groups.length) h += firstRun();
  return h;
}

    stat("متأخر", money(dueN), "", dueN?"late":"")+

      '<span class="tx"><b>'+esc(s.name)+'</b><small>'+

      '</small></span>'+
      (d2.rest? '<span class="tag bad">'+money(d2.rest)+'</span>' : '<span class="tag ok">سديد</span>')+
      '<span class="chev">‹</span></button>';
  });
  h += '</div></div>';

        (a? ' · '+ar(a)+' غايب':'')+'</small></span><span class="chev">‹</span></button>';
    });

  return h;

function viewStudent(sid){
  var s = studentById(sid);
  if(!s){ UI.sub=null; return viewStudents(); }
  var gs = studentGroups(s), d = studentDue(s);
  var h = back("الطلاب","backStuds");
  h += pageHd(s.name, esc([s.grade, s.phone].filter(Boolean).join(" · ")),
    '<button class="btn ghost sm" data-act="editStu" data-s="'+sid+'">تعديل</button>'+
    (contactOf(s)? '<button class="btn sm" data-act="waStu" data-s="'+sid+'" data-k="plain">✆ واتساب</button>':'')+
    (contactOf(s) && d.rest? '<button class="btn ghost sm" data-act="waDue" data-s="'+sid+'">✆ تذكير بالمستحق</button>':'')+
    (contactOf(s)? '<a class="btn ghost sm" href="tel:'+esc(contactOf(s))+'" style="text-decoration:none">☎ اتصال</a>':''));

  h += '<div class="stats">'+
    stat("المستحق", money(d.due), "من أول اشتراكه", "")+
    stat("المدفوع", money(d.paid), "", "money")+
    stat("المتبقي", money(d.rest), d.rest? "متأخر" : "سديد", d.rest?"late":"")+
  '</div>';

  /* مستوى الطالب من امتحاناته */
  var lv = studentLevel(sid), tr = taskRate(sid);
  if(lv || tr.tot){
    h += '<div class="stats">'+
      (lv? stat("متوسط الامتحانات", ar(lv.avg)+"٪",
           ar(lv.n)+" امتحان"+(lv.trend!=null? (lv.trend>0? " · تحسّن "+ar(lv.trend)+"٪" : (lv.trend<0? " · نزل "+ar(-lv.trend)+"٪":"")) :""),
           lv.avg>=70?"money":(lv.avg>=50?"warn":"late")) : "")+
      (tr.tot? stat("التزام الواجبات", ar(tr.pct)+"٪", ar(tr.done)+" من "+ar(tr.tot),
           tr.pct>=80?"money":(tr.pct>=50?"warn":"late")) : "")+
    '</div>';
  }
  if(s.famId){
    var fm = famById(s.famId);
    if(fm) h += '<div class="note" style="margin-bottom:12px">من <b>'+esc(fm.name)+'</b> — '+
      '<button class="btn ghost sm" data-act="openFam" data-f="'+fm.id+'">شوف الأسرة</button></div>';
  }
  if(!gs.length){
    h += '<div class="note warn">الطالب ده مش في أي مجموعة — ضيفه لمجموعة عشان تحسبله الحضور والفلوس.'+
      '<div style="margin-top:8px"><button class="btn sm" data-act="editStu" data-s="'+sid+'">حطّه في مجموعة</button></div></div>';
  }

  /* ============ شريط الشهور لكل مجموعة ============ */
  gs.forEach(function(g){
    var due = dueMonths(s,g);
    var a = attStats(s.id, g.id);
    h += '<div class="card"><div class="hd"><h3>'+esc(g.name)+'</h3>'+
      '<span class="tag">'+money(g.fee)+'/شهر</span></div><div class="bd">'+
      '<div class="mut" style="font-size:12px;margin-bottom:7px">'+
        'دوس على الشهر عشان تسجّل الدفع أو تلغيه'+
        (a.tot? ' · الحضور '+ar(a.rate)+'٪' : '')+'</div>'+
      '<div class="months">'+
      schoolMonths().map(function(mi){
        var paid = isPaid(s.id,g.id,mi);
        var isDue = due.indexOf(mi)>=0;
        var cls = paid ? "paid" : (isDue ? "due" : "next");
        return '<button class="mo '+cls+'" data-act="togglePay" data-s="'+s.id+'" data-g="'+g.id+
          '" data-m="'+mi+'" title="'+esc(MONTHS[mi-1])+(paid?" — مدفوع":(isDue?" — متأخر":" — لسه"))+'">'+
          ar(mi)+'</button>';
      }).join("")+'</div>'+
      '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:11.5px" class="mut">'+
        '<span><span class="mo paid" style="width:12px;height:12px;display:inline-block;vertical-align:-2px"></span> مدفوع</span>'+
        '<span><span class="mo due" style="width:12px;height:12px;display:inline-block;vertical-align:-2px"></span> متأخر</span>'+
        '<span><span class="mo next" style="width:12px;height:12px;display:inline-block;vertical-align:-2px"></span> لسه ما جاش</span>'+
      '</div></div></div>';
  });

  /* سجل حضور الطالب — كل حصة وحالته فيها */
  var hist = [];
  for(var k in DB.sessions){
    var p2 = k.split("|");
    var v2 = (DB.sessions[k].att||{})[sid];
    if(v2===undefined) continue;
    var g2 = groupById(p2[0]);
    hist.push({ date:p2[1], g:g2, v:v2 });
  }
  hist.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  if(hist.length){
    var aAll = attStats(sid, null);
    h += '<div class="card"><div class="hd"><h3>سجل الحضور</h3>'+
      '<span class="tag '+(aAll.rate>=80?"ok":(aAll.rate>=60?"warn":"bad"))+'">'+
      ar(aAll.rate)+'٪</span></div><div class="bd flush">';
    hist.slice(0,20).forEach(function(x){
      var L2 = x.v==="P"? ["حاضر","g","✓"] : (x.v==="L"? ["متأخر","w","⏱"] : ["غايب","b","✕"]);
      h += '<div class="item" style="cursor:default">'+
        '<span class="av '+L2[1]+'">'+L2[2]+'</span>'+
        '<span class="tx"><b>'+fmtD(x.date)+'</b><small>'+
          esc(x.g?x.g.name:"—")+' · '+esc(DAYS[dowOf(x.date)])+'</small></span>'+
        '<span class="tag '+(x.v==="P"?"ok":(x.v==="L"?"warn":"bad"))+'">'+L2[0]+'</span></div>';
    });
    if(hist.length>20) h += '<div class="item mut" style="cursor:default;justify-content:center">'+
      '<span class="tx" style="text-align:center">…وكمان '+ar(hist.length-20)+' حصة</span></div>';
    h += '</div></div>';
  }

  /* سجل الدفعات */
  var mine = DB.pays.filter(function(p){ return p.sid===sid; })
    .sort(function(a,b){ return (b.at||0)-(a.at||0); });
  if(mine.length){
    h += '<div class="card"><div class="hd"><h3>سجل الدفعات</h3>'+
      '<button class="btn ghost sm" data-act="printStu" data-s="'+sid+'">⎙ إيصال</button></div><div class="bd flush">';
    mine.slice(0,12).forEach(function(p){
      var g = groupById(p.gid);
      h += '<div class="item" style="cursor:default"><span class="av">✓</span>'+
        '<span class="tx"><b>'+esc(MONTHS[p.mi-1])+' — '+esc(g?g.name:"—")+'</b>'+
        '<small>'+fmtD(p.date)+'</small></span>'+
        '<span class="tag ok">'+money(p.amount)+'</span></div>';
    });
    h += '</div></div>';
  }
  return h;
}

/* ============================================================
   سجل الحصص — كل حصة اترصدت
   ============================================================ */
function allSessions(){
  var out = [];
  for(var k in DB.sessions){
    var p = k.split("|");
    var g = groupById(p[0]);
    if(!g) continue;
    var o = DB.sessions[k], att = o.att||{};
    var pres=0, abs=0, late=0, n2=0;
    for(var sid in att){
      n2++;
      if(att[sid]==="P") pres++;
      else if(att[sid]==="A") abs++;
      else if(att[sid]==="L") late++;
    }
    out.push({ gid:p[0], date:p[1], g:g, n:n2, pres:pres, abs:abs, late:late,
               state: o.ended? "done" : (o.started||n2? "live":"none") });
  }
  return out.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}
function viewSessionLog(){
  var gid = UI.shG || "";
  var all = allSessions();
  var list = gid ? all.filter(function(x){ return x.gid===gid; }) : all;
  var h = pageHd("سجل الحصص", ar(all.length)+" حصة اترصدت",

    '<th>المحصّل</th><th>الحضور</th></tr></thead><tbody>';

        exp += num(g.fee);
        if(isPaid(s.id,g.id,mi)) got += num(g.fee);
      });
      var a = attStats(s.id,g.id); tot += a.tot; pres += a.pres;
    });
    h += '<tr><td><b>'+esc(g.name)+'</b></td><td class="num">'+ar(st.length)+'</td>'+
      '<td>'+money(g.fee)+'</td><td>'+money(exp)+'</td>'+

      '<td class="num">'+(tot? ar(Math.round(pres/tot*100))+"٪" : "—")+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  /* أكتر الطلاب غيابًا */
  var byAbs = activeStudents().map(function(s){

        '<span class="tag warn">'+ar(x.a.abs)+' غياب</span></button>';
    });
    h += '</div></div>';
  }

  h += '<div class="card"><div class="hd"><h3>البيانات</h3></div><div class="bd">'+
    '<div class="note">بياناتك محفوظة على جهازك بس. خد نسخة احتياطية بانتظام.</div>'+
    '<div class="row" style="margin-top:10px">'+

    '</div></div></div>';

}

  studs.sort(function(a,b){ return normAr(a.name)<normAr(b.name)?-1:1; });
  var me = GATE.sid ? studs.filter(function(x){ return x.id===GATE.sid; })[0] : null;

  var h = '<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap">'+
    '<div style="flex:1;min-width:160px"><h2 style="font-size:20px">'+esc(g.name||"مجموعتي")+'</h2>'+

    '<button class="btn ghost sm" data-act="gOut">خروج</button></div>';

  /* اختيار الاسم — عشان يشوف التعليمات الشخصية */
  if(studs.length && !me){
    h += '<div class="card"><div class="hd"><h3>مين فيكم؟</h3></div><div class="bd">'+
      '<div class="note" style="margin-bottom:10px">اختار اسمك عشان تشوف التعليمات الموجهة ليك.</div>'+
      '<div class="row">'+studs.map(function(x){
        return '<button class="btn ghost sm" data-act="gWho" data-s="'+esc(x.id)+'">'+esc(x.name)+'</button>';
      }).join("")+'</div></div></div>';
  }else if(me){
    h += '<div class="note ok" style="margin-bottom:12px">أهلًا <b>'+esc(me.name)+'</b> 👋'+
      ' <button class="btn ghost sm" data-act="gWho" data-s="" style="margin-inline-start:6px">مش أنا</button></div>';
  }

  /* المواعيد */
  var days = (g.days||[]).map(function(d){ return DAYS[d]; });
  h += '<div class="card"><div class="hd"><h3>مواعيد حصصي</h3></div><div class="bd">'+
    (days.length
      ? '<div class="row" style="margin-bottom:10px">'+days.map(function(d){
          var isToday = DAYS[dowOf(today())]===d;
          return '<span class="tag '+(isToday?"ok":"")+'" style="font-size:13px;padding:7px 13px">'+
            esc(d)+(isToday?" — النهاردة":"")+'</span>'; }).join("")+'</div>'
      : '<div class="mut">المواعيد لسه ماتحددتش.</div>')+
    '<div class="grid2">'+
      (g.time? '<div><div class="mut" style="font-size:12px">الساعة</div>'+
        '<div class="dsp" style="font-size:20px;direction:ltr">'+esc(g.time)+'</div></div>':'')+
      (g.place? '<div><div class="mut" style="font-size:12px">المكان</div>'+
        '<div class="dsp" style="font-size:16px">'+esc(g.place)+'</div></div>':'')+
    '</div></div></div>';

  /* الحصة الجاية */

      fmtD(m.date||"")+'</small></span></div>';
  });
  h += '</div></div>';

  /* بيانات المدرّس */
  h += '<div class="card"><div class="hd"><h3>التواصل</h3></div><div class="bd">'+
    '<div style="font-family:Cairo,sans-serif;font-weight:800;font-size:16px">'+esc(T.name||DB.meta.name)+'</div>'+
    '<div class="mut" style="font-size:13px;margin-bottom:9px">'+esc(T.about||T.subject||"")+'</div>'+

      '☎ اتصل بالمدرّس — '+esc(T.phone)+'</a>':'')+
    '</div></div>';
  return h;
}
function nextSession(g){
  var days = g.days||[];
  if(!days.length) return null;
  var d = new Date();
  for(var i=0;i<8;i++){
    var dw = d.getDay();
    if(days.indexOf(dw)>=0)
      return { label: (i===0? "النهاردة "+DAYS[dw] : (i===1? "بكرة "+DAYS[dw] : DAYS[dw]+" "+fmtD(iso(d)))) };
    d.setDate(d.getDate()+1);
  }
  return null;
}

/* ============================================================
   الاستيراد
   بتلزق البيانات من إكسيل (نسخ ولصق) أو ترفع ملف CSV.
   الأعمدة: اسم الطالب · المجموعة (اسم أو كود) · الأيام · السعر الشهري
   الربط بيتم بكود المجموعة الأول، وبعده بالاسم. والمجموعة اللي
   مش موجودة بتتعمل بكود جديد.
   ============================================================ */
var IMP_COLS = [
  { k:"name",  label:"اسم الطالب",   al:["اسم الطالب","الاسم","اسم","الطالب","student","name"] },
  { k:"group", label:"المجموعة",     al:["المجموعة","المجموعه","مجموعة","مجموعه","group","الكود","كود","كود المجموعة"] },
  { k:"days",  label:"الأيام",       al:["الأيام","الايام","اليوم","المواعيد","days","يوم"] },
  { k:"fee",   label:"السعر الشهري", al:["السعر الشهري","السعر","الاشتراك","الشهري","المبلغ","fee","price"] },
  { k:"time",  label:"الوقت",        al:["الوقت","الساعة","الساعه","time"] },
  { k:"grade", label:"الصف",         al:["الصف","المرحلة","المرحله","grade","class"] },
  { k:"phone", label:"الهاتف",       al:["الهاتف","التليفون","الموبايل","phone","تليفون"] },
  { k:"guard", label:"ولي الأمر",    al:["ولي الأمر","ولي الامر","الوالد","guardian"] },
  { k:"gphone",label:"هاتف ولي الأمر",al:["هاتف ولي الأمر","هاتف ولي الامر","تليفون ولي الأمر"] }
];
/* بيفهم الأيام من أي صيغة: «سبت اتنين» · «السبت والاثنين» · «سبت،اثنين» */
function parseDays(txt){
  var t = normAr(txt);
  if(!t) return [];
  var out = [];
  var map = [
    [0, /احد|الاحد|sun/],
    [1, /اثنين|الاثنين|اتنين|mon/],
    [2, /ثلاثاء|الثلاثاء|تلات|tue/],
    [3, /اربعاء|الاربعاء|اربع|wed/],
    [4, /خميس|الخميس|thu/],
    [5, /جمعه|الجمعه|fri/],
    [6, /سبت|السبت|sat/]
  ];
  map.forEach(function(m){ if(m[1].test(t) && out.indexOf(m[0])<0) out.push(m[0]); });
  return out.sort();
}
/* بيقسّم النص المُلصق: تاب أو فاصلة أو أكتر من مسافتين */
function splitRow(line){
  if(line.indexOf("\t")>=0) return line.split("\t");
  if(line.indexOf(",")>=0 && line.split(",").length>=2) return splitCsv(line);
  return line.split(/\s{2,}|\s*\|\s*/);
}
function splitCsv(line){
  var out=[], cur="", q=false;
  for(var i=0;i<line.length;i++){
    var c = line[i];
    if(c==='"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if(c==="," && !q){ out.push(cur); cur=""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
/* بيحلّل النص لصفوف جاهزة */
function parseImport(text){
  var lines = String(text||"").split(/\r?\n/).map(function(l){ return l.trim(); })
    .filter(function(l){ return l.length; });
  if(!lines.length) return { rows:[], map:[], head:[] };
  var first = splitRow(lines[0]).map(function(c){ return c.trim(); });
  /* هل السطر الأول عناوين؟ */
  var map = first.map(function(c){
    var k = normAr(c);
    for(var i=0;i<IMP_COLS.length;i++)
      for(var j=0;j<IMP_COLS[i].al.length;j++)
        if(normAr(IMP_COLS[i].al[j])===k) return IMP_COLS[i].k;
    return "";
  });
  var hasHead = map.filter(Boolean).length >= 2;
  if(!hasHead){
    /* من غير عناوين: الترتيب المتوقع */
    map = ["name","group","days","fee","time","grade","phone","guard","gphone"].slice(0, first.length);
  }
  var body = hasHead ? lines.slice(1) : lines;
  var rows = [];
  body.forEach(function(l, i){
    var c = splitRow(l).map(function(x){ return String(x||"").trim().replace(/^"|"$/g,""); });
    var o = { _line: i+1+(hasHead?1:0) };
    map.forEach(function(k, ci){ if(k && c[ci]!==undefined) o[k] = c[ci]; });
    if(!o.name) return;
    rows.push(o);
  });
  return { rows:rows, map:map, head: hasHead? first : [] };
}
/* المعاينة قبل التنفيذ */
function importPreview(rows){
  var newG = {}, seen = {};
  var out = rows.map(function(r){
    var gTxt = String(r.group||"").trim();
    var g = gTxt ? (groupByCode(gTxt) || groupByName(gTxt)) : null;
    var isNew = false;
    if(!g && gTxt){
      if(!newG[normAr(gTxt)]){
        newG[normAr(gTxt)] = { name:gTxt, days:parseDays(r.days), fee:num(r.fee),
                               time:String(r.time||"").trim() };
      }
      isNew = true;
    }
    var st = null, dup = false;
    var nk = normAr(r.name);
    for(var i=0;i<DB.students.length;i++)
      if(normAr(DB.students[i].name)===nk){ st = DB.students[i]; break; }
    if(seen[nk+"|"+normAr(gTxt)]) dup = true;
    seen[nk+"|"+normAr(gTxt)] = 1;
    return { r:r, g:g, gTxt:gTxt, isNew:isNew, exist:st, dup:dup };
  });
  return { rows:out, newGroups:Object.keys(newG).map(function(k){ return newG[k]; }) };
}
function modalImport(){
  UI.impText = UI.impText || "";
  var pv = UI.impText ? importPreview(parseImport(UI.impText).rows) : null;
  var body = '<div class="mb">'+
    '<div class="note" style="margin-bottom:11px">'+
      'انسخ البيانات من إكسيل والزقها هنا، أو ارفع ملف CSV.<br>'+
      '<b>الأعمدة:</b> اسم الطالب · المجموعة · الأيام · السعر الشهري '+
      '<span class="mut">(والوقت والصف والهاتف اختياريين)</span><br>'+
      'المجموعة تقدر تكتبها <b>بالاسم أو بالكود</b> — واللي مش موجودة هتتعمل بكود جديد.'+

function doImport(){
  var res = parseImport(UI.impText);
  var pv = importPreview(res.rows);
  if(!pv.rows.length){ toast("مفيش صفوف"); return; }
  var addG = 0, addS = 0, updS = 0, link = 0;
  pv.rows.forEach(function(x){
    if(x.dup) return;
    var r = x.r;
    /* المجموعة: بالكود ثم بالاسم، وإلا نعملها */
    var g = x.gTxt ? (groupByCode(x.gTxt) || groupByName(x.gTxt)) : null;
    if(!g && x.gTxt){
      g = { id:uid("g"), code:genGroupCode(x.gTxt), name:x.gTxt, subject:DB.meta.subject||"",
            grade:String(r.grade||"").trim(), days:parseDays(r.days), time:String(r.time||"").trim(),
            fee:num(r.fee), place:"", status:"on" };
      DB.groups.push(g); addG++;
    }else if(g){
      /* بنكمّل الناقص بس — مبنغيّرش اللي متسجّل */
      var d2 = parseDays(r.days);
      if(d2.length && !(g.days||[]).length) g.days = d2;
      if(num(r.fee) && !num(g.fee)) g.fee = num(r.fee);
      if(r.time && !g.time) g.time = String(r.time).trim();
    }
    /* الطالب */
    var nk = normAr(r.name), st = null;
    for(var i=0;i<DB.students.length;i++)
      if(normAr(DB.students[i].name)===nk){ st = DB.students[i]; break; }
    if(!st){
      st = { id:uid("s"), name:String(r.name).trim(), status:"on", groups:[],
             joinMonth:schoolMonths()[0], at:Date.now() };
      DB.students.push(st); addS++;
    }else updS++;
    if(r.grade && !st.grade) st.grade = String(r.grade).trim();
    if(r.phone && !st.phone) st.phone = String(r.phone).trim();
    if(r.guard && !st.guard) st.guard = String(r.guard).trim();
    if(r.gphone && !st.guardPhone) st.guardPhone = String(r.gphone).trim();
    if(g){
      st.groups = st.groups || [];
      if(st.groups.indexOf(g.id)<0){ st.groups.push(g.id); link++; }
    }
  });
  saveSync(); UI.impText=""; closeModal(); UI.tab="studs"; UI.sub=null; render();
  toast("اتضاف "+ar(addS)+" طالب"+(addG? " · "+ar(addG)+" مجموعة":"")+
        (updS? " · اتحدّث "+ar(updS):""));
}

function scanHit(code){

  if((s.groups||[]).indexOf(gid)<0){

  var d = today();
  if(attOf(gid,d,s.id)==="P"){ toast(s.name+" متسجّل قبل كده"); return; }
  setAtt(gid, d, s.id, "P");
  UI.scanLog = UI.scanLog || [];
  UI.scanLog.unshift({ name:s.name, time:new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}) });
  var box = document.getElementById("sc_log");
  if(box) box.innerHTML = scanLogHTML();
  var c = document.getElementById("sc_code"); if(c) c.value = "";
  try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}

var SCAN = { stream:null, timer:null };
function scanStart(){
  var box = document.getElementById("sc_cam");
  if(!box) return;
  if(!navigator.mediaDevices || !window.BarcodeDetector){
    box.textContent = "المتصفح ده مايدعمش الماسح — اكتب الكود بالإيد تحت";
    return;
  }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(function(st){
    SCAN.stream = st;
    box.innerHTML = "";
    var v = document.createElement("video");
    v.setAttribute("playsinline","");
    v.style.cssText = "width:100%;height:100%;object-fit:cover";
    v.srcObject = st; v.play();
    box.appendChild(v);
    var det = new window.BarcodeDetector({ formats:["qr_code"] });
    SCAN.timer = setInterval(function(){
      det.detect(v).then(function(codes){
        if(codes && codes.length) scanHit(codes[0].rawValue);
      }).catch(function(){});
    }, 700);
  }).catch(function(){
    box.textContent = "مقدرتش أفتح الكاميرا — اسمح بالإذن أو اكتب الكود بالإيد";
  });
}
function scanStop(){
  if(SCAN.timer){ clearInterval(SCAN.timer); SCAN.timer=null; }
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(function(t){ t.stop(); }); SCAN.stream=null; }
  var box = document.getElementById("sc_cam");
  if(box) box.textContent = "الكاميرا متوقفة";
}

function printCards(ids){

    if(!w){ toast("اسمح بالنوافذ المنبثقة"); return; }
    var cards = ids.map(function(id){
      var s = studentById(id); if(!s) return "";
      if(!s.code) s.code = genStuCode();
      var q = okLib ? qrSVG(s.code, 130) : "";
      return '<div class="c">'+
        '<div class="t">'+esc(DB.meta.name||"")+' — '+esc(DB.meta.subject||"")+'</div>'+
        '<div class="q">'+(q || '<div class="nq">'+esc(s.code)+'</div>')+'</div>'+
        '<div class="n">'+esc(s.name)+'</div>'+
        '<div class="k">'+esc(s.code)+'</div></div>';
    }).join("");
    saveSync();
    w.document.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">'+
      '<title>كروت الطلاب</title><style>'+
      '@page{size:A4;margin:10mm}'+
      'body{margin:0;font-family:system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:6mm;padding:4mm}'+
      '.c{width:56mm;border:1.5px solid #1F4FD8;border-radius:5mm;padding:4mm;text-align:center;'+
        'break-inside:avoid;background:linear-gradient(#EEF3FF 1px,transparent 1px) 0 0/6mm 6mm,#fff}'+
      '.t{font-size:8pt;color:#63748C;margin-bottom:2mm}'+
      '.q{display:grid;place-items:center;min-height:34mm}'+
      '.nq{font-size:20pt;font-weight:bold;letter-spacing:3px;direction:ltr}'+
      '.n{font-size:11pt;font-weight:bold;margin-top:2mm}'+
      '.k{font-size:13pt;font-weight:bold;letter-spacing:2px;direction:ltr;color:#1F4FD8}'+
      '</style></head><body>'+cards+'</body></html>');
    w.document.close();
    setTimeout(function(){ w.print(); }, 700);
  });
}

/* ---------- تصدير ونسخ ---------- */
function dl(name, text, type){
  var b = new Blob(["\ufeff"+text], { type: type||"text/plain;charset=utf-8" });
  var u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 800);
}
function exportCsv(){
  var rows = [["الطالب","الصف","الهاتف","ولي الأمر","هاتف ولي الأمر","المجموعات",
               "المستحق","المدفوع","المتبقي","نسبة الحضور"]];
  activeStudents().forEach(function(s){
    var d = studentDue(s), a = attStats(s.id, null);
    rows.push([s.name, s.grade||"", s.phone||"", s.guard||"", s.guardPhone||"",
      studentGroups(s).map(function(g){ return g.name; }).join(" | "),
      d.due, d.paid, d.rest, a.tot? a.rate+"%" : ""]);
  });
  dl("دروسي-الطلاب.csv", rows.map(function(r){
    return r.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(",");
  }).join("\n"), "text/csv;charset=utf-8");
  toast("اتصدّر");
}
function backup(){
  dl("دروسي-نسخة-"+today()+".json", JSON.stringify(DB), "application/json");
  toast("اتحفظت النسخة");
}
function restore(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var o = JSON.parse(r.result);
        if(!o || !o.meta || !Array.isArray(o.groups)) throw new Error("ملف مش سليم");
        if(!confirm("استرجاع النسخة دي؟\n\nهتستبدل كل البيانات الحالية.")) return;
        DB = o; save(); UI={tab:"home",sub:null,q:"",gid:"",date:""}; render();
        toast("اترجّعت النسخة");
      }catch(e){ toast("الملف مش سليم"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   الدخول والمزامنة الفعلية
   ============================================================ */
function gErr(e){
  var m = String((e && e.code) || (e && e.message) || e);
  if(/wrong-password|invalid-cred|invalid-login/.test(m))
    return "كلمة السر غلط — لو دي أول مرة، اكتب اللي عايزها واضغط دخول وهتتحفظ";
  if(/user-not-found/.test(m))       return "مفيش حساب لسه";
  if(/email-already-in-use/.test(m)) return "فيه كلمة سر متسجّلة — اكتبها للدخول";
  if(/requires-recent-login/.test(m))return "سجّل خروج وادخل تاني الأول";
  if(/operation-not-allowed/.test(m))return "فعّل Email/Password من فايربيز الأول";
  if(/weak-password/.test(m))        return "كلمة السر قصيرة — ٦ حروف على الأقل";
  if(/network/.test(m))              return "مفيش اتصال بالنت";
  if(/too-many/.test(m))             return "محاولات كتير — استنى شوية";
  return "حصلت مشكلة: " + m;
}
function gAuth(){
  if(!fbInit()){ GATE.msg="مش قادر أوصل للسحابة — اتأكد من النت"; render(); return; }
  var pw = val("ga_pw");
  var setup = (GATE.claimed===false);
  if(!pw){ GATE.msg="اكتب كلمة السر"; render(); return; }
  if(setup){
    if(pw.length<6){ GATE.msg="كلمة السر قصيرة — ٦ حروف على الأقل"; render(); return; }
    if(pw !== val("ga_pw2")){ GATE.msg="كلمتا السر مش متطابقتين"; render(); return; }
  }
  GATE.busy = true; GATE.msg=""; render();
  /* ============================================================
     فايربيز الجديد بيخفي إن الحساب مش موجود ويرجّع «بيانات غلط»
     زي كلمة السر الغلط بالظبط — عشان محدش يخمّن الحسابات.
     فبنجرّب الدخول الأول، ولو فشل بنجرّب نعمل الحساب. لو طلع
     موجود بالفعل يبقى فعلًا كلمة السر غلط.
     ============================================================ */
  var f = setup
    ? FB.auth.createUserWithEmailAndPassword(TEACHER_EMAIL,pw)
    : FB.auth.signInWithEmailAndPassword(TEACHER_EMAIL,pw).catch(function(e){
        var m = String((e&&e.code)||"");
        if(!/user-not-found|invalid-cred|invalid-login|wrong-password/.test(m)) throw e;
        if(pw.length<6) throw { code:"auth/weak-password" };
        if(!confirm("مفيش كلمة سر متسجّلة لحد دلوقتي.\n\n"+
                    "تحب نحفظ اللي كتبته دلوقتي ككلمة سر البرنامج؟\n"+
                    "لو ده مش قصدك اضغط إلغاء وحاول تاني.")) throw e;
        return FB.auth.createUserWithEmailAndPassword(TEACHER_EMAIL,pw)
          .catch(function(e2){
            var m2 = String((e2&&e2.code)||"");
            /* الحساب موجود فعلًا — يبقى كلمة السر غلط */
            if(/email-already-in-use/.test(m2)) throw e;
            throw e2;
          });
      });
  f.then(function(c){
    FB.uid = c.user.uid;
    /* أول حساب بيسجّل نفسه كمالك — بعد كده الباب بيتقفل */
    return fbGet("config/teacherUid").then(function(t){
      if(!t) return fbSet("config/teacherUid", FB.uid).then(function(){ return FB.uid; });
      return t;
    });
  }).then(function(t){
    FB.teacherUid = t;
    if(t !== FB.uid){
      GATE.busy=false; GATE.msg="الحساب ده مش مالك البرنامج";
      try{ FB.auth.signOut(); }catch(e){}
      render(); return;
    }
    FB.role = "teacher";
    try{ localStorage.setItem(KEY+"_sess", JSON.stringify({r:"teacher"})); }catch(e){}
    GATE.busy=false;
    return syncDown().then(function(got){
      if(!got) syncUp();
      UI.tab="home"; UI.sub=null; render();
      toast(got? "أهلًا — البيانات اتحمّلت" : "أهلًا " + (DB.meta.name||""));
    });
  }).catch(function(e){
    var m = String((e&&e.code)||"");
    /* الحساب موجود بس كلمة السر غلط، أو مش موجود ولسه محدش أخد الملكية */
    if(/user-not-found/.test(m) && GATE.claimed!==true){
      GATE.claimed = false; GATE.busy=false;
      GATE.msg = "لسه مفيش كلمة سر — اختار واحدة دلوقتي"; render(); return;
    }
    if(/email-already-in-use/.test(m)){
      GATE.claimed = true; GATE.busy=false;
      GATE.msg = "فيه كلمة سر متسجّلة بالفعل — اكتبها للدخول"; render(); return;
    }
    GATE.busy=false; GATE.msg=gErr(e); render();
  });
}

function gStudentIn(){
  if(!fbInit()){ GATE.msg="مش قادر أوصل للسحابة — اتأكد من النت"; render(); return; }
  var code = normCode(val("ga_code"));
  if(code.length<3){ GATE.msg="اكتب كود المجموعة"; render(); return; }
  GATE.busy=true; GATE.msg=""; GATE.code=code; render();
  FB.auth.signInAnonymously().then(function(c){
    FB.uid = c.user.uid;
    return Promise.all([ fbGet("pub/groups/"+code), fbGet("pub/teacher") ]);
  }).then(function(r){
    var g = r[0];
    if(!g){ GATE.busy=false; GATE.msg="الكود ده مش موجود — اتأكد منه مع المدرّس"; render(); return; }
    if(g.status==="off"){ GATE.busy=false; GATE.msg="المجموعة دي متوقفة حاليًا"; render(); return; }
    GATE.grp = g; GATE.teacher = r[1]||{};
    FB.role = "student"; GATE.busy=false;
    try{ localStorage.setItem(KEY+"_sess", JSON.stringify({r:"student",c:code,s:GATE.sid||""})); }catch(e){}
    return gLoadNotices().then(function(){ render(); });
  }).catch(function(e){
    GATE.busy=false; GATE.msg=gErr(e); render();
  });
}
function gLoadNotices(){
  if(!fbOn() || !GATE.code) return Promise.resolve();
  return fbGet("pub/notices").then(function(all){
    all = all || {};
    var out = [];
    Object.keys(all).forEach(function(k){
      var m = all[k]; if(!m || !m.text) return;
      if(m.to==="all"){ out.push({ text:m.text, at:m.at, date:m.date, to:"all" }); return; }
      if(m.code && normCode(m.code)===GATE.code){
        if(m.sid){ if(GATE.sid && m.sid===GATE.sid) out.push({ text:m.text, at:m.at, date:m.date, to:"me" }); }
        else out.push({ text:m.text, at:m.at, date:m.date, to:"grp" });
      }
    });
    GATE.notices = out;
  }).catch(function(){ GATE.notices = []; });
}
/* المدرّس بيرفع الرسائل للنسخة العامة */
function pushNotices(){
  if(!fbOn() || FB.role!=="teacher" || !FB.db) return;
  var out = {};
  (DB.notices||[]).forEach(function(m){
    var g = m.gid? groupById(m.gid) : null;
    out[m.id] = { text:m.text, at:m.at||0, date:m.date||"",
                  to: m.gid? "grp":"all",
                  code: g? normCode(g.code) : "",
                  sid: m.sid||"" };
  });
  fbSet("pub/notices", out).catch(function(){});
}
/* الحجز — كتابة مفتوحة مقيّدة بالقواعد */
function gSendBooking(){
  if(!fbInit()){ GATE.msg="مش قادر أوصل للسحابة"; GATE.ok=false; render(); return; }
  var nm = val("bk_name").trim(), gr = val("bk_grade"),
      ph = val("bk_phone").trim(), ad = val("bk_addr").trim(), nt = val("bk_note").trim();
  if(nm.length<3){ GATE.msg="اكتب الاسم كامل"; GATE.ok=false; render(); return; }
  if(!gr){ GATE.msg="اختار الصف الدراسي"; GATE.ok=false; render(); return; }
  var d = ph.replace(/\D/g,"");
  if(d.length<10){ GATE.msg="رقم الموبايل مش مظبوط"; GATE.ok=false; render(); return; }
  GATE.busy=true; GATE.msg=""; render();
  FB.auth.signInAnonymously().then(function(){
    return fbPush("bookings", { name:nm.slice(0,60), grade:gr, phone:d.slice(0,15),
      addr:ad.slice(0,120), note:nt.slice(0,200), date:today(), at:Date.now(), status:"new" });
  }).then(function(){
    GATE.busy=false; GATE.ok=true;
    GATE.msg="اتسجّل حجزك ✓ المدرّس هيتواصل معاك على "+d;
    ["bk_name","bk_phone","bk_addr","bk_note"].forEach(function(id){ var e=$("#"+id); if(e) e.value=""; });
    render();
  }).catch(function(e){
    GATE.busy=false; GATE.ok=false; GATE.msg=gErr(e); render();
  });
}
/* المدرّس بيسحب الحجوزات */
function pullBookings(loud){
  if(!fbOn() || FB.role!=="teacher"){ if(loud) toast("مفيش اتصال"); return; }
  fbGet("bookings").then(function(all){
    all = all || {};
    DB.bookings = DB.bookings || [];
    var have = {}; DB.bookings.forEach(function(b){ have[b.id]=b; });
    var add = 0;
    Object.keys(all).forEach(function(k){
      var b = all[k]; if(!b || !b.name) return;
      if(have[k]) return;
      DB.bookings.push({ id:k, name:b.name, grade:b.grade||"", phone:b.phone||"",
        addr:b.addr||"", note:b.note||"", date:b.date||"", at:b.at||0, status:b.status||"new" });
      add++;
    });
    if(add){ save(); render(); }
    if(loud) toast(add? "وصل "+ar(add)+" طلب جديد" : "مفيش طلبات جديدة");
  }).catch(function(){ if(loud) toast("مقدرتش أوصل للسحابة"); });
}

/* استرجاع الجلسة */
function restoreSession(){
  if(!fbInit()) { render(); return; }
  var sess = null;
  try{ sess = JSON.parse(localStorage.getItem(KEY+"_sess")||"null"); }catch(e){}
  FB.auth.onAuthStateChanged(function(u){
    if(!u){ if(FB.role) { FB.role=null; render(); } return; }
    FB.uid = u.uid;
    if(sess && sess.r==="student" && sess.c){
      GATE.code = sess.c; GATE.sid = sess.s||"";
      Promise.all([ fbGet("pub/groups/"+sess.c), fbGet("pub/teacher") ]).then(function(r){
        if(!r[0]) return;
        GATE.grp = r[0]; GATE.teacher = r[1]||{}; FB.role="student";
        gLoadNotices().then(render);
      }).catch(function(){});
      return;
    }
    if(u.isAnonymous) return;
    fbGet("config/teacherUid").then(function(t){
      FB.teacherUid = t;
      if(t && t===u.uid){
        FB.role = "teacher";
        syncDown().then(function(){ pullBookings(false); render(); });
      }
    }).catch(function(){});
  });
  render();
}

/* ---------- الربط ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var fn = ACTS[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener("input", function(e){
  var el = e.target;
  if(el.id==="imp_t"){ UI.impText = el.value; return; }
  if(!el.dataset || el.dataset.act!=="setQ") return;
  UI.q = el.value;
  clearTimeout(window._q);
  window._q = setTimeout(function(){
    var pos = el.selectionStart; render();
    var again = document.querySelector('[data-act="setQ"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(x){} }
  }, 200);
});
document.addEventListener("change", function(e){
  var el = e.target;
  if(el.dataset && el.dataset.act==="setDate"){ UI.date = el.value; render(); }
  if(el.dataset && el.dataset.act==="scanG"){ UI.scanG = el.value; }
  /* رصد درجة امتحان */
  if(el.dataset && el.dataset.act==="setMark"){
    var ex = examById(el.dataset.e);
    if(!ex) return;
    ex.marks = ex.marks || {};
    var v = String(el.value).trim();
    if(v==="") delete ex.marks[el.dataset.s];
    else{
      var x = num(v,0);
      if(x > num(ex.max,100)){ toast("الدرجة أكبر من النهاية العظمى ("+ar(ex.max)+")"); x = num(ex.max,100); }
      if(x < 0) x = 0;
      ex.marks[el.dataset.s] = x;
    }
    saveSync(); render();
  }
});

      { src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any" },
      { src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"maskable" }
    ]
  };
  try{
    var b = new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" });
    document.getElementById("mf").href = URL.createObjectURL(b);
  }catch(e){}
  /* عامل التخزين — بيخلي البرنامج يفتح من غير نت */
  /* ============================================================
     التحديث الفوري
     عامل التخزين كان بيمسك النسخة القديمة، فالمستخدم يفتح البرنامج
     ويلاقيه زي ما هو رغم إننا رفعنا نسخة جديدة.
     دلوقتي بنسأل عن تحديث كل مرة، وأول ما ييجي بنطبّقه ونعيد التحميل.
     ============================================================ */
  if("serviceWorker" in navigator && location.protocol!=="file:"){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.update();
      reg.addEventListener("updatefound", function(){
        var w = reg.installing;
        if(!w) return;
        w.addEventListener("statechange", function(){
          if(w.state==="installed" && navigator.serviceWorker.controller){
            toast("فيه تحديث — بنحمّله…");
            setTimeout(function(){ location.reload(); }, 900);
          }
        });
      });
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(){});
  }
})();
